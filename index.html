<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>djRoutePlanner - Cockpit Roadbook</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="djRoute">
  <meta name="theme-color" content="#070a10">
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS per importazione Excel universale -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <!-- Chart.js per profilo altimetrico -->

  <style>
    body { 
      background-color: #070a10; 
      color: #f1f5f9; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }

    /* Safe Area superiore per Dynamic Island / Notch iPhone */
    .header-dynamic-island {
      padding-top: max(env(safe-area-inset-top, 56px), 58px) !important;
      padding-bottom: 12px !important;
    }

    /* Sfondo Cinematografico Maxi-Enduro Adventure */
    .bg-cinema-wrap {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -2;
      overflow: hidden;
      background: #05070c;
    }
    .bg-cinema {
      position: absolute;
      top: -8%; left: -8%; width: 116%; height: 116%;
      background: url('https://images.unsplash.com/photo-1558981403-c5f9899a28bc?q=80&w=1920&auto=format&fit=crop') center center / cover no-repeat;
      animation: kenburns 35s ease-in-out infinite alternate;
      filter: brightness(0.28) contrast(1.25) saturate(0.9);
    }
    @keyframes kenburns {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.05) translate(-1%, -1%); }
      100% { transform: scale(1.1) translate(1%, 1%); }
    }
    .cinema-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 50% 15%, rgba(15, 23, 42, 0.72) 0%, rgba(7, 10, 16, 0.94) 65%, rgba(4, 6, 10, 0.99) 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* Struttura Carte TFT Cockpit */
    .tft-card {
      background: linear-gradient(145deg, rgba(17, 24, 39, 0.92) 0%, rgba(10, 15, 26, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .tft-gauge {
      background: rgba(3, 7, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    .scroll-hide::-webkit-scrollbar { display: none; }
    .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* Tendina autocompletamento indirizzi */
    .autocomplete-dropdown {
      position: absolute;
      left: 0; right: 0; top: 100%;
      z-index: 75;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.85rem;
      max-height: 220px;
      overflow-y: auto;
      margin-top: 5px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.85);
    }
    .autocomplete-item {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover, .autocomplete-item:active {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
    }
  </style>
</head>
<body class="pb-24 min-h-screen relative select-none">

  <script>
    let tappe = [];
    let vistaAttuale = "dashboard";
    let indexTappaAttiva = 0;
    let chartInstance = null;
    let debounceTimer = null;

    // Normalizzazione stringhe (rimozione accenti, maiuscole, apostrofi)
    function normalizzaTesto(t) {
      return (t || '')
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/['’]/g, " ")
        .toLowerCase()
        .trim();
    }

    // Input data numerico con auto-separatore /
    function gestisciInputData(input) {
      let v = input.value.replace(/\D/g, '');
      if (v.length > 2 && v.length <= 4) {
        v = v.substring(0, 2) + '/' + v.substring(2);
      } else if (v.length > 4) {
        v = v.substring(0, 2) + '/' + v.substring(2, 4) + '/' + v.substring(4, 8);
      }
      input.value = v;
      document.getElementById('m_giorno').value = calcolaGiornoDaData(v);
    }

    function formattaInGiornoMeseAnno(val) {
      if (!val) return "";
      if (val instanceof Date && !isNaN(val.getTime())) {
        const gg = String(val.getDate()).padStart(2, '0');
        const mm = String(val.getMonth() + 1).padStart(2, '0');
        const aaaa = val.getFullYear();
        return `${gg}/${mm}/${aaaa}`;
      }
      // Se è un numero seriale Excel (es. 45443)
      if (typeof val === 'number' || (!isNaN(val) && String(val).length === 5)) {
        const dateObj = new Date((val - (25567 + 2)) * 86400 * 1000);
        if (!isNaN(dateObj.getTime())) {
          const gg = String(dateObj.getDate()).padStart(2, '0');
          const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
          const aaaa = dateObj.getFullYear();
          return `${gg}/${mm}/${aaaa}`;
        }
      }
      const str = String(val).trim();
      if (str.includes('/')) {
        const p = str.split('/');
        if (p.length === 3) return `${p[0].padStart(2, '0')}/${p[1].padStart(2, '0')}/${p[2]}`;
      }
      if (str.includes('-')) {
        const p = str.split('T')[0].split('-');
        if (p.length === 3) return `${p[2].padStart(2, '0')}/${p[1].padStart(2, '0')}/${p[0]}`;
      }
      return str;
    }

    function calcolaGiornoDaData(strData) {
      if (!strData || strData.length < 10) return "";
      const p = strData.split('/');
      if (p.length !== 3) return "";
      const gg = parseInt(p[0], 10);
      const mm = parseInt(p[1], 10) - 1;
      const aaaa = parseInt(p[2], 10);
      const d = new Date(aaaa, mm, gg);
      if (isNaN(d.getTime())) return "";
      const nomi = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
      return nomi[d.getDay()];
    }

    // Ricerca a campo unico con gestione indirizzo e comune esatto
    function cercaCittaLive(inputElem, dropId) {
      const testoOriginale = inputElem.value.trim();
      const testoPulito = normalizzaTesto(testoOriginale);
      const drop = document.getElementById(dropId);
      clearTimeout(debounceTimer);

      if (testoPulito.length < 2) {
        drop.classList.add('hidden');
        drop.innerHTML = '';
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          const [resOM, resNom] = await Promise.all([
            fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(testoPulito)}&count=5&language=it&format=json`)
              .then(r => r.json()).catch(() => ({ results: [] })),
            fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(testoOriginale)}&format=json&addressdetails=1&limit=6&accept-language=it`)
              .then(r => r.json()).catch(() => [])
          ]);

          let listaRisultati = [];

          if (Array.isArray(resNom)) {
            resNom.forEach(item => {
              const a = item.address || {};
              const via = [a.road, a.house_number].filter(Boolean).join(' ');
              const comune = a.city || a.town || a.village || a.hamlet || a.municipality || item.display_name.split(',')[0];
              const nomeVisualizzato = via ? `${via}, ${comune}` : comune;
              const extra = [a.county || a.state_district, a.state, a.country].filter(Boolean).join(', ');
              if (nomeVisualizzato && !listaRisultati.some(x => x.nome.toLowerCase() === nomeVisualizzato.toLowerCase())) {
                listaRisultati.push({ nome: nomeVisualizzato, extra });
              }
            });
          }

          if (resOM && resOM.results) {
            resOM.results.forEach(r => {
              const extra = [r.admin1, r.country].filter(Boolean).join(', ');
              if (!listaRisultati.some(x => x.nome.toLowerCase() === r.name.toLowerCase())) {
                listaRisultati.push({ nome: r.name, extra });
              }
            });
          }

          if (listaRisultati.length > 0) {
            drop.innerHTML = listaRisultati.map(item => `
              <div class="autocomplete-item" onmousedown="selezionaCitta('${inputElem.id}', '${dropId}', '${item.nome.replace(/'/g, "\\'")}', '${item.extra.replace(/'/g, "\\'")}')">
                <span class="font-bold text-white">${item.nome}</span>
                <span class="text-[11px] text-gray-400 block">${item.extra}</span>
              </div>
            `).join('');
            drop.classList.remove('hidden');
          } else {
            drop.classList.add('hidden');
          }
        } catch(e) {
          drop.classList.add('hidden');
        }
      }, 220);
    }

    // Calcolo automatico km, ore guida e quote
    async function calcolaMetricheRottaAutomatica() {
      const p = document.getElementById('m_partenza').value.trim();
      const a = document.getElementById('m_arrivo').value.trim();
      if (!p || !a) return;

      const pClean = p.split('(')[0].trim();
      const aClean = a.split('(')[0].trim();

      try {
        const [resP, resA] = await Promise.all([
          fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(pClean)}&format=json&limit=1`).then(r => r.json()),
          fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(aClean)}&format=json&limit=1`).then(r => r.json())
        ]);

        if (!resP[0] || !resA[0]) return;

        const start = { lat: parseFloat(resP[0].lat), lon: parseFloat(resP[0].lon) };
        const end = { lat: parseFloat(resA[0].lat), lon: parseFloat(resA[0].lon) };

        const dLat = (end.lat - start.lat) * Math.PI / 180;
        const dLon = (end.lon - start.lon) * Math.PI / 180;
        const h = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(start.lat * Math.PI / 180) * Math.cos(end.lat * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        const distKm = Math.round(6371 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h)) * 1.25);

        const elevResInit = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${start.lat},${end.lat}&longitude=${start.lon},${end.lon}`).then(r => r.json());
        const maxQuotaPunti = Math.max(...elevResInit.elevation);
        
        const andaturaMedia = maxQuotaPunti > 900 ? 70 : 95;
        const oreTot = Math.floor(distKm / andaturaMedia);
        const minTot = Math.round((distKm % andaturaMedia) / andaturaMedia * 60);

        document.getElementById('m_km').value = distKm;
        document.getElementById('m_ore').value = `${oreTot}h ${minTot}m`;

        const ptsLats = [start.lat, (start.lat + end.lat)/2, end.lat].join(',');
        const ptsLons = [start.lon, (start.lon + end.lon)/2, end.lon].join(',');
        const elevRes = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${ptsLats}&longitude=${ptsLons}`).then(r => r.json());
        const quotaMax = Math.max(...elevRes.elevation);
        document.getElementById('m_alt').value = `${quotaMax} m`;

        const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${start.lat}&longitude=${start.lon}&daily=temperature_2m_max,temperature_2m_min&timezone=auto`).then(r => r.json());
        if (wRes.daily && wRes.daily.temperature_2m_min) {
          const tMin = Math.round(wRes.daily.temperature_2m_min[0]);
          const tMax = Math.round(wRes.daily.temperature_2m_max[0]);
          document.getElementById('m_tempMinMax').value = `${tMin}° / ${tMax}°C`;
        }
      } catch(e) {}
    }

    function aggiornaRiepilogo() {
      document.getElementById('totTappeVal').textContent = tappe.length;
      let totKm = 0;
      let totMinuti = 0;

      tappe.forEach(t => {
        const km = parseFloat(t.kmTot) || 0;
        totKm += km;
        if (t.oreGuida && String(t.oreGuida).includes(':')) {
          const [h, m] = t.oreGuida.split(':').map(Number);
          totMinuti += (h * 60) + (m || 0);
        } else if (km > 0) {
          totMinuti += Math.round((km / 90) * 60);
        }
      });

      document.getElementById('totKmVal').textContent = Math.round(totKm) + " km";
      const ore = Math.floor(totMinuti / 60);
      const min = totMinuti % 60;
      document.getElementById('totOreVal').textContent = `${ore}h ${min}m`;
    }

    function popolaTimelineOrariaIniziale(t) {
      const box = document.getElementById('timelineMeteoBox');
      const kmTot = parseFloat(t.kmTot) || 200;
      const numSegmenti = Math.max(2, Math.ceil(kmTot / 90));
      const [hPart, mPart] = (t.oraPartenza || "08:30").split(':').map(Number);

      const pNome = t.partenza ? t.partenza.split('(')[0].trim() : 'Partenza';
      const aNome = t.arrivo ? t.arrivo.split('(')[0].trim() : 'Arrivo';

      let cardsHtml = '';
      for (let i = 0; i < numSegmenti; i++) {
        const curH = (hPart + i) % 24;
        const curM = String(mPart).padStart(2, '0');
        const kmProg = i * 90;
        const cittaIpotetica = i === 0 ? pNome : (i === numSegmenti - 1 ? aNome : `~Km ${kmProg}`);

        cardsHtml += `
          <div class="flex-shrink-0 bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-center w-24 shadow">
            <span class="text-[11px] text-gray-300 font-mono font-semibold block">${String(curH).padStart(2, '0')}:${curM}</span>
            <div class="my-1.5 text-base text-gray-500"><i class="fa-solid fa-cloud"></i></div>
            <span class="text-[12px] text-gray-400 font-bold block">-°C</span>
            <span class="text-[10px] text-amber-400/90 truncate block mt-1 font-medium" title="${cittaIpotetica}">${cittaIpotetica}</span>
          </div>
        `;
      }
      box.innerHTML = cardsHtml;
    }

    function getWmoIcon(code) {
      if (code === 0) return { icon: "fa-sun text-amber-400", label: "Sereno" };
      if (code >= 1 && code <= 3) return { icon: "fa-cloud-sun text-yellow-300", label: "Poco nuvoloso" };
      if (code >= 45 && code <= 48) return { icon: "fa-smog text-gray-400", label: "Nebbia" };
      if (code >= 51 && code <= 67) return { icon: "fa-cloud-rain text-blue-400", label: "Pioggia" };
      if (code >= 71 && code <= 77) return { icon: "fa-snowflake text-sky-200", label: "Neve" };
      if (code >= 80 && code <= 82) return { icon: "fa-cloud-showers-heavy text-blue-500", label: "Rovesci" };
      if (code >= 95) return { icon: "fa-cloud-bolt text-purple-400", label: "Temporale" };
      return { icon: "fa-cloud text-gray-400", label: "Nuvoloso" };
    }

    // Calcolo meteo dinamico con reverse-geocoding
    async function calcolaMeteoDinamicoConGps(idx) {
      const t = tappe[idx];
      const box = document.getElementById('timelineMeteoBox');
      const note = document.getElementById('meteoStatoNote');

      if (!t.partenza && !t.arrivo) {
        alert("Inserisci almeno partenza o arrivo.");
        return;
      }

      note.innerHTML = `<span class="text-sky-300"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Rilevamento comuni attraversati e meteo orario...</span>`;

      try {
        const queryP = t.partenza.split('(')[0].trim();
        const queryA = t.arrivo.split('(')[0].trim();

        const [resP, resA] = await Promise.all([
          fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(queryP)}&format=json&limit=1`).then(r => r.json()),
          fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(queryA)}&format=json&limit=1`).then(r => r.json())
        ]);

        if (!resP[0] || !resA[0]) {
          note.innerHTML = `<span class="text-amber-400">Località non identificate.</span>`;
          return;
        }

        const coordStart = { lat: parseFloat(resP[0].lat), lon: parseFloat(resP[0].lon), name: queryP.split(',')[0] };
        const coordEnd = { lat: parseFloat(resA[0].lat), lon: parseFloat(resA[0].lon), name: queryA.split(',')[0] };

        const kmTot = parseFloat(t.kmTot) || 200;
        const numSegmenti = Math.max(2, Math.ceil(kmTot / 90));
        const [hPart, mPart] = (t.oraPartenza || "08:30").split(':').map(Number);

        let isStorico = false;
        let dViaggio = null;
        if (t.data) {
          const p = t.data.split('/');
          if (p.length === 3) dViaggio = new Date(p[2], p[1] - 1, p[0]);
          if (dViaggio && !isNaN(dViaggio.getTime())) {
            const diffG = Math.ceil((dViaggio - new Date()) / (1000 * 60 * 60 * 24));
            if (diffG > 14) isStorico = true;
          }
        }

        const segmenti = [];
        for (let i = 0; i < numSegmenti; i++) {
          const ratio = i / (numSegmenti - 1);
          const latInterp = coordStart.lat + (coordEnd.lat - coordStart.lat) * ratio;
          const lonInterp = coordStart.lon + (coordEnd.lon - coordStart.lon) * ratio;
          const curH = (hPart + i) % 24;
          const curM = String(mPart).padStart(2, '0');

          let nomePunto = i === 0 ? coordStart.name : (i === numSegmenti - 1 ? coordEnd.name : '');
          segmenti.push({
            orario: `${String(curH).padStart(2, '0')}:${curM}`,
            lat: latInterp,
            lon: lonInterp,
            nome: nomePunto
          });
        }

        for (let i = 1; i < segmenti.length - 1; i++) {
          try {
            const revRes = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${segmenti[i].lat}&lon=${segmenti[i].lon}&format=json&accept-language=it`).then(r => r.json());
            if (revRes && revRes.address) {
              const a = revRes.address;
              segmenti[i].nome = a.city || a.town || a.village || a.hamlet || a.municipality || `Km ${i*90}`;
            } else {
              segmenti[i].nome = `Km ${i*90}`;
            }
          } catch(e) {
            segmenti[i].nome = `Km ${i*90}`;
          }
        }

        const meteoPromesse = segmenti.map(async (s) => {
          if (isStorico) {
            const anno1 = dViaggio.getFullYear() - 1;
            const anno2 = dViaggio.getFullYear() - 2;
            const mm = String(dViaggio.getMonth() + 1).padStart(2, '0');
            const dd = String(dViaggio.getDate()).padStart(2, '0');
            const resH = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${s.lat}&longitude=${s.lon}&start_date=${anno2}-${mm}-${dd}&end_date=${anno1}-${mm}-${dd}&hourly=temperature_2m`).then(r => r.json());
            let tempMedia = 20;
            if (resH.hourly && resH.hourly.temperature_2m) {
              const arr = resH.hourly.temperature_2m;
              tempMedia = Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
            }
            return { temp: tempMedia, code: 1, pioggia: 0, isStorico: true };
          } else {
            const resW = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&hourly=temperature_2m,precipitation_probability,weathercode&timezone=auto`).then(r => r.json());
            const hIndex = Math.min(12, resW.hourly.time.length - 1);
            return {
              temp: Math.round(resW.hourly.temperature_2m[hIndex]),
              code: resW.hourly.weathercode[hIndex],
              pioggia: resW.hourly.precipitation_probability ? resW.hourly.precipitation_probability[hIndex] : 0,
              isStorico: false
            };
          }
        });

        const risultatiMeteo = await Promise.all(meteoPromesse);

        box.innerHTML = segmenti.map((s, i) => {
          const w = risultatiMeteo[i];
          const { icon, label } = getWmoIcon(w.code);

          return `
            <div class="flex-shrink-0 bg-gray-900 border ${w.isStorico ? 'border-amber-500/30' : 'border-gray-700'} rounded-xl p-2.5 text-center w-24 shadow-md">
              <span class="text-[11px] text-gray-300 font-mono font-semibold block">${s.orario}</span>
              <div class="my-1 text-base"><i class="fa-solid ${icon}"></i></div>
              <span class="text-[12px] text-white font-bold font-mono block">${w.temp}°C</span>
              ${w.pioggia > 10 ? `<span class="text-[9px] text-blue-300 block"><i class="fa-solid fa-droplet text-[8px]"></i> ${w.pioggia}%</span>` : ''}
              <span class="text-[10px] text-amber-400 truncate block mt-1 font-medium" title="${s.nome}">${s.nome}</span>
            </div>
          `;
        }).join('');

        if (isStorico) {
          note.innerHTML = `<span class="text-amber-400 font-semibold"><i class="fa-solid fa-calendar-xmark mr-1"></i> Ancora è presto per questo dato.</span> Calcolate medie storiche con città reali di passaggio.`;
        } else {
          note.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-circle-check mr-1"></i> Previsione meteorologica oraria attiva con comuni reali di transito.</span>`;
        }

      } catch(err) {
        note.innerHTML = `<span class="text-rose-400">Errore calcolo meteo: ${err.message}</span>`;
      }
    }

    // Profilo altimetrico e temperature
    async function apriGraficoQuote() {
      const t = tappe[indexTappaAttiva];
      if (!t || (!t.partenza && !t.arrivo)) return;

      document.getElementById('modalGraficoQuote').classList.remove('hidden');

      try {
        const queryP = t.partenza.split('(')[0].trim();
        const queryA = t.arrivo.split('(')[0].trim();
        const [resP, resA] = await Promise.all([
          fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(queryP)}&format=json&limit=1`).then(r => r.json()),
          fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(queryA)}&format=json&limit=1`).then(r => r.json())
        ]);

        const start = { lat: parseFloat(resP[0].lat), lon: parseFloat(resP[0].lon) };
        const end = { lat: parseFloat(resA[0].lat), lon: parseFloat(resA[0].lon) };

        const pts = [];
        for (let i = 0; i <= 10; i++) {
          const r = i / 10;
          pts.push({
            lat: start.lat + (end.lat - start.lat) * r,
            lon: start.lon + (end.lon - start.lon) * r,
            km: Math.round(((parseFloat(t.kmTot) || 200) / 10) * i)
          });
        }

        const elevRes = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${pts.map(p => p.lat.toFixed(4)).join(',')}&longitude=${pts.map(p => p.lon.toFixed(4)).join(',')}`).then(r => r.json());
        const altitudini = elevRes.elevation;

        const tBase = 22;
        const temperatureStimate = altitudini.map(alt => Math.round(tBase - (alt * 0.0065)));

        const maxAlt = Math.max(...altitudini);
        t.altitudine = `${maxAlt} m`;
        document.getElementById('infoAltMax').textContent = `Quota Max: ${maxAlt} m s.l.m. • Temp. Minima in Quota: ${Math.min(...temperatureStimate)}°C`;

        const ctx = document.getElementById('chartQuoteCanvas').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: pts.map((p, i) => `${p.km} km (${temperatureStimate[i]}°C)`),
            datasets: [{
              label: 'Altitudine (metri)',
              data: altitudini,
              borderColor: '#f59e0b',
              backgroundColor: 'rgba(245, 158, 11, 0.25)',
              fill: true,
              tension: 0.35,
              pointRadius: 3,
              pointBackgroundColor: '#fbbf24'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 9 } } },
              y: { grid: { color: 'rgba(255,255,255,0.08)' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
            }
          }
        });
      } catch(e) {
        document.getElementById('infoAltMax').textContent = "Profilo altimetrico stimato.";
      }
    }

    function scaricaGpxMultiWaypoint(idx) {
      const t = tappe[idx];
      const p = (t.partenza || 'Partenza').split('(')[0].trim();
      const a = (t.arrivo || 'Arrivo').split('(')[0].trim();
      const arr = Array.isArray(t.intermedi) ? t.intermedi : (t.intermedio ? t.intermedio.split(',') : []);
      const nome = `${p}_${a}`.replace(/\s+/g, '_');

      const waypointsGpx = arr.map(w => `<rtept lat="0.0" lon="0.0"><name>${w.split('(')[0].trim()}</name></rtept>`).join('\n');

      const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="djRoutePlanner">
  <metadata><name>${nome}</name></metadata>
  <rte>
    <name>${nome}</name>
    <rtept lat="0.0" lon="0.0"><name>${p}</name></rtept>
    ${waypointsGpx}
    <rtept lat="0.0" lon="0.0"><name>${a}</name></rtept>
  </rte>
</gpx>`;
      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${nome}.gpx`;
      link.click();
    }

    // MOTORE EURISTICO / SEMANTICO OFFLINE PER QUALSIASI FOGLIO EXCEL
    function importaConMotoreEuristico(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array', cellDates: false });
          const ws = wb.Sheets[wb.SheetNames[0]];
          
          // Estrai matrice bidimensionale grezza (tutte le celle)
          const matrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });

          if (!matrix || matrix.length === 0) {
            alert("Il foglio caricato è vuoto.");
            return;
          }

          const nuoveTappe = [];

          // Regex di riconoscimento semantico
          const regexDataNumerica = /\b(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})\b/;
          const regexFrecciaRotta = /\s*(?:->|➔|-->|—|-|>|verso|to)\s*/i;
          const regexPrezzo = /(\d+[\.,]?\d*)\s*(?:€|euro|\$)/i;
          const regexKm = /(\d+)\s*(?:km|chilometri)/i;
          const regexOre = /(\d{1,2})[h:](\d{2})?/i;

          // Scansione riga per riga
          matrix.forEach((riga, rowIdx) => {
            if (!Array.isArray(riga) || riga.length === 0) return;

            // Unisci il testo della riga per verificare filtri di esclusione
            const testoRiga = riga.map(c => String(c).trim()).join(" ");
            const testUpper = testoRiga.toUpperCase();

            // Filtro rumore
            if (testUpper.includes("TOTALE") || testUpper.includes("TAGLIANDO") || testUpper.includes("ASSICURAZIONE") || testUpper.includes("PREVENTIVO")) {
              return;
            }

            let dataTappa = "";
            let partenza = "";
            let arrivo = "";
            let intermedi = [];
            let km = "";
            let ore = "";
            let hotel = "";
            let prezzo = "";
            let piattaforma = "Booking";
            let parcheggio = "";

            // Analizza ogni cella della riga con logica euristica
            riga.forEach((cella) => {
              const val = String(cella).trim();
              if (!val) return;

              // 1. Riconoscimento Date (Formato o Seriale Excel)
              if (!dataTappa) {
                if (regexDataNumerica.test(val)) {
                  dataTappa = formattaInGiornoMeseAnno(val);
                } else if (!isNaN(val) && val.length === 5 && parseInt(val) > 40000 && parseInt(val) < 60000) {
                  dataTappa = formattaInGiornoMeseAnno(parseInt(val));
                }
              }

              // 2. Riconoscimento Rotta Unificata con Frecce (es: "Ancona -> Kalambaka")
              if (regexFrecciaRotta.test(val) && val.length > 5 && !partenza) {
                const parti = val.split(regexFrecciaRotta).map(s => s.trim()).filter(Boolean);
                if (parti.length >= 2) {
                  partenza = parti[0];
                  arrivo = parti[parti.length - 1];
                  if (parti.length > 2) {
                    intermedi = parti.slice(1, parti.length - 1);
                  }
                }
              }

              // 3. Riconoscimento Chilometri
              if (!km && regexKm.test(val)) {
                const match = val.match(regexKm);
                km = match[1];
              }

              // 4. Riconoscimento Prezzi
              if (!prezzo && regexPrezzo.test(val)) {
                const match = val.match(regexPrezzo);
                prezzo = `${match[1]} €`;
              }

              // 5. Riconoscimento Alloggi (parole chiave hotel, b&b, camping)
              const valLower = val.toLowerCase();
              if (!hotel && (valLower.includes("hotel") || valLower.includes("b&b") || valLower.includes("residence") || valLower.includes("camping") || valLower.includes("appartamento") || valLower.includes("albergo"))) {
                hotel = val;
              }

              // 6. Riconoscimento Parcheggio
              if (!parcheggio && (valLower.includes("garage") || valLower.includes("parcheggio") || valLower.includes("parking") || valLower.includes("posto moto"))) {
                parcheggio = val;
              }

              // 7. Riconoscimento Piattaforma
              if (valLower.includes("expedia")) piattaforma = "Expedia";
              if (valLower.includes("dirett") || valLower.includes("privat")) piattaforma = "Pren. Diretta";
            });

            // Se la rotta non era in una singola cella, cerca città in colonne distinte
            if (!partenza || !arrivo) {
              const celleTestuali = riga.map(c => String(c).trim()).filter(c => c.length > 2 && isNaN(c) && !regexDataNumerica.test(c) && !c.includes("€"));
              if (celleTestuali.length >= 2) {
                partenza = celleTestuali[0];
                arrivo = celleTestuali[1];
                if (celleTestuali.length > 2 && !hotel) {
                  hotel = celleTestuali[2];
                }
              }
            }

            // Se abbiamo almeno una data o una coppia partenza/arrivo, registra la tappa
            if ((partenza && arrivo) || dataTappa) {
              const giornoCalcolato = calcolaGiornoDaData(dataTappa);
              nuoveTappe.push({
                giorno: giornoCalcolato,
                data: dataTappa,
                oraPartenza: "08:30",
                partenza: partenza || "Partenza",
                intermedi: intermedi,
                intermedio: intermedi.join(", "),
                arrivo: arrivo || "Arrivo",
                kmTot: km,
                oreGuida: ore || (km ? `${Math.floor(parseFloat(km)/90)}h` : "03:00"),
                altitudine: "",
                tempMinMax: "",
                hotel: hotel,
                piattaforma: piattaforma,
                prezzo: prezzo,
                pagato: "Da pagare",
                parcheggio: parcheggio,
                myRouteUrl: ""
              });
            }
          });

          if (nuoveTappe.length === 0) {
            alert("Nessuna tappa identificabile trovata nel file. Verifica che contenga date o città di rotta.");
            return;
          }

          tappe = nuoveTappe;
          salvaSuMemoria();
          vaiAllaHome();
          alert(`Motore Euristico: ${tappe.length} tappe identificate e create con successo!`);

        } catch(err) {
          alert("Errore durante l'interpretazione del file: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // GPS
    function attivaGps() {
      if (!navigator.geolocation) {
        alert("GPS non disponibile sul browser.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(4);
          const lon = pos.coords.longitude.toFixed(4);
          alert(`GPS Attivo!\nLat: ${lat}, Lon: ${lon}`);
          if (vistaAttuale === "dettaglio") {
            calcolaMeteoDinamicoConGps(indexTappaAttiva);
          }
        },
        () => alert("Permesso GPS non concesso o segnale debole.")
      );
    }
