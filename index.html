<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>djRoutePlanner - Rally Roadbook</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="djRoute">
  <meta name="theme-color" content="#06090e">
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS per Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <!-- Chart.js per Altimetria -->

  <style>
    body { 
      background-color: #06090e; 
      color: #f1f5f9; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .safe-top {
      padding-top: max(env(safe-area-inset-top, 54px), 56px) !important;
    }

    .bg-cinema-wrap {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -2;
      overflow: hidden;
      background: #040609;
    }
    .bg-cinema {
      position: absolute;
      top: -8%; left: -8%; width: 116%; height: 116%;
      background: url('https://images.unsplash.com/photo-1558981403-c5f9899a28bc?q=80&w=1920&auto=format&fit=crop') center center / cover no-repeat;
      animation: kenburns 40s ease-in-out infinite alternate;
      filter: brightness(0.22) contrast(1.2) saturate(0.8);
    }
    @keyframes kenburns {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.06) translate(-1%, -1%); }
      100% { transform: scale(1.12) translate(1%, 1%); }
    }
    .cinema-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(180deg, rgba(6, 9, 14, 0.75) 0%, rgba(6, 9, 14, 0.94) 50%, rgba(4, 6, 9, 0.99) 100%);
      z-index: -1;
      pointer-events: none;
    }

    .rally-card {
      background: rgba(13, 19, 29, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .scroll-hide::-webkit-scrollbar { display: none; }
    .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }

    .autocomplete-dropdown {
      position: absolute;
      left: 0; right: 0; top: 100%;
      z-index: 80;
      background: #0d131d;
      border: 1px solid #2d3748;
      border-radius: 0.75rem;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 4px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.85);
    }
    .autocomplete-item {
      padding: 9px 12px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover, .autocomplete-item:active {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }

    .swipe-container {
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
      border-radius: 1rem;
    }
    .swipe-delete-bg {
      position: absolute;
      top: 0; bottom: 0; right: 0; width: 100%;
      background: #9f1239;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 1.5rem;
      color: white;
      font-weight: bold;
      border-radius: 1rem;
      z-index: 1;
    }
    .swipe-content {
      position: relative;
      background: inherit;
      z-index: 2;
      transition: transform 0.15s ease-out;
    }
  </style>
</head>
<body class="pb-24 min-h-screen relative select-none">

  <script>
    let tappe = [];
    let vistaAttuale = "dashboard";
    let indexTappaAttiva = 0;
    let chartInstance = null;
    let debounceTimer = null;

    function normalizzaTesto(t) {
      return (t || '')
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/['’]/g, " ")
        .toLowerCase()
        .trim();
    }

    function gestisciInputData(input) {
      let v = input.value.replace(/\D/g, '');
      if (v.length > 2 && v.length <= 4) {
        v = v.substring(0, 2) + '/' + v.substring(2);
      } else if (v.length > 4) {
        v = v.substring(0, 2) + '/' + v.substring(2, 4) + '/' + v.substring(4, 8);
      }
      input.value = v;
      document.getElementById('m_giorno').value = calcolaGiornoDaData(v);
    }

    function formattaInGiornoMeseAnno(val) {
      if (!val) return "";
      if (val instanceof Date && !isNaN(val.getTime())) {
        const gg = String(val.getDate()).padStart(2, '0');
        const mm = String(val.getMonth() + 1).padStart(2, '0');
        const aaaa = val.getFullYear();
        return `${gg}/${mm}/${aaaa}`;
      }
      if (typeof val === 'number' || (!isNaN(val) && String(val).length === 5)) {
        const dateObj = new Date((val - (25567 + 2)) * 86400 * 1000);
        if (!isNaN(dateObj.getTime())) {
          const gg = String(dateObj.getDate()).padStart(2, '0');
          const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
          const aaaa = dateObj.getFullYear();
          return `${gg}/${mm}/${aaaa}`;
        }
      }
      const str = String(val).trim();
      if (str.includes('/')) {
        const p = str.split('/');
        if (p.length === 3) return `${p[0].padStart(2, '0')}/${p[1].padStart(2, '0')}/${p[2]}`;
      }
      if (str.includes('-')) {
        const p = str.split('T')[0].split('-');
        if (p.length === 3) return `${p[2].padStart(2, '0')}/${p[1].padStart(2, '0')}/${p[0]}`;
      }
      return str;
    }

    function calcolaGiornoDaData(strData) {
      if (!strData || strData.length < 10) return "";
      const p = strData.split('/');
      if (p.length !== 3) return "";
      const gg = parseInt(p[0], 10);
      const mm = parseInt(p[1], 10) - 1;
      const aaaa = parseInt(p[2], 10);
      const d = new Date(aaaa, mm, gg);
      if (isNaN(d.getTime())) return "";
      const nomi = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
      return nomi[d.getDay()];
    }

    // Ricerca località live
    function cercaCittaLive(inputElem, dropId) {
      const testoOriginale = inputElem.value.trim();
      const testoPulito = normalizzaTesto(testoOriginale);
      const drop = document.getElementById(dropId);
      clearTimeout(debounceTimer);

      if (testoPulito.length < 2) {
        drop.classList.add('hidden');
        drop.innerHTML = '';
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          const [resOM, resNom] = await Promise.all([
            fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(testoPulito)}&count=5&language=it&format=json`)
              .then(r => r.json()).catch(() => ({ results: [] })),
            fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(testoOriginale)}&format=json&addressdetails=1&limit=6&accept-language=it`)
              .then(r => r.json()).catch(() => [])
          ]);

          let listaRisultati = [];

          if (Array.isArray(resNom)) {
            resNom.forEach(item => {
              const a = item.address || {};
              const via = [a.road, a.house_number].filter(Boolean).join(' ');
              const comune = a.city || a.town || a.village || a.hamlet || a.municipality || item.display_name.split(',')[0];
              const nomeVisualizzato = via ? `${via}, ${comune}` : comune;
              const extra = [a.county || a.state_district, a.state, a.country].filter(Boolean).join(', ');
              if (nomeVisualizzato && !listaRisultati.some(x => x.nome.toLowerCase() === nomeVisualizzato.toLowerCase())) {
                listaRisultati.push({ nome: nomeVisualizzato, extra });
              }
            });
          }

          if (resOM && resOM.results) {
            resOM.results.forEach(r => {
              const extra = [r.admin1, r.country].filter(Boolean).join(', ');
              if (!listaRisultati.some(x => x.nome.toLowerCase() === r.name.toLowerCase())) {
                listaRisultati.push({ nome: r.name, extra });
              }
            });
          }

          if (listaRisultati.length > 0) {
            drop.innerHTML = listaRisultati.map(item => `
              <div class="autocomplete-item" onmousedown="selezionaCitta('${inputElem.id}', '${dropId}', '${item.nome.replace(/'/g, "\\'")}', '${item.extra.replace(/'/g, "\\'")}')">
                <span class="font-bold text-white">${item.nome}</span>
                <span class="text-[11px] text-gray-400 block">${item.extra}</span>
              </div>
            `).join('');
            drop.classList.remove('hidden');
          } else {
            drop.classList.add('hidden');
          }
        } catch(e) {
          drop.classList.add('hidden');
        }
      }, 220);
    }

    // Lettore Prenotazioni Calendario .ICS
    function leggiFileIcsPrenotazione(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const test = e.target.result;
          let summary = "";
          let location = "";
          let dtstart = "";

          const lines = test.split(/\r\n|\n|\r/);
          lines.forEach(line => {
            if (line.startsWith("SUMMARY:")) summary = line.replace("SUMMARY:", "").trim();
            if (line.startsWith("LOCATION:")) location = line.replace("LOCATION:", "").trim();
            if (line.startsWith("DTSTART:")) dtstart = line.replace("DTSTART:", "").trim();
          });

          if (summary) document.getElementById('m_hotel').value = summary;
          if (location) document.getElementById('m_arrivo').value = location;
          if (dtstart && dtstart.length >= 8) {
            const dataFormattata = `${dtstart.substring(6, 8)}/${dtstart.substring(4, 6)}/${dtstart.substring(0, 4)}`;
            document.getElementById('m_data').value = dataFormattata;
            document.getElementById('m_giorno').value = calcolaGiornoDaData(dataFormattata);
          }

          document.getElementById('m_piattaforma').value = test.toLowerCase().includes("expedia") ? "Expedia" : "Booking";
          alert(`Alloggio rilevato da file .ICS:\n\n${summary}\nDestinazione impostata per il navigatore!`);
          calcolaMetricheRottaAutomatica();
        } catch(err) {
          alert("Impossibile leggere il file di prenotazione: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    // MOTORE IMPORTAZIONE EXCEL INTELLIGENTE: SOLO TRATTE E PERMANENZE
    function importaRoadbookIntelligente(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array', cellDates: true });
          const ws = wb.Sheets[wb.SheetNames[0]];
          
          const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
          if (!raw || raw.length === 0) {
            alert("Il file Excel è vuoto.");
            return;
          }

          // 1. Cerca la riga di intestazione con parole chiave realistiche
          let headerRowIndex = -1;
          for (let r = 0; r < Math.min(raw.length, 20); r++) {
            const rigaStr = raw[r].map(c => String(c).toLowerCase().trim()).join(" ");
            if ((rigaStr.includes("partenza") || rigaStr.includes("da")) && 
                (rigaStr.includes("arrivo") || rigaStr.includes("destinazione") || rigaStr.includes("a") || rigaStr.includes("itinerario"))) {
              headerRowIndex = r;
              break;
            }
          }

          if (headerRowIndex === -1) headerRowIndex = 0;
          const headers = raw[headerRowIndex].map(h => String(h).toLowerCase().trim());

          function trovaColonna(parole) {
            for (let p of parole) {
              const idx = headers.findIndex(h => h.includes(p));
              if (idx !== -1) return idx;
            }
            return -1;
          }

          const colData = trovaColonna(['data', 'date', 'giorno']);
          const colPartenza = trovaColonna(['partenza', 'da', 'start', 'from']);
          const colArrivo = trovaColonna(['arrivo', 'destinazione', 'a', 'to']);
          const colItinerario = trovaColonna(['itinerario', 'tratta', 'percorso']);
          const colIntermedio = trovaColonna(['intermedio', 'passo', 'passi', 'via', 'tappe intermedie']);
          const colKm = trovaColonna(['km', 'distanza', 'km tot']);
          const colOre = trovaColonna(['ore', 'tempo', 'tempo guida']);
          const colQuota = trovaColonna(['alt', 'quota', 'altitudine']);
          const colTemp = trovaColonna(['temp', 'temperatura']);
          
          // Mappatura avanzata Alloggio & Pagamenti
          const colHotel = trovaColonna(['pernottamento', 'hotel', 'alloggio', 'struttura', 'b&b', 'albergo', 'dove dormire']);
          const colPrezzo = trovaColonna(['costo', 'prezzo', 'camera', '€', 'totale hotel', 'importo']);
          const colStatoPagato = trovaColonna(['stato pagamento', 'pagato/da pagare', 'pagato', 'saldo', 'stato']);
          const colMetodoPagamento = trovaColonna(['metodo pagamento', 'pagamento con', 'carta', 'paypal', 'metodo']);
          const colPiattaforma = trovaColonna(['sito', 'piattaforma', 'booking', 'canale']);
          const colParcheggio = trovaColonna(['parcheggio', 'parking', 'posto moto', 'garage']);
          const colLink = trovaColonna(['myroute', 'link', 'traccia', 'gpx']);

          const nuoveTappe = [];

          // 2. Scansione rigida: accetta SOLO TRATTE (Partenza -> Arrivo) o PERMANENZE
          for (let r = headerRowIndex + 1; r < raw.length; r++) {
            const row = raw[r];
            if (!row || row.length === 0) continue;

            const testoCompleto = row.map(c => String(c).trim()).join(" ").toUpperCase();
            
            // Scarta qualsiasi riga contabile, di riepilogo o spuria
            if (testoCompleto.includes("TOTALE") || testoCompleto.includes("RIASSUNTO") || 
                testoCompleto.includes("TAGLIANDO") || testoCompleto.includes("PREVENTIVO") ||
                testoCompleto.includes("SPESE") || testoCompleto.includes("BENZINA") || 
                testoCompleto.includes("ASSICURAZIONE") || testoCompleto.includes("MANUTENZIONE")) {
              continue;
            }

            const dataRaw = colData !== -1 ? row[colData] : "";
            let partenza = colPartenza !== -1 ? String(row[colPartenza]).trim() : "";
            let arrivo = colArrivo !== -1 ? String(row[colArrivo]).trim() : "";
            
            // Se c'è una colonna unica "Itinerario" (es. Roma -> Firenze)
            if ((!partenza || !arrivo) && colItinerario !== -1) {
              const itStr = String(row[colItinerario]).trim();
              if (itStr.includes("->") || itStr.includes("➔") || itStr.includes("-")) {
                const parti = itStr.split(/(?:->|➔|-)/).map(s => s.trim());
                partenza = parti[0];
                arrivo = parti[parti.length - 1];
              }
            }

            // Identifica se è un giorno di Sosta/Permanenza
            const isPermanenza = (partenza && arrivo && partenza.toLowerCase() === arrivo.toLowerCase()) || 
                                 (partenza && !arrivo && testoCompleto.includes("SOSTA")) || 
                                 (testoCompleto.includes("PERMANENZA"));

            if (isPermanenza && !arrivo) {
              arrivo = partenza; // Nella permanenza partenza e arrivo coincidono
            }

            // REQUISITO TASSATIVO: Deve esserci almeno una destinazione o un punto fermo
            if (!partenza && !arrivo) {
              continue; // Salta note e celle vuote
            }

            const dataFormattata = formattaInGiornoMeseAnno(dataRaw);
            const giornoCalcolato = calcolaGiornoDaData(dataFormattata);

            // Lettura dati alloggio reali
            let hotel = colHotel !== -1 ? String(row[colHotel]).trim() : "";
            let prezzo = colPrezzo !== -1 ? String(row[colPrezzo]).trim() : "";
            if (prezzo && !prezzo.includes("€") && !isNaN(parseFloat(prezzo))) prezzo += " €";

            let pagato = colStatoPagato !== -1 ? String(row[colStatoPagato]).trim() : "";
            let metodoPagamento = colMetodoPagamento !== -1 ? String(row[colMetodoPagamento]).trim() : "";
            
            // Se metodo e stato sono scritti nella stessa colonna
            if (!metodoPagamento && pagato) {
              if (pagato.toLowerCase().includes("paypal")) metodoPagamento = "PayPal";
              else if (pagato.toLowerCase().includes("carta")) metodoPagamento = "Carta di Credito";
              else if (pagato.toLowerCase().includes("contanti")) metodoPagamento = "Contanti";
            }

            let piattaforma = "Booking";
            if (colPiattaforma !== -1) {
              const pStr = String(row[colPiattaforma]).toLowerCase();
              if (pStr.includes("expedia")) piattaforma = "Expedia";
              else if (pStr.includes("dirett") || pStr.includes("privat")) piattaforma = "Pren. Diretta";
              else if (pStr) piattaforma = row[colPiattaforma];
            }

            const intermedioStr = colIntermedio !== -1 ? String(row[colIntermedio]).trim() : "";
            const arrInt = intermedioStr ? intermedioStr.split(/[,;\/]/).map(s => s.trim()).filter(Boolean) : [];

            nuoveTappe.push({
              giorno: giornoCalcolato,
              data: dataFormattata,
              oraPartenza: "08:30",
              partenza: partenza || arrivo,
              intermedi: arrInt,
              intermedio: arrInt.join(', '),
              arrivo: arrivo || partenza,
              isPermanenza: isPermanenza,
              kmTot: isPermanenza ? "0" : (colKm !== -1 ? String(row[colKm]).replace(/km/i, '').trim() : ""),
              oreGuida: isPermanenza ? "0h" : (colOre !== -1 ? String(row[colOre]).trim() : ""),
              altitudine: colQuota !== -1 ? String(row[colQuota]).trim() : "",
              tempMinMax: colTemp !== -1 ? String(row[colTemp]).trim() : "",
              hotel: hotel,
              piattaforma: piattaforma,
              prezzo: prezzo,
              pagato: pagato || (prezzo ? "Da verificare" : ""),
              metodoPagamento: metodoPagamento,
              parcheggio: colParcheggio !== -1 ? String(row[colParcheggio]).trim() : "",
              myRouteUrl: colLink !== -1 ? String(row[colLink]).trim() : ""
            });
          }

          if (nuoveTappe.length === 0) {
            alert("Nessuna tratta o permanenza valida individuata nel file Excel.");
            return;
          }

          tappe = nuoveTappe;
          salvaSuMemoria();
          vaiAllaHome();
          alert(`Caricate ${tappe.length} tappe con successo!\n(Escluse tutte le righe non pertinenti)`);

        } catch(err) {
          alert("Errore durante l'apertura del file Excel: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    async function calcolaMetricheRottaAutomatica() {
      const p = document.getElementById('m_partenza').value.trim();
      const a = document.getElementById('m_arrivo').value.trim();
      if (!p || !a) return;

      const pClean = p.split('(')[0].trim();
      const aClean = a.split('(')[0].trim();

      try {
        const [resP, resA] = await Promise.all([
          fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(pClean)}&format=json&limit=1`).then(r => r.json()),
          fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(aClean)}&format=json&limit=1`).then(r => r.json())
        ]);

        if (!resP[0] || !resA[0]) return;

        const start = { lat: parseFloat(resP[0].lat), lon: parseFloat(resP[0].lon) };
        const end = { lat: parseFloat(resA[0].lat), lon: parseFloat(resA[0].lon) };

        const dLat = (end.lat - start.lat) * Math.PI / 180;
        const dLon = (end.lon - start.lon) * Math.PI / 180;
        const h = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(start.lat * Math.PI / 180) * Math.cos(end.lat * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        const distKm = Math.round(6371 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h)) * 1.25);

        const elevResInit = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${start.lat},${end.lat}&longitude=${start.lon},${end.lon}`).then(r => r.json());
        const maxQuotaPunti = Math.max(...elevResInit.elevation);
        
        const andaturaMedia = maxQuotaPunti > 900 ? 70 : 95;
        const oreTot = Math.floor(distKm / andaturaMedia);
        const minTot = Math.round((distKm % andaturaMedia) / andaturaMedia * 60);

        document.getElementById('m_km').value = distKm;
        document.getElementById('m_ore').value = `${oreTot}h ${minTot}m`;

        const ptsLats = [start.lat, (start.lat + end.lat)/2, end.lat].join(',');
        const ptsLons = [start.lon, (start.lon + end.lon)/2, end.lon].join(',');
        const elevRes = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${ptsLats}&longitude=${ptsLons}`).then(r => r.json());
        const quotaMax = Math.max(...elevRes.elevation);
        document.getElementById('m_alt').value = `${quotaMax} m`;

        const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${start.lat}&longitude=${start.lon}&daily=temperature_2m_max,temperature_2m_min&timezone=auto`).then(r => r.json());
        if (wRes.daily && wRes.daily.temperature_2m_min) {
          const tMin = Math.round(wRes.daily.temperature_2m_min[0]);
          const tMax = Math.round(wRes.daily.temperature_2m_max[0]);
          document.getElementById('m_tempMinMax').value = `${tMin}° / ${tMax}°C`;
        }
      } catch(e) {}
    }

    // Memoria locale
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('djroute_v19_tappe');
      if (saved) {
        try { tappe = JSON.parse(saved); } catch(e) { tappe = []; }

    function salvaSuMemoria() {
      localStorage.setItem('djroute_v19_tappe', JSON.stringify(tappe));
      aggiornaRiepilogo();
    }

    function aggiornaRiepilogo() {
      document.getElementById('totTappeVal').textContent = tappe.length;
      let totKm = 0;
      let totMinuti = 0;

      tappe.forEach(t => {
        const km = parseFloat(t.kmTot) || 0;
        totKm += km;
        if (t.oreGuida && String(t.oreGuida).includes(':')) {
          const [h, m] = t.oreGuida.split(':').map(Number);
          totMinuti += (h * 60) + (m || 0);
        } else if (km > 0) {
          totMinuti += Math.round((km / 90) * 60);
        }
      });

      document.getElementById('totKmVal').textContent = Math.round(totKm) + " km";
      const ore = Math.floor(totMinuti / 60);
      const min = totMinuti % 60;
      document.getElementById('totOreVal').textContent = `${ore}h ${min}m`;
    }

      if (tappe.length === 0) {
        alert("Non ci sono tappe da cancellare.");
        return;
      }
      if (confirm("Vuoi cancellare tutte le tappe dal tuo Roadbook?")) {
        tappe = [];
        salvaSuMemoria();
        vaiAllaHome();
      }
    }

    function vaiAllaHome() {
      vistaAttuale = "dashboard";
      aggiornaVista();
    }

    function apriDettaglioTappa(idx) {
      indexTappaAttiva = idx;
      vistaAttuale = "dettaglio";
      aggiornaVista();
    }

    function navigaIndietro() {
      if (vistaAttuale === "dashboard") return;
      if (indexTappaAttiva > 0) {
        indexTappaAttiva--;
        renderSchedaDettaglio();
      } else {
        vaiAllaHome();
      }
      aggiornaBottoniNavigazione();
    }

    function navigaAvanti() {
      if (vistaAttuale === "dashboard") {
        if (tappe.length > 0) apriDettaglioTappa(0);
        return;
      }
      if (indexTappaAttiva < tappe.length - 1) {
        indexTappaAttiva++;
        renderSchedaDettaglio();
      }
      aggiornaBottoniNavigazione();
    }

    function aggiornaBottoniNavigazione() {
      const btnPrev = document.getElementById('btnNavPrev');
      const btnNext = document.getElementById('btnNavNext');
      if (vistaAttuale === "dashboard") {
        btnPrev.classList.add('opacity-40');
        btnNext.classList.remove('opacity-40');
        document.getElementById('headerSubtitle').textContent = "Tour Roadbook";
      } else {
        btnPrev.classList.remove('opacity-40');
        if (indexTappaAttiva >= tappe.length - 1) {
          btnNext.classList.add('opacity-40');
        } else {
          btnNext.classList.remove('opacity-40');
        }
        document.getElementById('headerSubtitle').textContent = `Tappa ${indexTappaAttiva + 1} di ${tappe.length}`;
      }
    }

    function aggiornaVista() {
      const vDash = document.getElementById('vistaDashboard');
      const vDet = document.getElementById('vistaDettaglio');

      if (vistaAttuale === "dashboard") {
        vDash.classList.remove('hidden');
        vDet.classList.add('hidden');
        renderListaDashboard();
        aggiornaRiepilogo();
      } else {
        vDash.classList.add('hidden');
        vDet.classList.remove('hidden');
        renderSchedaDettaglio();
      }
      aggiornaBottoniNavigazione();
    }

    function attivaSwipeGesture() {
      tappe.forEach((_, idx) => {
        const card = document.getElementById(`card-content-${idx}`);
        if (!card) return;

        let startX = 0;
        let startY = 0;
        let currentTranslate = 0;
        let isSwiping = false;

        card.addEventListener('touchstart', (e) => {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          isSwiping = false;
        }, { passive: true });

        card.addEventListener('touchmove', (e) => {
          const deltaX = e.touches[0].clientX - startX;
          const deltaY = e.touches[0].clientY - startY;

          if (Math.abs(deltaX) > Math.abs(deltaY) && deltaX < 0) {
            isSwiping = true;
            currentTranslate = Math.max(deltaX, -110);
            card.style.transform = `translateX(${currentTranslate}px)`;
          }
        }, { passive: true });

        card.addEventListener('touchend', () => {
          if (isSwiping && currentTranslate < -70) {
            card.style.transform = 'translateX(-100px)';
            setTimeout(() => {
              card.style.transform = 'translateX(0px)';
              confermaEliminazioneTappa(idx);
            }, 50);
          } else {
            card.style.transform = 'translateX(0px)';
          }
        });
      });
    }

    }

    function popolaTimelineOrariaIniziale(t) {
      const box = document.getElementById('timelineMeteoBox');
      const kmTot = parseFloat(t.kmTot) || 150;
      const numSegmenti = t.isPermanenza ? 1 : Math.max(2, Math.ceil(kmTot / 90));
      const [hPart, mPart] = (t.oraPartenza || "08:30").split(':').map(Number);

      const pNome = t.partenza ? t.partenza.split('(')[0].trim() : 'Partenza';
      const aNome = t.arrivo ? t.arrivo.split('(')[0].trim() : 'Arrivo';

      let cardsHtml = '';
      for (let i = 0; i < numSegmenti; i++) {
        const curH = (hPart + i) % 24;
        const curM = String(mPart).padStart(2, '0');
        const cittaIpotetica = t.isPermanenza ? pNome : (i === 0 ? pNome : (i === numSegmenti - 1 ? aNome : `Km ${i * 90}`));

        cardsHtml += `
          <div class="flex-shrink-0 bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-center w-24 shadow">
            <span class="text-[11px] text-gray-300 font-mono font-semibold block">${String(curH).padStart(2, '0')}:${curM}</span>
            <div class="my-1.5 text-base text-gray-500"><i class="fa-solid fa-cloud"></i></div>
            <span class="text-[12px] text-gray-400 font-bold block">-°C</span>
            <span class="text-[10px] text-amber-400/90 truncate block mt-1 font-medium" title="${cittaIpotetica}">${cittaIpotetica}</span>
          </div>
        `;
      }
      box.innerHTML = cardsHtml;
    }

    function getWmoIcon(code) {
      if (code === 0) return { icon: "fa-sun text-amber-400", label: "Sereno" };
      if (code >= 1 && code <= 3) return { icon: "fa-cloud-sun text-yellow-300", label: "Poco nuvoloso" };
      if (code >= 45 && code <= 48) return { icon: "fa-smog text-gray-400", label: "Nebbia" };
      if (code >= 51 && code <= 67) return { icon: "fa-cloud-rain text-blue-400", label: "Pioggia" };
      if (code >= 71 && code <= 77) return { icon: "fa-snowflake text-sky-200", label: "Neve" };
      if (code >= 80 && code <= 82) return { icon: "fa-cloud-showers-heavy text-blue-500", label: "Rovesci" };
      if (code >= 95) return { icon: "fa-cloud-bolt text-purple-400", label: "Temporale" };
      return { icon: "fa-cloud text-gray-400", label: "Nuvoloso" };
    }

    async function calcolaMeteoDinamicoConGps(idx) {
      const t = tappe[idx];
      const box = document.getElementById('timelineMeteoBox');
      const note = document.getElementById('meteoStatoNote');

      if (!t.partenza && !t.arrivo) {
        alert("Inserisci almeno partenza o arrivo.");
        return;
      }

      note.innerHTML = `<span class="text-sky-300"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Rilevamento comuni attraversati e meteo orario...</span>`;

      try {
        const queryP = t.partenza.split('(')[0].trim();
        const queryA = t.arrivo.split('(')[0].trim();

        const [resP, resA] = await Promise.all([
          fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(queryP)}&format=json&limit=1`).then(r => r.json()),
          fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(queryA)}&format=json&limit=1`).then(r => r.json())
        ]);

        if (!resP[0] || !resA[0]) {
          note.innerHTML = `<span class="text-amber-400">Località non identificate.</span>`;
          return;
        }

        const coordStart = { lat: parseFloat(resP[0].lat), lon: parseFloat(resP[0].lon), name: queryP.split(',')[0] };
        const coordEnd = { lat: parseFloat(resA[0].lat), lon: parseFloat(resA[0].lon), name: queryA.split(',')[0] };

        const kmTot = parseFloat(t.kmTot) || 150;
        const numSegmenti = t.isPermanenza ? 1 : Math.max(2, Math.ceil(kmTot / 90));
        const [hPart, mPart] = (t.oraPartenza || "08:30").split(':').map(Number);

        let isStorico = false;
        let dViaggio = null;
        if (t.data) {
          const p = t.data.split('/');
          if (p.length === 3) dViaggio = new Date(p[2], p[1] - 1, p[0]);
          if (dViaggio && !isNaN(dViaggio.getTime())) {
            const diffG = Math.ceil((dViaggio - new Date()) / (1000 * 60 * 60 * 24));
            if (diffG > 14) isStorico = true;
          }
        }

        const segmenti = [];
        for (let i = 0; i < numSegmenti; i++) {
          const ratio = numSegmenti === 1 ? 0 : i / (numSegmenti - 1);
          const latInterp = coordStart.lat + (coordEnd.lat - coordStart.lat) * ratio;
          const lonInterp = coordStart.lon + (coordEnd.lon - coordStart.lon) * ratio;
          const curH = (hPart + i) % 24;
          const curM = String(mPart).padStart(2, '0');

          let nomePunto = t.isPermanenza ? coordStart.name : (i === 0 ? coordStart.name : (i === numSegmenti - 1 ? coordEnd.name : ''));
          segmenti.push({
            orario: `${String(curH).padStart(2, '0')}:${curM}`,
            lat: latInterp,
            lon: lonInterp,
            nome: nomePunto
          });
        }

        if (!t.isPermanenza) {
          for (let i = 1; i < segmenti.length - 1; i++) {
            try {
              const revRes = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${segmenti[i].lat}&lon=${segmenti[i].lon}&format=json&accept-language=it`).then(r => r.json());
              if (revRes && revRes.address) {
                const a = revRes.address;
                segmenti[i].nome = a.city || a.town || a.village || a.hamlet || a.municipality || `Km ${i*90}`;
              } else {
                segmenti[i].nome = `Km ${i*90}`;
              }
            } catch(e) {
              segmenti[i].nome = `Km ${i*90}`;
            }
          }
        }

        const meteoPromesse = segmenti.map(async (s) => {
          if (isStorico) {
            const anno1 = dViaggio.getFullYear() - 1;
            const anno2 = dViaggio.getFullYear() - 2;
            const mm = String(dViaggio.getMonth() + 1).padStart(2, '0');
            const dd = String(dViaggio.getDate()).padStart(2, '0');
            const resH = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${s.lat}&longitude=${s.lon}&start_date=${anno2}-${mm}-${dd}&end_date=${anno1}-${mm}-${dd}&hourly=temperature_2m`).then(r => r.json());
            let tempMedia = 20;
            if (resH.hourly && resH.hourly.temperature_2m) {
              const arr = resH.hourly.temperature_2m;
              tempMedia = Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
            }
            return { temp: tempMedia, code: 1, pioggia: 0, isStorico: true };
          } else {
            const resW = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&hourly=temperature_2m,precipitation_probability,weathercode&timezone=auto`).then(r => r.json());
            const hIndex = Math.min(12, resW.hourly.time.length - 1);
            return {
              temp: Math.round(resW.hourly.temperature_2m[hIndex]),
              code: resW.hourly.weathercode[hIndex],
              pioggia: resW.hourly.precipitation_probability ? resW.hourly.precipitation_probability[hIndex] : 0,
              isStorico: false
            };
          }
        });

        const risultatiMeteo = await Promise.all(meteoPromesse);

        box.innerHTML = segmenti.map((s, i) => {
          const w = risultatiMeteo[i];
          const { icon, label } = getWmoIcon(w.code);

          return `
            <div class="flex-shrink-0 bg-gray-900 border ${w.isStorico ? 'border-amber-500/30' : 'border-gray-700'} rounded-xl p-2.5 text-center w-24 shadow-md">
              <span class="text-[11px] text-gray-300 font-mono font-semibold block">${s.orario}</span>
              <div class="my-1 text-base"><i class="fa-solid ${icon}"></i></div>
              <span class="text-[12px] text-white font-bold font-mono block">${w.temp}°C</span>
              ${w.pioggia > 10 ? `<span class="text-[9px] text-blue-300 block"><i class="fa-solid fa-droplet text-[8px]"></i> ${w.pioggia}%</span>` : ''}
              <span class="text-[10px] text-amber-400 truncate block mt-1 font-medium" title="${s.nome}">${s.nome}</span>
            </div>
          `;
        }).join('');

        if (isStorico) {
          note.innerHTML = `<span class="text-amber-400 font-semibold"><i class="fa-solid fa-calendar-xmark mr-1"></i> Ancora è presto per questo dato.</span> Calcolate medie storiche con località di passaggio.`;
        } else {
          note.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-circle-check mr-1"></i> Previsione meteorologica attiva e verificata.</span>`;
        }

      } catch(err) {
        note.innerHTML = `<span class="text-rose-400">Errore calcolo meteo: ${err.message}</span>`;
      }
    }

    async function apriGraficoQuote() {
      const t = tappe[indexTappaAttiva];
      if (!t || (!t.partenza && !t.arrivo)) return;

      document.getElementById('modalGraficoQuote').classList.remove('hidden');

      try {
        const queryP = t.partenza.split('(')[0].trim();
        const queryA = t.arrivo.split('(')[0].trim();
        const [resP, resA] = await Promise.all([
          fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(queryP)}&format=json&limit=1`).then(r => r.json()),
          fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(queryA)}&format=json&limit=1`).then(r => r.json())
        ]);

        const start = { lat: parseFloat(resP[0].lat), lon: parseFloat(resP[0].lon) };
        const end = { lat: parseFloat(resA[0].lat), lon: parseFloat(resA[0].lon) };

        const pts = [];
        for (let i = 0; i <= 10; i++) {
          const r = i / 10;
          pts.push({
            lat: start.lat + (end.lat - start.lat) * r,
            lon: start.lon + (end.lon - start.lon) * r,
            km: Math.round(((parseFloat(t.kmTot) || 200) / 10) * i)
          });
        }

        const elevRes = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${pts.map(p => p.lat.toFixed(4)).join(',')}&longitude=${pts.map(p => p.lon.toFixed(4)).join(',')}`).then(r => r.json());
        const altitudini = elevRes.elevation;

        const tBase = 22;
        const temperatureStimate = altitudini.map(alt => Math.round(tBase - (alt * 0.0065)));

        const maxAlt = Math.max(...altitudini);
        t.altitudine = `${maxAlt} m`;
        document.getElementById('infoAltMax').textContent = `Quota Max: ${maxAlt} m s.l.m. • Temp. Minima in Quota: ${Math.min(...temperatureStimate)}°C`;

        const ctx = document.getElementById('chartQuoteCanvas').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: pts.map((p, i) => `${p.km} km (${temperatureStimate[i]}°C)`),
            datasets: [{
              label: 'Altitudine (metri)',
              data: altitudini,
              borderColor: '#f59e0b',
              backgroundColor: 'rgba(245, 158, 11, 0.25)',
              fill: true,
              tension: 0.35,
              pointRadius: 3,
              pointBackgroundColor: '#fbbf24'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 9 } } },
              y: { grid: { color: 'rgba(255,255,255,0.08)' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
            }
          }
        });
      } catch(e) {
        document.getElementById('infoAltMax').textContent = "Profilo altimetrico stimato.";
      }
    }

    function chiudiGraficoQuote() {
      document.getElementById('modalGraficoQuote').classList.add('hidden');
    }

    function apriModalNuovaTappa() {
      document.getElementById('m_editIndex').value = "-1";
      document.getElementById('m_data').value = "";
      document.getElementById('m_giorno').value = "";
      document.getElementById('m_ora').value = "08:30";
      document.getElementById('m_partenza').value = "";
      document.getElementById('containerIntermediDinamici').innerHTML = "";
      aggiungiRigaIntermedio();
      document.getElementById('m_arrivo').value = "";
      document.getElementById('m_km').value = "";
      document.getElementById('m_ore').value = "";
      document.getElementById('m_alt').value = "";
      document.getElementById('m_tempMinMax').value = "";
      document.getElementById('m_hotel').value = "";
      document.getElementById('m_piattaforma').value = "Booking";
      document.getElementById('m_prezzo').value = "";
      document.getElementById('m_pagato').value = "";
      document.getElementById('m_metodoPagamento').value = "";
      document.getElementById('m_parcheggio').value = "";
      document.getElementById('m_myroute').value = "";
      document.getElementById('tappaModal').classList.remove('hidden');
    }

    function chiudiModalTappa() {
      document.getElementById('tappaModal').classList.add('hidden');
    }

    function modificaTappa(idx) {
      const t = tappe[idx];
      document.getElementById('m_editIndex').value = idx;
      document.getElementById('m_data').value = t.data || '';
      document.getElementById('m_giorno').value = t.giorno || calcolaGiornoDaData(t.data);
      document.getElementById('m_ora').value = t.oraPartenza || '08:30';
      document.getElementById('m_partenza').value = t.partenza || '';
      
      const containerInt = document.getElementById('containerIntermediDinamici');
      containerInt.innerHTML = "";
      const arr = Array.isArray(t.intermedi) ? t.intermedi : (t.intermedio ? t.intermedio.split(',') : []);
      if (arr.length > 0) {
        arr.forEach(val => aggiungiRigaIntermedio(val.trim()));
      } else {
        aggiungiRigaIntermedio();
      }

      document.getElementById('m_arrivo').value = t.arrivo || '';
      document.getElementById('m_km').value = t.kmTot || '';
      document.getElementById('m_ore').value = t.oreGuida || '';
      document.getElementById('m_alt').value = t.altitudine || '';
      document.getElementById('m_tempMinMax').value = t.tempMinMax || '';
      document.getElementById('m_hotel').value = t.hotel || '';
      document.getElementById('m_piattaforma').value = t.piattaforma || 'Booking';
      document.getElementById('m_prezzo').value = t.prezzo || '';
      document.getElementById('m_pagato').value = t.pagato || '';
      document.getElementById('m_metodoPagamento').value = t.metodoPagamento || '';
      document.getElementById('m_parcheggio').value = t.parcheggio || '';
      document.getElementById('m_myroute').value = t.myRouteUrl || '';
      document.getElementById('tappaModal').classList.remove('hidden');
    }

    function salvaTappaManuale() {
      const idx = parseInt(document.getElementById('m_editIndex').value, 10);
      const dataInserita = document.getElementById('m_data').value.trim();
      const partenza = document.getElementById('m_partenza').value.trim();
      const arrivo = document.getElementById('m_arrivo').value.trim();

      const inputsInt = document.querySelectorAll('.input-intermedio');
      const intermediList = Array.from(inputsInt).map(i => i.value.trim()).filter(v => v !== '');

      const dataFormattata = formattaInGiornoMeseAnno(dataInserita);
      const giornoCalcolato = calcolaGiornoDaData(dataFormattata);
      const isSosta = (partenza && arrivo && partenza.toLowerCase() === arrivo.toLowerCase());

      const tappaObj = {
        giorno: giornoCalcolato,
        data: dataFormattata,
        oraPartenza: document.getElementById('m_ora').value || "08:30",
        partenza: partenza,
        intermedi: intermediList,
        intermedio: intermediList.join(', '),
        arrivo: arrivo,
        isPermanenza: isSosta,
        kmTot: isSosta ? "0" : document.getElementById('m_km').value.trim(),
        oreGuida: isSosta ? "0h" : (document.getElementById('m_ore').value.trim() || "03:00"),
        altitudine: document.getElementById('m_alt').value.trim(),
        tempMinMax: document.getElementById('m_tempMinMax').value.trim(),
        hotel: document.getElementById('m_hotel').value.trim(),
        piattaforma: document.getElementById('m_piattaforma').value,
        prezzo: document.getElementById('m_prezzo').value.trim(),
        pagato: document.getElementById('m_pagato').value.trim(),
        metodoPagamento: document.getElementById('m_metodoPagamento').value.trim(),
        parcheggio: document.getElementById('m_parcheggio').value.trim(),
        myRouteUrl: document.getElementById('m_myroute').value.trim()
      };

      if (idx === -1) {
        tappe.push(tappaObj);
        indexTappaAttiva = tappe.length - 1;
      } else {
        tappe[idx] = tappaObj;
      }

      salvaSuMemoria();
      chiudiModalTappa();
      aggiornaVista();
    }

    function eliminaTappa(idx) {
      if (confirm("Vuoi eliminare questa tappa?")) {
        tappe.splice(idx, 1);
        salvaSuMemoria();
        vaiAllaHome();
      }
    }

    function scaricaGpxMultiWaypoint(idx) {
      const t = tappe[idx];
      const p = (t.partenza || 'Partenza').split('(')[0].trim();
      const a = (t.arrivo || 'Arrivo').split('(')[0].trim();
      const arr = Array.isArray(t.intermedi) ? t.intermedi : (t.intermedio ? t.intermedio.split(',') : []);
      const nome = `${p}_${a}`.replace(/\s+/g, '_');

      const waypointsGpx = arr.map(w => `<rtept lat="0.0" lon="0.0"><name>${w.split('(')[0].trim()}</name></rtept>`).join('\n');

      const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="djRoutePlanner">
  <metadata><name>${nome}</name></metadata>
  <rte>
    <name>${nome}</name>
    <rtept lat="0.0" lon="0.0"><name>${p}</name></rtept>
    ${waypointsGpx}
    <rtept lat="0.0" lon="0.0"><name>${a}</name></rtept>
  </rte>
</gpx>`;
      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${nome}.gpx`;
      link.click();
    }

    function attivaGps() {
      if (!navigator.geolocation) {
        alert("GPS non disponibile sul browser.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(4);
          const lon = pos.coords.longitude.toFixed(4);
          alert(`GPS Attivo!\nLat: ${lat}, Lon: ${lon}`);
          if (vistaAttuale === "dettaglio") {
            calcolaMeteoDinamicoConGps(indexTappaAttiva);
          }
        },
        () => alert("Permesso GPS non concesso o segnale debole.")
      );
    }
  </script>
