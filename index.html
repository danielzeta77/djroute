<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSg_iYdW33G7M2RDvckqApsOKZC614zho4-qTsk0ow_Bx3EmrN_kVusQIPyr8qeEC-5w/exec";
    
    let schedeViaggi = [];
    let schedaAttiva = "";
    let tappeCorrenti = [];
    const GEO_CACHE = {};
    const ROUTE_CACHE = {};

    window.addEventListener("DOMContentLoaded", () => {
      mostraHome();
    });

    function selezionaPulsante(containerId, hiddenInputId, valore) {
      document.getElementById(hiddenInputId).value = valore;
      const btns = document.getElementById(containerId).querySelectorAll('.opt-btn');
      btns.forEach(btn => {
        if (btn.innerText.trim().toLowerCase() === valore.trim().toLowerCase() ||
            valore.trim().toLowerCase().startsWith(btn.innerText.trim().toLowerCase())) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function selezionaStatoPagamento(stato) {
      selezionaPulsante('gridPagamento', 'valPagamento', stato);
      const spesa = parseFloat(document.getElementById("inpSpesa").value) || 0;
      const inpPagato = document.getElementById("inpPagato");
      const inpDaPagare = document.getElementById("inpDaPagare");

      if (stato === "Pagato") {
        inpPagato.value = spesa;
        inpDaPagare.value = 0;
      } else if (stato === "Da pagare") {
        inpPagato.value = 0;
        inpDaPagare.value = spesa;
      } else {
        const p = parseFloat(inpPagato.value) || 0;
        inpDaPagare.value = Math.max(0, Math.round((spesa - p) * 100) / 100);
      }
    }

    function ricalcolaPagamentiDaInput(origine) {
      const spesa = parseFloat(document.getElementById("inpSpesa").value) || 0;
      const inpPagato = document.getElementById("inpPagato");
      const inpDaPagare = document.getElementById("inpDaPagare");
      let p = parseFloat(inpPagato.value) || 0;

      if (origine === 'spesa') {
        const stato = document.getElementById("valPagamento").value;
        if (stato === "Pagato") {
          inpPagato.value = spesa;
          p = spesa;
        }
      } else if (origine === 'pagato') {
        if (p >= spesa && spesa > 0) selezionaPulsante('gridPagamento', 'valPagamento', 'Pagato');
        else if (p > 0 && p < spesa) selezionaPulsante('gridPagamento', 'valPagamento', 'Acconto');
        else selezionaPulsante('gridPagamento', 'valPagamento', 'Da pagare');
      }

      inpDaPagare.value = Math.max(0, Math.round((spesa - p) * 100) / 100);
    }

    document.getElementById("inpData").addEventListener("input", (e) => {
      let v = e.target.value.replace(/\D/g, "");
      if (v.length > 2 && v.length <= 4) e.target.value = v.slice(0,2) + "/" + v.slice(2);
      else if (v.length > 4) e.target.value = v.slice(0,2) + "/" + v.slice(2,4) + "/" + v.slice(4,8);
    });

    function attivaAutocompleteMappa(inputId, boxId, multiplo = false) {
      const inp = document.getElementById(inputId);
      const box = document.getElementById(boxId);
      let timer = null;

      inp.addEventListener("input", () => {
        clearTimeout(timer);
        let raw = inp.value;
        let query = multiplo ? raw.split(",").pop().trim() : raw.trim();
        if (query.length < 3) { box.style.display = "none"; return; }

        timer = setTimeout(async () => {
          try {
            const res = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&accept-language=it`, 3500);
            const list = await res.json();
            if (!list || list.length === 0) { box.style.display = "none"; return; }

            box.innerHTML = "";
            list.forEach(item => {
              const div = document.createElement("div");
              div.className = "suggest-item";
              const parti = item.display_name.split(",");
              div.innerText = "📍 " + parti.slice(0, 3).join(",");
              div.onclick = () => {
                const citta = parti[0].trim();
                if (multiplo && raw.includes(",")) {
                  const prec = raw.split(",").slice(0, -1).map(s => s.trim()).join(", ");
                  inp.value = prec + ", " + citta;
                } else {
                  inp.value = citta;
                }
                GEO_CACHE[citta.toLowerCase()] = { lat: parseFloat(item.lat), lon: parseFloat(item.lon), name: citta };
                box.style.display = "none";
              };
              box.appendChild(div);
            });
            box.style.display = "block";
          } catch (e) { box.style.display = "none"; }
        }, 260);
      });

      document.addEventListener("click", (e) => {
        if (!inp.contains(e.target) && !box.contains(e.target)) box.style.display = "none";
      });
    }

    attivaAutocompleteMappa("inpPartenza", "sugPartenza", false);
    attivaAutocompleteMappa("inpPassaggio", "sugPassaggio", true);
    attivaAutocompleteMappa("inpArrivo", "sugArrivo", false);

    // FETCH CON TIMEOUT (Evita blocchi infiniti)
    async function fetchWithTimeout(resource, timeout = 4500) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(resource, { signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (error) {
        clearTimeout(id);
        throw error;
      }
    }

    // PARSER UNIVERSALE DATE (Estrae giorno, mese, anno da qualsiasi stringa)
    function analizzaFinestraMeteo(dataStr) {
      if (!dataStr) return { stato: "invalid", diffDays: 999 };
      
      let d = null, m = null, y = null;
      const str = String(dataStr).trim();

      // Cerca pattern GG/MM/AAAA
      const matchSlash = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (matchSlash) {
        d = parseInt(matchSlash[1]);
        m = parseInt(matchSlash[2]) - 1;
        y = parseInt(matchSlash[3]);
      } else {
        // Cerca pattern AAAA-MM-GG
        const matchIso = str.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (matchIso) {
          y = parseInt(matchIso[1]);
          m = parseInt(matchIso[2]) - 1;
          d = parseInt(matchIso[3]);
        }
      }

      if (d === null || m === null || y === null) {
        return { stato: "invalid", diffDays: 999 };
      }

      const target = new Date(y, m, d, 23, 59, 59);
      const oggi = new Date();
      oggi.setHours(0, 0, 0, 0);

      const diffMs = target.getTime() - oggi.getTime();
      const diffGiorni = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const isoDate = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

      if (diffGiorni < 0) {
        return { stato: "obsoleto", diffDays: diffGiorni, isoDate };
      } else if (diffGiorni > 10) {
        return { stato: "futuro", diffDays: diffGiorni, isoDate };
      } else {
        return { stato: "disponibile", diffDays: diffGiorni, isoDate };
      }
    }

    async function mostraHome() {
      schedaAttiva = "";
      document.getElementById("vistaViaggio").style.display = "none";
      document.getElementById("fabNuovaTappa").style.display = "none";
      document.getElementById("vistaHome").style.display = "block";
      await scaricaSchedeViaggi();
    }

    async function sincronizzaVistaAttiva() {
      const icon = document.getElementById("syncIcon");
      icon.classList.add("spin");
      if (schedaAttiva) {
        await apriSchedaViaggio(schedaAttiva);
      } else {
        await scaricaSchedeViaggi();
      }
      setTimeout(() => icon.classList.remove("spin"), 500);
    }

    async function scaricaSchedeViaggi() {
      const cont = document.getElementById("listaSchedeViaggi");
      try {
        const res = await fetchWithTimeout(`${SCRIPT_URL}?action=getSheets&_t=${Date.now()}`, 6000);
        const fogli = await res.json();
        if (Array.isArray(fogli)) {
          schedeViaggi = fogli;
          cont.innerHTML = "";
          fogli.forEach(nome => {
            const wrap = document.createElement("div");
            wrap.className = "swipe-wrapper";

            const delBg = document.createElement("div");
            delBg.className = "swipe-delete-bg";
            delBg.innerHTML = `🗑️<span>ELIMINA</span>`;
            delBg.onclick = (e) => {
              e.stopPropagation();
              confermaEliminazioneFoglio(nome);
            };

            const card = document.createElement("div");
            card.className = "trip-item";
            card.innerHTML = `
              <div class="trip-item-title">🏍️ ${nome}</div>
              <div class="trip-item-badge">Apri ➔</div>
            `;

            let startX = 0;
            let swiped = false;
            card.addEventListener("touchstart", (e) => {
              startX = e.touches[0].clientX;
            }, { passive: true });

            card.addEventListener("touchend", (e) => {
              const diffX = e.changedTouches[0].clientX - startX;
              if (diffX < -55) {
                document.querySelectorAll(".trip-item.swiped").forEach(el => el.classList.remove("swiped"));
                card.classList.add("swiped");
                swiped = true;
              } else if (diffX > 40 && swiped) {
                card.classList.remove("swiped");
                swiped = false;
              }
            });

            card.onclick = () => {
              if (card.classList.contains("swiped")) {
                card.classList.remove("swiped");
                return;
              }
              apriSchedaViaggio(nome);
            };

            wrap.appendChild(delBg);
            wrap.appendChild(card);
            cont.appendChild(wrap);
          });
        }
      } catch (e) {
        cont.innerHTML = `<div style="text-align:center; padding:25px; color:var(--red);">Connessione con Google Drive fallita. Tocca 🔄 in alto per riprovare.</div>`;
      }
    }

    async function confermaEliminazioneFoglio(nomeFoglio) {
      const ok = confirm(`Attenzione procedendo si cancellerà anche il File Excel ("${nomeFoglio}").\n\nVuoi procedere definitivamente?`);
      if (!ok) return;

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "deleteSheet", sheetName: nomeFoglio })
      });

      setTimeout(() => scaricaSchedeViaggi(), 1100);
    }

    async function creaNuovoFoglioViaggio() {
      const nome = prompt("Nome del nuovo viaggio (es. Kurdistan 2027):");
      if (!nome || !nome.trim()) return;
      const clean = nome.trim();

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "createSheet", newSheetName: clean })
      });

      setTimeout(() => scaricaSchedeViaggi(), 1200);
    }

    async function apriSchedaViaggio(nomeFoglio) {
      schedaAttiva = nomeFoglio;
      document.getElementById("vistaHome").style.display = "none";
      document.getElementById("vistaViaggio").style.display = "block";
      document.getElementById("fabNuovaTappa").style.display = "block";
      document.getElementById("nomeViaggioAttivo").innerText = "🏍️ " + nomeFoglio;

      const cont = document.getElementById("contenitoreTappe");
      cont.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">Lettura tappe "${nomeFoglio}"...</div>`;

      try {
        const res = await fetchWithTimeout(`${SCRIPT_URL}?sheetName=${encodeURIComponent(nomeFoglio)}&_t=${Date.now()}`, 6000);
        tappeCorrenti = await res.json();
        renderTappeViaggio(tappeCorrenti);
      } catch (e) {
        cont.innerHTML = `<div style="text-align:center; padding:30px; color:var(--red);">Errore lettura tappe o timeout connessione.</div>`;
      }
    }

    function getTempColorClass(tempStr) {
      if (!tempStr) return "temp-mild";
      const nums = (tempStr.match(/-?\d+/g) || []).map(Number);
      if (nums.length === 0) return "temp-mild";
      if (Math.max(...nums) > 28) return "temp-hot";
      if (Math.min(...nums) < 15) return "temp-cold";
      return "temp-mild";
    }

    function toggleProfiloAltimetrico(idx) {
      const box = document.getElementById(`ele-box-${idx}`);
      if (box) box.style.display = (box.style.display === "block") ? "none" : "block";
    }

    function generaSvgAltimetriaHD(elevationArray, depName, arrName, maxEle) {
      if (!elevationArray || elevationArray.length < 2) {
        return `<div style="font-size:11px; color:var(--text-muted); text-align:center;">Dati altimetrici non disponibili</div>`;
      }
      const W = 340, H = 105;
      const tetto = Math.max(...elevationArray, 150);
      const stepX = (W - 32) / (elevationArray.length - 1);

      const pts = elevationArray.map((ele, idx) => {
        const x = (16 + idx * stepX).toFixed(1);
        const y = (H - 22 - ((Math.max(0, ele) / tetto) * (H - 44))).toFixed(1);
        return { x, y, ele: Math.round(ele) };
      });

      const polyPoints = `${pts[0].x},${H-20} ` + pts.map(p => `${p.x},${p.y}`).join(" ") + ` ${pts[pts.length-1].x},${H-20}`;
      const linePoints = pts.map(p => `${p.x},${p.y}`).join(" ");

      let peakPt = pts[0];
      pts.forEach(p => { if (p.ele > peakPt.ele) peakPt = p; });

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">
          <defs>
            <linearGradient id="gradEle" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#facc15" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#facc15" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <polygon points="${polyPoints}" fill="url(#gradEle)" />
          <polyline points="${linePoints}" fill="none" stroke="#facc15" stroke-width="2.2" />
          <circle cx="${peakPt.x}" cy="${peakPt.y}" r="4" fill="#00e5ff" />
          <text x="${peakPt.x}" y="${Math.max(12, peakPt.y - 6)}" fill="#00e5ff" font-size="10" font-weight="800" text-anchor="middle">⛰️ Max ${maxEle}m</text>
          <text x="16" y="${H-5}" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="start">${depName.slice(0,12)} (${pts[0].ele}m)</text>
          <text x="${W-16}" y="${H-5}" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="end">${arrName.slice(0,12)} (${pts[pts.length-1].ele}m)</text>
        </svg>
      `;
    }

    async function renderTappeViaggio(tappe) {
      const cont = document.getElementById("contenitoreTappe");
      const statsHeader = document.getElementById("riepilogoKmViaggio");
      cont.innerHTML = "";

      if (!tappe || tappe.length === 0) {
        statsHeader.innerText = "0 tappe • 0 km";
        cont.innerHTML = `<div style="text-align:center; padding:45px 20px; color:var(--text-muted);">Nessuna tappa presente.<br>Tocca <strong>➕ NUOVA TAPPA</strong> in basso a destra.</div>`;
        return;
      }

      let sommaKm = 0;

      for (let i = 0; i < tappe.length; i++) {
        const t = tappe[i];
        sommaKm += (parseFloat(t.km) || 0);

        const card = document.createElement("article");
        card.className = "card";

        const gmaps = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(t.partenza)}&destination=${encodeURIComponent(t.arrivo)}${t.passaggio ? '&waypoints=' + encodeURIComponent(t.passaggio) : ''}`;
        const btnRouteHtml = (t.myRouteUrl && t.myRouteUrl.startsWith("http"))
          ? `<a href="${t.myRouteUrl}" target="_blank" class="btn-myroute">🚀 Apri in MyRoute-App</a>`
          : `<a href="${gmaps}" target="_blank" class="btn-myroute">🗺️ Apri Percorso in Mappa</a>`;

        const tClass = getTempColorClass(t.tempMedie);
        const bH = t.ora ? parseInt(t.ora.split(":")[0]) || 8 : 8;
        const bM = t.ora ? parseInt(t.ora.split(":")[1]) || 30 : 30;

        card.innerHTML = `
          <div class="card-head">
            <div>
              <span class="card-title">TAPPA #${i + 1}</span>
              <span class="card-date">${t.data || 'DATA N/D'}</span>
            </div>
            <div class="card-actions">
              <button class="btn-card btn-edit" onclick="apriModaleModifica(${i})">✏️ Modifica</button>
              <button class="btn-card btn-del" onclick="eliminaTappa(${t.id})">🗑️</button>
            </div>
          </div>

          <div class="card-body">
            <div class="route-box">
              <div class="route-point dep">
                <div class="point-label">Partenza • Ore ${t.ora || '08:30'}</div>
                <div class="point-city">${t.partenza || 'N/D'}</div>
              </div>
              ${t.passaggio ? `
              <div class="route-point via">
                <div class="point-label">Passaggi / Valichi</div>
                <div class="point-city" style="font-size:14px; color:var(--yellow);">${t.passaggio}</div>
              </div>` : ''}
              <div class="route-point arr">
                <div class="point-label">Arrivo</div>
                <div class="point-city">${t.arrivo || 'N/D'}</div>
              </div>
            </div>

            <div class="road-telemetry">
              <div class="tele-item">
                <div class="tele-label">Distanza</div>
                <div class="tele-val" id="km-val-${i}">${t.km ? Math.round(t.km) + ' km' : '-- km'}</div>
              </div>
              <div class="tele-item">
                <div class="tele-label">Ore Guida</div>
                <div class="tele-val" id="time-val-${i}">${t.oreGuida || '--:--'}</div>
              </div>
              <div class="tele-item">
                <div class="tele-label">Alt. Max</div>
                <div class="tele-val" id="ele-val-${i}">${t.altMax ? Math.round(t.altMax) + ' m' : '-- m'}</div>
              </div>
              <div class="tele-item">
                <div class="tele-label">Temp Medie</div>
                <div class="tele-val ${tClass}" id="temp-val-${i}">${t.tempMedie || '--° / --°'}</div>
              </div>
            </div>

            <button class="btn-elevation" onclick="toggleProfiloAltimetrico(${i})">
              ⛰️ Mostra Curva Altimetrica Tappa ▾
            </button>
            <div class="ele-box" id="ele-box-${i}">
              <div style="font-size:11px; color:var(--text-muted); text-align:center;">Elaborazione altimetria stradale...</div>
            </div>

            <div class="grid-info">
              <div><span>Alloggio</span><strong>${t.alloggio || 'Non spec.'} ${t.piattaforma ? '('+t.piattaforma+')' : ''}</strong></div>
              <div><span>Parcheggio Moto</span><strong>${t.parcheggio || 'Non spec.'}</strong></div>
              <div><span>Prezzo Camera</span><strong>${t.spesa ? t.spesa + ' €' : '0 €'} (${t.pagamento || 'Da pagare'})</strong></div>
              <div><span>Pagato / Da Pagare</span><strong>${t.pagato || 0} € / <b style="color:${t.daPagare > 0 ? '#f43f5e' : '#10b981'}">${t.daPagare > 0 ? t.daPagare + ' €' : 'Saldato'}</b></strong></div>
              <div style="grid-column: span 2;"><span>Metodo di Pagamento</span><strong>${t.metodoPagamento || 'Non specificato'}</strong></div>
            </div>

            <div class="weather-box">
              <div class="weather-head">
                <span>⛅ Meteo Percorso (Step 45 Min)</span>
                <span id="w-badge-${i}" class="weather-badge-status">Inizializzazione...</span>
              </div>
              <div class="weather-scroll" id="weather-line-${i}">
                <div class="weather-cell"><div class="w-time">--:--</div><div class="w-icon">⏳</div><div class="w-temp">In attesa</div></div>
              </div>
            </div>

            ${t.note ? `<div style="font-size:12px; color:var(--yellow); margin-bottom:12px; background:#182235; padding:8px 10px; border-radius:7px; border-left:3px solid var(--yellow);">📌 ${t.note}</div>` : ''}

            ${btnRouteHtml}
          </div>
        `;

        cont.appendChild(card);
        calcolaTelemetriaCompletaCard(i, t, bH, bM);
      }

      statsHeader.innerText = `${tappe.length} tappe • ${Math.round(sommaKm)} km`;
    }

    async function calcolaTelemetriaCompletaCard(idx, t, bH, bM) {
      const wLine = document.getElementById(`weather-line-${idx}`);
      const wBadge = document.getElementById(`w-badge-${idx}`);

      // CONTROLLO TEMPORALE IMMEDIATO SULLA DATA
      const checkMeteo = analizzaFinestraMeteo(t.data);

      if (wBadge && wLine) {
        if (checkMeteo.stato === "obsoleto") {
          wBadge.className = "weather-badge-status status-obsoleto";
          wBadge.innerText = "DATO OBSOLETO";
          wLine.innerHTML = `<div style="padding:10px; text-align:center; color:#fda4af; font-size:12px; font-weight:700; width:100%;">⏳ Tappa passata: previsioni meteo non più attive.</div>`;
        } else if (checkMeteo.stato === "futuro") {
          wBadge.className = "weather-badge-status status-future";
          wBadge.innerText = "DATO NON ANCORA DISPONIBILE";
          wLine.innerHTML = `<div style="padding:10px; text-align:center; color:#fef08a; font-size:12px; font-weight:700; width:100%;">📡 Oltre 10 giorni: dati previsionali disponibili all'avvicinarsi della data.</div>`;
        } else if (checkMeteo.stato === "invalid") {
          wBadge.className = "weather-badge-status status-obsoleto";
          wBadge.innerText = "DATA NON VALIDA";
          wLine.innerHTML = `<div style="padding:10px; text-align:center; color:#fda4af; font-size:12px; font-weight:700; width:100%;">Inserire data in formato GG/MM/AAAA.</div>`;
        }
      }

      // Geocodifica e calcolo rotta
      const locNomi = [];
      if (t.partenza) locNomi.push(t.partenza);
      if (t.passaggio) {
        t.passaggio.split(",").forEach(p => { if (p.trim()) locNomi.push(p.trim()); });
      }
      if (t.arrivo) locNomi.push(t.arrivo);

      const coords = [];
      for (const name of locNomi) {
        try {
          const c = await geocode(name);
          if (c) coords.push({ ...c, name: name });
        } catch(e) {}
      }

      if (coords.length >= 2) {
        let stats = { km: t.km || 0, timeMin: 180, oreStr: t.oreGuida || "3:00", maxEle: t.altMax || 0, elevationCurve: [], fullGeometry: [] };
        try {
          stats = await getRouteAndElevationHD(coords);
        } catch (e) {
          stats.fullGeometry = coords.map(p => [p.lon, p.lat]);
        }

        const kmEl = document.getElementById(`km-val-${idx}`);
        const timeEl = document.getElementById(`time-val-${idx}`);
        const eleEl = document.getElementById(`ele-val-${idx}`);
        const eleBox = document.getElementById(`ele-box-${idx}`);

        const kmToShow = t.km > 0 ? t.km : stats.km;
        const altToShow = t.altMax > 0 ? t.altMax : stats.maxEle;

        if (kmEl) kmEl.innerText = `${Math.round(kmToShow)} km`;
        if (timeEl) timeEl.innerText = (t.oreGuida && t.oreGuida !== "0:00") ? t.oreGuida : stats.oreStr;
        if (eleEl) eleEl.innerText = `${Math.round(altToShow)} m`;
        if (eleBox && stats.elevationCurve.length > 0) {
          eleBox.innerHTML = generaSvgAltimetriaHD(stats.elevationCurve, t.partenza, t.arrivo, Math.round(altToShow));
        }

        // Se la data è nei prossimi 10 giorni calcola il meteo reale a step di 45 minuti
        if (checkMeteo.stato === "disponibile" && wBadge && wLine) {
          wBadge.className = "weather-badge-status status-live";
          wBadge.innerText = `PREVISIONE LIVE (${checkMeteo.diffDays === 0 ? 'OGGI' : 'tra ' + checkMeteo.diffDays + ' gg'})`;

          const geo = (stats.fullGeometry && stats.fullGeometry.length > 0) ? stats.fullGeometry : coords.map(p => [p.lon, p.lat]);
          const totMin = Math.max(20, stats.timeMin);
          const numStep = Math.max(2, Math.floor(totMin / 45) + 1);
          let wHtml = "";

          for (let s = 0; s < numStep; s++) {
            const frazione = s / (numStep - 1);
            const geoIdx = Math.min(geo.length - 1, Math.round(frazione * (geo.length - 1)));
            const minProg = Math.round(frazione * totMin);
            const kmProg = Math.round(frazione * kmToShow);

            const lon = geo[geoIdx][0];
            const lat = geo[geoIdx][1];

            let nomePunto = "";
            if (s === 0) nomePunto = t.partenza;
            else if (s === numStep - 1) nomePunto = t.arrivo;
            else nomePunto = `Tratta +${kmProg}km`;

            const passMin = bH * 60 + bM + minProg;
            const h = Math.floor(passMin / 60) % 24;
            const m = passMin % 60;
            const timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

            const w = await getForecastLiveFast(lat, lon, checkMeteo.isoDate, h);

            wHtml += `
              <div class="weather-cell">
                <div class="w-time">${timeStr}</div>
                <div class="w-km">+${kmProg} km</div>
                <div class="w-icon">${w.icon}</div>
                <div class="w-temp">${w.temp}°C</div>
                <div class="w-rain">💧${w.rain}%</div>
                <div class="w-name" title="${nomePunto}">${nomePunto}</div>
              </div>
            `;
          }
          wLine.innerHTML = wHtml;
        }
      }
    }

    async function geocode(loc) {
      if (!loc) return null;
      const k = loc.trim().toLowerCase();
      if (GEO_CACHE[k]) return GEO_CACHE[k];
      try {
        const r = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(loc)}&limit=1`, 3500);
        const d = await r.json();
        if (d && d.length > 0) {
          const c = { lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon) };
          GEO_CACHE[k] = c;
          return c;
        }
      } catch(e){}
      return null;
    }

    async function getRouteAndElevationHD(coords) {
      const coordStr = coords.map(p => `${p.lon},${p.lat}`).join(";");
      if (ROUTE_CACHE[coordStr]) return ROUTE_CACHE[coordStr];
      try {
        const res = await fetchWithTimeout(`https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`, 4500);
        const data = await res.json();
        let km = 0, timeMin = 0, oreStr = "0:00";
        let sampleLats = [], sampleLons = [];
        let fullGeometry = [];

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          km = Math.round(route.distance / 1000);
          timeMin = Math.round(route.duration / 60);
          const h = Math.floor(timeMin / 60);
          const m = String(timeMin % 60).padStart(2, "0");
          oreStr = `${h}:${m}`;

          fullGeometry = route.geometry.coordinates;
          const numSamples = 14;
          for (let i = 0; i < numSamples; i++) {
            const idx = Math.min(fullGeometry.length - 1, Math.floor((i / (numSamples - 1)) * (fullGeometry.length - 1)));
            sampleLons.push(fullGeometry[idx][0].toFixed(4));
            sampleLats.push(fullGeometry[idx][1].toFixed(4));
          }
        } else {
          sampleLats = coords.map(p => p.lat);
          sampleLons = coords.map(p => p.lon);
          fullGeometry = coords.map(p => [p.lon, p.lat]);
        }

        const eleRes = await fetchWithTimeout(`https://api.open-meteo.com/v1/elevation?latitude=${sampleLats.join(",")}&longitude=${sampleLons.join(",")}`, 3500);
        const eleData = await eleRes.json();
        let maxEle = 0;
        let elevationCurve = [];
        if (eleData && eleData.elevation) {
          elevationCurve = eleData.elevation;
          maxEle = Math.round(Math.max(...elevationCurve));
        }

        const out = { km, timeMin, oreStr, maxEle, elevationCurve, fullGeometry };
        ROUTE_CACHE[coordStr] = out;
        return out;
      } catch(e){
        return { km: 0, timeMin: 0, oreStr: "0:00", maxEle: 0, elevationCurve: [], fullGeometry: coords.map(p => [p.lon, p.lat]) };
      }
    }

    async function getForecastLiveFast(lat, lon, isoDate, h) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,weather_code&start_date=${isoDate}&end_date=${isoDate}&timezone=auto`;
        const res = await fetchWithTimeout(url, 3500);
        const j = await res.json();
        if (j && j.hourly && j.hourly.temperature_2m) {
          const code = j.hourly.weather_code[h] || 0;
          return {
            temp: Math.round(j.hourly.temperature_2m[h] ?? 20),
            rain: j.hourly.precipitation_probability[h] ?? 0,
            icon: code > 50 ? "🌧️" : (code > 2 ? "⛅" : "☀️")
          };
        }
      } catch(e) {}
      return { temp: "--", rain: 0, icon: "🌤️" };
    }

    function calcolaDataSuccessiva(dataStr) {
      if (!dataStr) return "";
      const m = analizzaFinestraMeteo(dataStr);
      if (m.stato === "invalid") return "";
      const p = dataStr.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (!p) return "";
      const dt = new Date(parseInt(p[3]), parseInt(p[2]) - 1, parseInt(p[1]));
      dt.setDate(dt.getDate() + 1);
      const gg = String(dt.getDate()).padStart(2, "0");
      const mm = String(dt.getMonth() + 1).padStart(2, "0");
      return `${gg}/${mm}/${dt.getFullYear()}`;
    }

    function apriModaleNuovaTappa() {
      document.getElementById("modalTitle").innerText = `🏍️ Nuova Tappa (${schedaAttiva})`;
      document.getElementById("editRowId").value = "";
      document.getElementById("editKm").value = "0";
      document.getElementById("editOre").value = "";
      document.getElementById("editAltMax").value = "0";
      document.getElementById("editTempMedie").value = "";

      const ultima = tappeCorrenti.length > 0 ? tappeCorrenti[tappeCorrenti.length - 1] : null;
      document.getElementById("inpData").value = ultima ? calcolaDataSuccessiva(ultima.data) : "";
      document.getElementById("inpOra").value = "08:30";
      document.getElementById("inpPartenza").value = ultima ? (ultima.arrivo || "") : "";
      document.getElementById("inpPassaggio").value = "";
      document.getElementById("inpArrivo").value = "";
      document.getElementById("inpAlloggio").value = "";
      document.getElementById("inpSpesa").value = "";
      document.getElementById("inpPagato").value = "0";
      document.getElementById("inpDaPagare").value = "0";
      document.getElementById("inpMyRoute").value = "";
      document.getElementById("inpNote").value = "";

      selezionaPulsante('gridPiattaforma', 'valPiattaforma', 'Booking');
      selezionaStatoPagamento('Da pagare');
      selezionaPulsante('gridMetodo', 'valMetodo', 'Revolut Daniel');
      selezionaPulsante('gridParcheggio', 'valParcheggio', 'Garage coperto');

      document.getElementById("modalTappa").style.display = "block";
    }

    function apriModaleModifica(idx) {
      const t = tappeCorrenti[idx];
      if (!t) return;
      document.getElementById("modalTitle").innerText = `✏️ Modifica Tappa #${idx + 1}`;
      document.getElementById("editRowId").value = t.id;
      document.getElementById("editKm").value = t.km || 0;
      document.getElementById("editOre").value = t.oreGuida || "";
      document.getElementById("editAltMax").value = t.altMax || 0;
      document.getElementById("editTempMedie").value = t.tempMedie || "";

      document.getElementById("inpData").value = t.data || "";
      document.getElementById("inpOra").value = t.ora || "08:30";
      document.getElementById("inpPartenza").value = t.partenza || "";
      document.getElementById("inpPassaggio").value = t.passaggio || "";
      document.getElementById("inpArrivo").value = t.arrivo || "";
      document.getElementById("inpAlloggio").value = t.alloggio || "";
      document.getElementById("inpSpesa").value = t.spesa || 0;
      document.getElementById("inpPagato").value = t.pagato || 0;
      document.getElementById("inpDaPagare").value = t.daPagare || 0;
      document.getElementById("inpMyRoute").value = t.myRouteUrl || "";
      document.getElementById("inpNote").value = t.note || "";

      selezionaPulsante('gridPiattaforma', 'valPiattaforma', t.piattaforma || 'Booking');
      selezionaStatoPagamento(t.pagamento || 'Da pagare');
      selezionaPulsante('gridMetodo', 'valMetodo', t.metodoPagamento || 'Revolut Daniel');
      selezionaPulsante('gridParcheggio', 'valParcheggio', t.parcheggio || 'Garage coperto');

      document.getElementById("modalTappa").style.display = "block";
    }

    function chiudiModale() {
      document.getElementById("modalTappa").style.display = "none";
    }

    async function eliminaTappa(rowId) {
      if (!confirm("Confermi l'eliminazione di questa tappa?")) return;
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "delete", sheetName: schedaAttiva, rowId: rowId })
      });
      setTimeout(() => apriSchedaViaggio(schedaAttiva), 1000);
    }

    async function salvaTappa() {
      const dep = document.getElementById("inpPartenza").value.trim();
      const via = document.getElementById("inpPassaggio").value.trim();
      const arr = document.getElementById("inpArrivo").value.trim();
      const dataStr = document.getElementById("inpData").value.trim();
      const rowId = document.getElementById("editRowId").value;

      if (!dep || !arr) {
        alert("Inserisci Città di Partenza e Arrivo!");
        return;
      }

      const btn = document.getElementById("btnSalvaTappa");
      btn.innerText = "⏳ Calcolo Rotta...";
      btn.disabled = true;

      let kmCalc = parseFloat(document.getElementById("editKm").value) || 0;
      let oreCalc = document.getElementById("editOre").value || "0:00";
      let altMaxCalc = parseFloat(document.getElementById("editAltMax").value) || 0;
      let tempCalc = document.getElementById("editTempMedie").value || "";

      try {
        const nomi = [dep];
        if (via) via.split(",").forEach(p => { if (p.trim()) nomi.push(p.trim()); });
        nomi.push(arr);

        const pts = [];
        for (const n of nomi) {
          const c = await geocode(n);
          if (c) pts.push({ ...c, name: n });
        }
        if (pts.length >= 2) {
          const st = await getRouteAndElevationHD(pts);
          if (st.km > 0) kmCalc = st.km;
          if (st.oreStr) oreCalc = st.oreStr;
          if (st.maxEle > 0) altMaxCalc = st.maxEle;
        }
      } catch (e) {}

      const spesa = parseFloat(document.getElementById("inpSpesa").value) || 0;
      const pagato = parseFloat(document.getElementById("inpPagato").value) || 0;
      const daPagare = parseFloat(document.getElementById("inpDaPagare").value) || 0;

      const payload = {
        sheetName: schedaAttiva,
        action: rowId ? "update" : "create",
        rowId: rowId || undefined,
        data: dataStr,
        ora: document.getElementById("inpOra").value || "08:30",
        partenza: dep,
        passaggio: via,
        arrivo: arr,
        km: kmCalc,
        oreGuida: oreCalc,
        altMax: altMaxCalc,
        tempMedie: tempCalc,
        alloggio: document.getElementById("inpAlloggio").value.trim(),
        piattaforma: document.getElementById("valPiattaforma").value,
        spesa: spesa,
        pagamento: document.getElementById("valPagamento").value,
        pagato: pagato,
        daPagare: daPagare,
        metodoPagamento: document.getElementById("valMetodo").value,
        parcheggio: document.getElementById("valParcheggio").value,
        note: document.getElementById("inpNote").value.trim(),
        myRouteUrl: document.getElementById("inpMyRoute").value.trim()
      };

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      btn.innerText = "💾 Salva Tappa";
      btn.disabled = false;
      chiudiModale();
      setTimeout(() => apriSchedaViaggio(schedaAttiva), 1100);
    }
  </script>
