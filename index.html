<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>djRoute Master Roadbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #131c2e;
      --accent-green: #059669;
      --accent-green-hover: #10b981;
      --accent-yellow: #f59e0b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #24324d;
      --highlight-weekend: #3730a3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      padding: 12px;
      padding-bottom: 80px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--accent-green-hover);
    }

    .brand span {
      color: #ffffff;
    }

    .sync-btn {
      background: var(--accent-green);
      color: #fff;
      border: 1px solid var(--accent-green-hover);
      padding: 10px 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .sync-btn:active {
      transform: scale(0.97);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .stage-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .stage-date {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: #60a5fa;
    }

    .stage-time {
      background: #1e293b;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .route-flow {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .location {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
    }

    .location.departure {
      color: #a7f3d0;
    }

    .location.arrival {
      color: #fca5a5;
    }

    .via-points {
      font-size: 12px;
      color: var(--text-muted);
      padding-left: 24px;
      font-style: italic;
    }

    .stage-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #0f172a;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .detail-item strong {
      color: var(--text-muted);
      display: block;
      font-size: 10px;
      text-transform: uppercase;
    }

    .actions-row {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-myroute {
      background: #1d4ed8;
      color: #fff;
      border-color: #3b82f6;
    }

    .btn-notes {
      background: #334155;
      color: #e2e8f0;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="brand">djRoute <span>2026</span></div>
      <button id="btnSyncCloud" class="sync-btn" onclick="sincronizzaCloud()">
        🔄 Sincronizza
      </button>
    </div>
    <div class="status-bar">
      <span id="syncStatus">Stato: Pronto</span>
      <span id="stageCount">0 tappe</span>
    </div>
  </header>

  <main id="tappeContainer">
    <div class="empty-state">
      Premi "Sincronizza" in alto per scaricare le tappe dal tuo Google Sheet.
    </div>
  </main>

  <script>
    // URL dell'API di Google Apps Script generata dal tuo foglio
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSg_iYdW33G7M2RDvckqApsOKZC614zho4-qTsk0ow_Bx3EmrN_kVusQIPyr8qeEC-5w/exec";

    // Carica eventuali tappe salvate localmente all'avvio
    window.addEventListener("DOMContentLoaded", () => {
      const cached = localStorage.getItem("djRoute_tappe_attive");
      if (cached) {
        try {
          const tappe = JSON.parse(cached);
          renderTappe(tappe);
        } catch (e) {
          console.error("Errore lettura cache:", e);
        }
      }
    });

    async function sincronizzaCloud() {
      const btn = document.getElementById("btnSyncCloud");
      const status = document.getElementById("syncStatus");
      
      btn.disabled = true;
      btn.innerText = "⏳ Download...";
      status.innerText = "Connessione a Google Sheets...";

      try {
        const response = await fetch(SCRIPT_URL);
        if (!response.ok) throw new Error("Errore durante la connessione al server");

        const tappe = await response.json();
        console.log("Dati scaricati:", tappe);

        if (!Array.isArray(tappe) || tappe.length === 0) {
          alert("Nessuna tappa trovata nel foglio ROADBOOK_APP.");
          status.innerText = "Nessun dato trovato";
          return;
        }

        // Memorizza i dati sul telefono per uso offline
        localStorage.setItem("djRoute_tappe_attive", JSON.stringify(tappe));
        renderTappe(tappe);
        status.innerText = `Aggiornato alle ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
      } catch (err) {
        console.error("Errore sincro:", err);
        alert("❌ Errore durante la sincronizzazione. Verifica la connessione internet.");
        status.innerText = "Errore sincronizzazione";
      } finally {
        btn.disabled = false;
        btn.innerText = "🔄 Sincronizza";
      }
    }

    function renderTappe(tappe) {
      const container = document.getElementById("tappeContainer");
      const countEl = document.getElementById("stageCount");
      
      container.innerHTML = "";
      countEl.innerText = `${tappe.length} tappe caricate`;

      tappe.forEach((tappa, index) => {
        const card = document.createElement("div");
        card.className = "stage-card";

        // Pulsante MyRoute / Navigazione
        let btnRouteHtml = "";
        if (tappa.myRouteUrl && tappa.myRouteUrl.trim().startsWith("http")) {
          btnRouteHtml = `<a href="${tappa.myRouteUrl}" target="_blank" class="action-btn btn-myroute">🗺️ Apri MyRoute</a>`;
        } else {
          // Ricerca automatica itinerario su Google Maps come fallback
          const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(tappa.partenza)}&destination=${encodeURIComponent(tappa.arrivo)}${tappa.passaggio ? '&waypoints=' + encodeURIComponent(tappa.passaggio) : ''}`;
          btnRouteHtml = `<a href="${mapsUrl}" target="_blank" class="action-btn btn-myroute">🗺️ Mappa</a>`;
        }

        card.innerHTML = `
          <div class="stage-header">
            <span class="stage-date">#${index + 1} | ${tappa.data || 'Data N/D'}</span>
            <span class="stage-time">Partenza: ${tappa.ora || '08:30'}</span>
          </div>

          <div class="route-flow">
            <div class="location departure">📍 ${tappa.partenza || 'Partenza da definire'}</div>
            ${tappa.passaggio ? `<div class="via-points">↳ Via: ${tappa.passaggio}</div>` : ''}
            <div class="location arrival">🏁 ${tappa.arrivo || 'Arrivo da definire'}</div>
          </div>

          <div class="stage-details">
            <div class="detail-item">
              <strong>Alloggio / Piattaforma</strong>
              ${tappa.alloggio || 'Libero'} ${tappa.piattaforma ? '(' + tappa.piattaforma + ')' : ''}
            </div>
            <div class="detail-item">
              <strong>Parcheggio</strong>
              ${tappa.parcheggio || 'Non specificato'}
            </div>
            <div class="detail-item">
              <strong>Spesa Totale</strong>
              ${tappa.spesa ? tappa.spesa + ' €' : '-'} (${tappa.pagamento || 'N/D'})
            </div>
            <div class="detail-item">
              <strong>Residuo da pagare</strong>
              <span style="color: ${tappa.daPagare > 0 ? '#f87171' : '#4ade80'}">
                ${tappa.daPagare > 0 ? tappa.daPagare + ' €' : 'Saldato'}
              </span>
            </div>
          </div>

          ${tappa.note ? `<div style="font-size:11px; color:#cbd5e1; margin-bottom:8px;">📝 ${tappa.note}</div>` : ''}

          <div class="actions-row">
            ${btnRouteHtml}
          </div>
        `;

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
