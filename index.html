<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>djRoute Planner & Meteo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #080b11; --card: #111723; --card-alt: #0c111a; --yellow: #facc15; --yellow-glow: rgba(250,204,21,0.25); --cyan: #00e5ff; --green: #10b981; --orange: #f97316; --red: #f43f5e; --fuchsia: #d946ef; --border: #222f46; --text: #f8fafc; --text-muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Chakra Petch', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; padding-bottom: 105px; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

    header { background: linear-gradient(145deg, #151e2e, #0b1019); border: 1px solid var(--border); border-bottom: 2px solid var(--yellow); border-radius: 16px; padding: 10px 14px; margin-bottom: 18px; box-shadow: 0 6px 24px rgba(0,0,0,0.6); }
    .header-bar { display: flex; justify-content: space-between; align-items: center; }
    .nav-btn { width: 46px; height: 46px; border-radius: 12px; border: 1px solid #334155; background: #162032; color: var(--yellow); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s ease; }
    .nav-btn:active { transform: scale(0.92); border-color: var(--yellow); box-shadow: 0 0 12px var(--yellow-glow); }
    .nav-btn.sync-btn { background: linear-gradient(135deg, #facc15, #eab308); color: #080b11; border-color: #fef08a; box-shadow: 0 0 14px rgba(250, 204, 21, 0.35); }
    .spin { animation: rotazione 0.9s linear infinite; }
    @keyframes rotazione { 100% { transform: rotate(360deg); } }

    .brand-box { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
    .brand-logo { font-size: 25px; font-weight: 800; font-style: italic; letter-spacing: 1.5px; color: #fff; }
    .brand-logo span { color: var(--yellow); }
    .brand-sub { font-size: 10px; color: var(--fuchsia); font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; }

    #vistaHome { display: block; }
    .section-tag { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; margin-bottom: 16px; }
    .section-tag span { font-size: 14px; font-weight: 800; color: var(--yellow); text-transform: uppercase; letter-spacing: 1.2px; }
    .section-tag small { color: var(--text-muted); font-size: 11px; font-weight: 600; }

    .trips-list { display: flex; flex-direction: column; gap: 12px; }
    .swipe-wrapper { position: relative; border-radius: 14px; overflow: hidden; background: #991b1b; border: 1px solid var(--border); }
    .swipe-delete-bg { position: absolute; top: 0; bottom: 0; right: 0; width: 110px; background: linear-gradient(90deg, #dc2626, #e11d48); color: #fff; font-weight: 800; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; z-index: 1; }
    .trip-item { position: relative; z-index: 2; background: var(--card); padding: 18px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: transform 0.22s ease; }
    .trip-item.swiped { transform: translateX(-105px); }
    .trip-item-title { font-size: 18px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }
    .trip-item-badge { font-size: 12px; font-weight: 800; color: #080b11; background: var(--yellow); padding: 5px 12px; border-radius: 20px; text-transform: uppercase; }
    .edit-badge { background: #1e293b; color: #94a3b8; padding: 4px 8px; font-size: 10px; border-radius: 10px; display: flex; align-items: center; justify-content: center; height: 24px; }

    .btn-create-sheet { width: 100%; margin-top: 18px; padding: 16px; background: rgba(250, 204, 21, 0.08); border: 1.5px dashed var(--yellow); border-radius: 14px; color: var(--yellow); font-size: 15px; font-weight: 800; letter-spacing: 0.8px; cursor: pointer; text-transform: uppercase; }

    #vistaViaggio { display: none; }
    .trip-banner { background: linear-gradient(90deg, #131c2e, #0e1522); border: 1px solid var(--border); border-left: 4px solid var(--yellow); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .trip-banner-name { font-size: 17px; font-weight: 800; color: var(--yellow); text-transform: uppercase; }
    .trip-banner-stats { font-size: 13px; font-weight: 700; color: var(--cyan); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.45); overflow: hidden; }
    .card-head { background: #0d131f; padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
    .card-title-box { display: flex; align-items: center; gap: 6px; }
    .card-title { font-size: 15px; font-weight: 800; color: var(--yellow); }
    .card-date { font-size: 12px; font-weight: 700; background: #1e293b; padding: 3px 9px; border-radius: 6px; border: 1px solid #334155; color: #fff; }
    .card-actions { display: flex; gap: 6px; }
    .btn-card { border: none; padding: 6px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-edit { background: #1e293b; color: var(--yellow); border: 1px solid var(--yellow); }
    .btn-del { background: rgba(244,63,94,0.18); color: #fda4af; border: 1px solid #f43f5e; }

    .card-body { padding: 14px; }
    .route-box { border-left: 2px solid var(--yellow); margin-left: 8px; padding-left: 16px; margin-bottom: 14px; }
    .route-point { position: relative; margin-bottom: 10px; }
    .route-point:last-child { margin-bottom: 0; }
    .route-point::before { content: ''; position: absolute; left: -22px; top: 5px; width: 10px; height: 10px; border-radius: 50%; }
    .route-point.dep::before { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .route-point.via::before { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
    .route-point.arr::before { background: var(--red); box-shadow: 0 0 8px var(--red); }
    .point-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .point-city { font-size: 17px; font-weight: 800; color: #fff; }

    .road-telemetry { display: grid; grid-template-columns: 1fr 1fr 1fr 1.25fr; gap: 6px; margin-bottom: 10px; background: var(--card-alt); border: 1px solid var(--border); border-radius: 12px; padding: 9px 6px; }
    .tele-item { text-align: center; display: flex; flex-direction: column; justify-content: center; }
    .tele-item:not(:last-child) { border-right: 1px solid #1e2a3f; }
    .tele-label { font-size: 9px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
    .tele-val { font-size: 15px; font-weight: 800; color: var(--yellow); }

    .btn-elevation { width: 100%; background: #151f32; border: 1px solid #2d3f5e; color: var(--yellow); padding: 9px; border-radius: 9px; font-size: 12px; font-weight: 800; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; text-transform: uppercase; }
    .ele-box { display: none; background: #090d15; border: 1px solid var(--border); border-radius: 10px; padding: 12px 10px; margin-bottom: 12px; }

    .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--card-alt); border: 1px solid var(--border); border-radius: 10px; padding: 11px; margin-bottom: 12px; font-size: 12px; }
    .grid-info div span { display: block; font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .grid-info div strong { color: #fff; font-size: 14px; font-weight: 700; }

    .weather-box { background: var(--card-alt); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 12px; }
    .weather-head { font-size: 11px; font-weight: 800; color: var(--yellow); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; }
    .weather-badge-status { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 5px; }

    .btn-route-container { display: flex; gap: 8px; margin-top: 14px; }
    .btn-myroute { flex: 1; padding: 12px 6px; background: #1e293b; color: var(--yellow); border: 1px solid #334155; text-align: center; border-radius: 9px; text-decoration: none; font-size: 12px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-myroute.mra { background: #0070ba !important; color: #fff !important; border-color: #38bdf8 !important; box-shadow: 0 0 12px rgba(0,112,186,0.6) !important; }

    .fab-btn { display: none; position: fixed; bottom: 20px; right: 20px; background: linear-gradient(135deg, #facc15, #eab308); color: #080b11; border: 2px solid #fef08a; padding: 14px 22px; border-radius: 30px; font-size: 14px; font-weight: 800; box-shadow: 0 6px 24px rgba(250,204,21,0.45); cursor: pointer; z-index: 99; text-transform: uppercase; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.88); z-index: 100; padding: 12px; overflow-y: auto; }
    .modal-box { background: #121927; border: 1px solid var(--yellow); border-radius: 16px; padding: 16px; max-width: 480px; margin: 10px auto 30px auto; }
    .modal-title { font-size: 18px; font-weight: 800; color: var(--yellow); margin-bottom: 16px; text-transform: uppercase; }
    
    .form-group { position: relative; margin-bottom: 14px; }
    .form-group label { display: block; font-size: 10px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input { width: 100%; min-width: 0; box-sizing: border-box; background: #080b11; border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; color: #fff; font-size: 14px; font-weight: 600; height: 44px; -webkit-appearance: none; appearance: none; }
    .form-group input:focus { outline: none; border-color: var(--yellow); }
    input[type="time"]::-webkit-date-and-time-value { text-align: left; }

    .form-row-2 { display: flex; width: 100%; gap: 10px; margin-bottom: 14px; }
    .form-row-2 .form-group { flex: 1 1 0; min-width: 0; margin-bottom: 0; overflow: hidden; }
    .form-row-3 { display: flex; width: 100%; gap: 8px; margin-bottom: 14px; }
    .form-row-3 .form-group { flex: 1 1 0; min-width: 0; margin-bottom: 0; overflow: hidden; }

    .btn-gpx-upload { width: 100%; background: rgba(0, 229, 255, 0.1); border: 1.5px dashed #00e5ff; color: #00e5ff; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; text-align: center; margin-bottom: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-gpx-upload:active { background: rgba(0, 229, 255, 0.2); }
    #inpFileGpx { display: none; }

    .btn-select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .opt-btn { background: #162032; border: 1px solid #2d3f5e; color: #cbd5e1; padding: 10px 4px; border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.15s ease; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .opt-btn[data-val="Booking"].active { background: #003b95 !important; color: #fff !important; border-color: #0056d2 !important; box-shadow: 0 0 12px rgba(0,59,149,0.5) !important; }
    .opt-btn[data-val="Airbnb"].active { background: #10b981 !important; color: #fff !important; border-color: #34d399 !important; box-shadow: 0 0 12px rgba(16,185,129,0.5) !important; }
    .opt-btn[data-val="Expedia"].active { background: #facc15 !important; color: #080b11 !important; border-color: #fef08a !important; box-shadow: 0 0 12px rgba(250,204,21,0.5) !important; }
    .opt-btn[data-val="Da pagare"].active { background: #f43f5e !important; color: #fff !important; border-color: #fda4af !important; box-shadow: 0 0 12px rgba(244,63,94,0.6) !important; }
    .opt-btn[data-val="Acconto"].active { background: #f59e0b !important; color: #fff !important; border-color: #fcd34d !important; box-shadow: 0 0 12px rgba(245,158,11,0.6) !important; }
    .opt-btn[data-val="Pagato"].active { background: #10b981 !important; color: #fff !important; border-color: #6ee7b7 !important; box-shadow: 0 0 12px rgba(16,185,129,0.6) !important; }
    .opt-btn[data-val="Revolut Daniel"].active { background: #f8fafc !important; color: #0f172a !important; border-color: #cbd5e1 !important; box-shadow: 0 0 12px rgba(255,255,255,0.5) !important; }
    .opt-btn[data-val="N26 Daniel"].active { background: #94a3b8 !important; color: #0f172a !important; border-color: #e2e8f0 !important; box-shadow: 0 0 12px rgba(148,163,184,0.5) !important; }
    .opt-btn[data-val="Carta Emanuela"].active { background: #f97316 !important; color: #fff !important; border-color: #fdba74 !important; box-shadow: 0 0 12px rgba(249,115,22,0.5) !important; }
    .opt-btn[data-val="Paypal Emanuela"].active, .opt-btn[data-val="Paypal Daniel"].active { background: #0070ba !important; color: #fff !important; border-color: #7dd3fc !important; box-shadow: 0 0 12px rgba(0,112,186,0.5) !important; }
    .opt-btn[data-val="Bonifico"].active { background: #facc15 !important; color: #080b11 !important; border-color: #fef08a !important; box-shadow: 0 0 12px rgba(250,204,21,0.5) !important; }
    .opt-btn[data-val="Cash in Struttura"].active { background: #22c55e !important; color: #fff !important; border-color: #86efac !important; box-shadow: 0 0 12px rgba(34,197,94,0.5) !important; }
    .opt-btn[data-val="Garage"].active { background: #16a34a !important; color: #fff !important; border-color: #86efac !important; box-shadow: 0 0 12px rgba(22,163,74,0.5) !important; }
    .opt-btn[data-val="Coperto in Struttura"].active { background: #2563eb !important; color: #fff !important; border-color: #93c5fd !important; box-shadow: 0 0 12px rgba(37,99,235,0.5) !important; }
    .opt-btn[data-val="Parcheggio custodito"].active { background: #0ea5e9 !important; color: #fff !important; border-color: #7dd3fc !important; box-shadow: 0 0 12px rgba(14,165,233,0.5) !important; }
    .opt-btn[data-val="Cortile privato"].active { background: #eab308 !important; color: #080b11 !important; border-color: #fef08a !important; box-shadow: 0 0 12px rgba(234,179,8,0.5) !important; }
    .opt-btn[data-val="Esterno struttura"].active { background: #ea580c !important; color: #fff !important; border-color: #fdba74 !important; box-shadow: 0 0 12px rgba(234,88,12,0.5) !important; }
    .opt-btn[data-val="In attesa di conferma"].active { background: #ef4444 !important; color: #fff !important; border-color: #fca5a5 !important; box-shadow: 0 0 12px rgba(239,68,68,0.8) !important; animation: pulseRed 1.5s infinite; }
    @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 8px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
    .opt-btn.active { background: var(--yellow); color: #080b11; border-color: #fef08a; box-shadow: 0 0 10px var(--yellow-glow); }

    .suggest-list { position: absolute; top: 100%; left: 0; right: 0; background: #1b263b; border: 1px solid var(--yellow); border-radius: 7px; z-index: 150; max-height: 160px; overflow-y: auto; display: none; }
    .suggest-item { padding: 9px 12px; font-size: 13px; color: #fff; border-bottom: 1px solid #24324d; cursor: pointer; }
    .suggest-item:active, .suggest-item:hover { background: var(--yellow); color: #080b11; font-weight: 700; }
    
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn-save { flex: 1; background: var(--yellow); color: #080b11; border: none; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; text-transform: uppercase; }
    .btn-cancel { flex: 1; background: #263349; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; text-transform: uppercase; }
  </style>
</head>
<body>

  <header>
    <div class="header-bar">
      <button class="nav-btn" onclick="mostraHome()" title="Torna ai Viaggi" style="width: 58px; height: 58px; position: relative; background: #111827; border: 1px solid #1f2937;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.6;">
          <circle cx="5.5" cy="16.5" r="3.5" stroke="#00e5ff"/>
          <circle cx="18.5" cy="16.5" r="3.5" stroke="#facc15"/>
          <path d="M15 6h3l3 5.5V15h-2.5"/>
          <path d="M11.5 12H15l-1-4h-3L8.5 12H5"/>
          <path d="M8.5 12l-2-6h-3"/>
        </svg>
        <span style="position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); font-weight: 900; font-size: 15px; color: #fff; text-shadow: 0 0 8px #00e5ff, 0 0 12px #00e5ff; font-style: italic; letter-spacing: 1px;">DJ</span>
      </button>
      <div class="brand-box">
        <div class="brand-logo">dj<span>Route</span></div>
        <div class="brand-sub">planner & Meteo</div>
      </div>
      <button class="nav-btn sync-btn" id="btnSync" onclick="sincronizzaVistaAttiva()" title="Sincronizza con Foglio" style="width: 58px; height: 58px;">
        <svg id="syncIcon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 16h5v5"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="vistaHome">
    <div class="section-tag">
      <span>📁 Schede Viaggi Attive</span>
      <small>⬅️ Scorri a sinistra per eliminare</small>
    </div>
    <div class="trips-list" id="listaSchedeViaggi">
      <div style="text-align:center; padding:30px; color:var(--text-muted);">Sincronizzazione schede viaggio...</div>
    </div>
    <button class="btn-create-sheet" onclick="creaNuovoFoglioViaggio()">+ Crea Nuovo Foglio Viaggio</button>
  </main>

  <main id="vistaViaggio">
    <div class="trip-banner">
      <div class="trip-banner-name" id="nomeViaggioAttivo">Viaggio</div>
      <div class="trip-banner-stats" id="riepilogoKmViaggio">0 tappe • 0 km</div>
    </div>
    <div id="contenitoreTappe"></div>
  </main>

  <button class="fab-btn" id="fabNuovaTappa" onclick="apriModaleNuovaTappa()">➕ Nuova Tappa</button>

  <div id="modalTappa" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">🏍️ Nuova Tappa</div>

      <label for="inpFileGpx" class="btn-gpx-upload" id="lblGpx">🗺️ Importa GPX (Calcolo e Condivisione)</label>
      <input type="file" id="inpFileGpx" accept=".gpx" onchange="leggiFileGPX(event)">

      <input type="hidden" id="editRowId" value="">
      <input type="hidden" id="editKm" value="0">
      <input type="hidden" id="editOre" value="">
      <input type="hidden" id="editAltMax" value="0">
      <input type="hidden" id="editTempMedie" value="">
      <input type="hidden" id="editMyRouteUrl" value="">
      
      <div class="form-row-2">
        <div class="form-group"><label>Data</label><input type="text" id="inpData" placeholder="Lun 18/10/2026"></div>
        <div class="form-group"><label>Ora Partenza</label><input type="time" id="inpOra" value="08:30"></div>
      </div>

      <div class="form-group"><label>Città di Partenza</label><input type="text" id="inpPartenza" placeholder="Digita città..." autocomplete="off"><div id="sugPartenza" class="suggest-list"></div></div>
      <div class="form-group"><label>Passaggi / Valichi</label><input type="text" id="inpPassaggio" placeholder="es. Passo Tonale, Edolo" autocomplete="off"><div id="sugPassaggio" class="suggest-list"></div></div>
      <div class="form-group"><label>Città di Arrivo</label><input type="text" id="inpArrivo" placeholder="Digita città..." autocomplete="off"><div id="sugArrivo" class="suggest-list"></div></div>
      
      <div class="form-group"><label>Nome Alloggio</label><input type="text" id="inpAlloggio" placeholder="es. Hotel Mantova"></div>
      
      <input type="hidden" id="valPiattaforma" value="Booking">
      <div class="form-group"><label>Piattaforma</label><div class="btn-select-grid" id="gridPiattaforma"><button type="button" class="opt-btn active" data-val="Booking" onclick="selezionaPulsante('gridPiattaforma', 'valPiattaforma', 'Booking')">Booking</button><button type="button" class="opt-btn" data-val="Airbnb" onclick="selezionaPulsante('gridPiattaforma', 'valPiattaforma', 'Airbnb')">Airbnb</button><button type="button" class="opt-btn" data-val="Expedia" onclick="selezionaPulsante('gridPiattaforma', 'valPiattaforma', 'Expedia')">Expedia</button><button type="button" class="opt-btn" data-val="Pren. Diretta" onclick="selezionaPulsante('gridPiattaforma', 'valPiattaforma', 'Pren. Diretta')">Pren. Diretta</button><button type="button" class="opt-btn" data-val="Altro" style="grid-column: span 2;" onclick="selezionaPulsante('gridPiattaforma', 'valPiattaforma', 'Altro')">Altro</button></div></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSg_iYdW33G7M2RDvckqApsOKZC614zho4-qTsk0ow_Bx3EmrN_kVusQIPyr8qeEC-5w/exec";
    
    let schedeViaggi = []; let schedaAttiva = ""; let tappeCorrenti = [];
    const GEO_CACHE = {}; const ROUTE_CACHE = {};
    let gpxCacheData = ""; let gpxCacheName = "";
    
    const NOMI_GIORNI = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];

    window.addEventListener("DOMContentLoaded", () => { mostraHome(); });

    function parseItalianDateStr(str) {
      if(!str) return null;
      let match = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if(match) return new Date(match[3], match[2]-1, match[1]);
      return null;
    }
    function formattaDataConGiorno(d) {
      return `${NOMI_GIORNI[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }

    function haversineDist(lat1, lon1, lat2, lon2) {
      const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    
    function geocodeInversoGoogle(lat, lon) {
      return new Promise((resolve) => {
         google.script.run
           .withSuccessHandler(res => resolve(res))
           .withFailureHandler(err => resolve(`${lat.toFixed(4)}, ${lon.toFixed(4)}`))
           .risolviCittaDaCoordinateNative(lat, lon);
      });
    }

    async function leggiFileGPX(event) {
      const file = event.target.files[0]; if (!file) return;
      const lbl = document.getElementById("lblGpx");
      lbl.innerText = "⏳ Lettura file GPX..."; lbl.style.color = "var(--yellow)"; lbl.style.borderColor = "var(--yellow)";

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const txt = e.target.result;
          const parser = new DOMParser(); const xmlDoc = parser.parseFromString(txt, "text/xml");
          let trkpts = xmlDoc.getElementsByTagName("trkpt"); 
          if (trkpts.length === 0) trkpts = xmlDoc.getElementsByTagName("rtept");
          if (trkpts.length === 0) trkpts = xmlDoc.getElementsByTagName("wpt");
          if (trkpts.length < 2) { alert("File GPX non valido o con pochi punti."); lbl.innerText = "🗺️ Importa GPX (Calcolo e Condivisione)"; return; }
          
          let totalKm = 0;
          for (let i = 0; i < trkpts.length-1; i++) {
             totalKm += haversineDist(parseFloat(trkpts[i].getAttribute("lat")), parseFloat(trkpts[i].getAttribute("lon")), parseFloat(trkpts[i+1].getAttribute("lat")), parseFloat(trkpts[i+1].getAttribute("lon")));
          }
          
          lbl.innerText = `⏳ Localizzazione con Google Maps...`;
          
          const nameStart = await geocodeInversoGoogle(parseFloat(trkpts[0].getAttribute("lat")), parseFloat(trkpts[0].getAttribute("lon")));
          const nameEnd = await geocodeInversoGoogle(parseFloat(trkpts[trkpts.length-1].getAttribute("lat")), parseFloat(trkpts[trkpts.length-1].getAttribute("lon")));

          document.getElementById("inpPartenza").value = nameStart;
          document.getElementById("inpArrivo").value = nameEnd;
          document.getElementById("editKm").value = Math.round(totalKm);
          
          gpxCacheData = txt; 
          gpxCacheName = file.name;
          
          lbl.innerText = `✅ Caricato (${Math.round(totalKm)}km - Pronto al Cloud)`;
          lbl.style.color = "var(--green)"; lbl.style.borderColor = "var(--green)";
        } catch (err) { alert("Errore durante l'elaborazione del GPX: " + err.message); lbl.innerText = "🗺️ Importa GPX (Calcolo e Condivisione)"; }
      };
      reader.readAsText(file);
    }

    function selezionaPulsante(containerId, hiddenInputId, valore) {
      document.getElementById(hiddenInputId).value = valore;
      const btns = document.getElementById(containerId).querySelectorAll('.opt-btn');
      btns.forEach(btn => { if (btn.getAttribute('data-val') === valore) btn.classList.add('active'); else btn.classList.remove('active'); });
    }
    function selezionaStatoPagamento(stato) {
      selezionaPulsante('gridPagamento', 'valPagamento', stato);
      const spesa = parseFloat(document.getElementById("inpSpesa").value)||0; const inpPagato = document.getElementById("inpPagato"); const inpDaPagare = document.getElementById("inpDaPagare");
      if (stato === "Pagato") { inpPagato.value = spesa; inpDaPagare.value = 0; } else if (stato === "Da pagare") { inpPagato.value = 0; inpDaPagare.value = spesa; }
      else { const p = parseFloat(inpPagato.value)||0; inpDaPagare.value = Math.max(0, Math.round((spesa-p)*100)/100); }
    }
    function ricalcolaPagamentiDaInput(origine) {
      const spesa = parseFloat(document.getElementById("inpSpesa").value)||0; const inpPagato = document.getElementById("inpPagato"); const inpDaPagare = document.getElementById("inpDaPagare");
      let p = parseFloat(inpPagato.value)||0;
      if (origine === 'spesa') { if (document.getElementById("valPagamento").value === "Pagato") { inpPagato.value = spesa; p = spesa; } }
      else if (origine === 'pagato') { if (p >= spesa && spesa > 0) selezionaStatoPagamento('Pagato'); else if (p > 0 && p < spesa) selezionaStatoPagamento('Acconto'); else selezionaStatoPagamento('Da pagare'); }
      inpDaPagare.value = Math.max(0, Math.round((spesa-p)*100)/100);
    }

    function attivaAutocompleteMappa(inputId, boxId, multiplo = false) {
      const inp = document.getElementById(inputId); const box = document.getElementById(boxId); let timer = null;
      inp.addEventListener("input", () => {
        clearTimeout(timer); let raw = inp.value; let query = multiplo ? raw.split(",").pop().trim() : raw.trim();
        if (query.length < 3) { box.style.display = "none"; return; }
        timer = setTimeout(async () => {
          try {
            const res = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&accept-language=it,en`, 3500);
            const list = await res.json(); if (!list || list.length === 0) { box.style.display = "none"; return; }
            box.innerHTML = "";
            list.forEach(item => {
              const div = document.createElement("div"); div.className = "suggest-item"; const parti = item.display_name.split(","); div.innerText = "📍 " + parti.slice(0,3).join(",");
              div.onclick = () => {
                const citta = parti[0].trim();
                if (multiplo && raw.includes(",")) inp.value = raw.split(",").slice(0,-1).map(s=>s.trim()).join(", ") + ", " + citta; else inp.value = citta;
                GEO_CACHE[citta.toLowerCase()] = { lat: parseFloat(item.lat), lon: parseFloat(item.lon), name: citta }; box.style.display = "
