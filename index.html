<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>djRoutePlanner - Roadbook & Live Weather</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="djRoute">
  <meta name="theme-color" content="#0b0f17">
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS per importazione Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <!-- Chart.js per grafico altimetrico -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { 
      background-color: #0b0f17; 
      color: #f0f6fc; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }

    /* Margine di sicurezza superiore per Dynamic Island e Notch su iPhone */
    .header-dynamic-island {
      padding-top: max(env(safe-area-inset-top, 56px), 58px) !important;
      padding-bottom: 12px !important;
    }

    /* Sfondo Cinematografico Scuro con Moto */
    .bg-cinema-wrap {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -2;
      overflow: hidden;
      background: #090d14;
    }
    .bg-cinema {
      position: absolute;
      top: -10%; left: -10%; width: 120%; height: 120%;
      background: url('https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?q=80&w=1920&auto=format&fit=crop') center center / cover no-repeat;
      animation: kenburns 35s ease-in-out infinite alternate;
      filter: brightness(0.24) contrast(1.2) saturate(0.9);
    }
    @keyframes kenburns {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.06) translate(-1.5%, -1%); }
      100% { transform: scale(1.12) translate(1.5%, 1.5%); }
    }
    .cinema-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(180deg, rgba(11,15,23,0.88) 0%, rgba(11,15,23,0.93) 50%, rgba(11,15,23,0.98) 100%);
      z-index: -1;
      pointer-events: none;
    }

    .glass-card {
      background: rgba(22, 27, 34, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .scroll-hide::-webkit-scrollbar { display: none; }
    .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* Tendina autocompletamento città */
    .autocomplete-dropdown {
      position: absolute;
      left: 0; right: 0; top: 100%;
      z-index: 70;
      background: #1c2128;
      border: 1px solid #444c56;
      border-radius: 0.75rem;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 4px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.7);
    }
    .autocomplete-item {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid #30363d;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover, .autocomplete-item:active {
      background: #2d333b;
      color: #f59e0b;
    }
  </style>
</head>
<body class="pb-24 min-h-screen relative select-none">

  </div>

  <script>
    let tappe = [];
    let vistaAttuale = "dashboard";
    let indexTappaAttiva = 0;
    let chartInstance = null;
    let debounceTimer = null;

    // Normalizzazione testo per ricerca insensibile a maiuscole, minuscole e accenti
    function normalizzaTesto(t) {
      return (t || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    }

    // GESTIONE INPUT DATA CON SEPARAZIONE AUTOMATICA DELLE CIFRE
    function gestisciInputData(input) {
      let v = input.value.replace(/\D/g, '');
      if (v.length > 2 && v.length <= 4) {
        v = v.substring(0, 2) + '/' + v.substring(2);
      } else if (v.length > 4) {
        v = v.substring(0, 2) + '/' + v.substring(2, 4) + '/' + v.substring(4, 8);
      }
      input.value = v;
      document.getElementById('m_giorno').value = calcolaGiornoDaData(v);
    }

    function formattaInGiornoMeseAnno(val) {
      if (!val) return "";
      if (val instanceof Date && !isNaN(val.getTime())) {
        const gg = String(val.getDate()).padStart(2, '0');
        const mm = String(val.getMonth() + 1).padStart(2, '0');
        const aaaa = val.getFullYear();
        return `${gg}/${mm}/${aaaa}`;
      }
      const str = String(val).trim();
      if (str.includes('/')) {
        const p = str.split('/');
        if (p.length === 3) return `${p[0].padStart(2, '0')}/${p[1].padStart(2, '0')}/${p[2]}`;
      }
      if (str.includes('-')) {
        const p = str.split('T')[0].split('-');
        if (p.length === 3) return `${p[2].padStart(2, '0')}/${p[1].padStart(2, '0')}/${p[0]}`;
      }
      return str;
    }

    function calcolaGiornoDaData(strData) {
      if (!strData || strData.length < 10) return "";
      const p = strData.split('/');
      if (p.length !== 3) return "";
      const gg = parseInt(p[0], 10);
      const mm = parseInt(p[1], 10) - 1;
      const aaaa = parseInt(p[2], 10);
      const d = new Date(aaaa, mm, gg);
      if (isNaN(d.getTime())) return "";
      const nomi = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
      return nomi[d.getDay()];
    }

    // AUTOCOMPLETAMENTO CITTÀ, FRAZIONI E PASSI (MULTI-INDEX)
    function cercaCittaLive(inputElem, dropId) {
      const q = normalizzaTesto(inputElem.value);
      const drop = document.getElementById(dropId);
      clearTimeout(debounceTimer);

      if (q.length < 2) {
        drop.classList.add('hidden');
        drop.innerHTML = '';
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          // Ricerca combinata ad alta copertura (Open-Meteo + Photon OSM)
          const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6&lang=it`);
          const data = await res.json();
          if (data.features && data.features.length > 0) {
            drop.innerHTML = data.features.map(f => {
              const p = f.properties;
              const nome = p.name || '';
              const extra = [p.state, p.country].filter(Boolean).join(', ');
              return `
                <div class="autocomplete-item" onmousedown="selezionaCitta('${inputElem.id}', '${dropId}', '${nome.replace(/'/g, "\\'")}', '${extra.replace(/'/g, "\\'")}')">
                  <span class="font-bold text-white">${nome}</span>
                  <span class="text-[11px] text-gray-400 block">${extra}</span>
                </div>
              `;
            }).join('');
            drop.classList.remove('hidden');
          } else {
            // Fallback su indice Open-Meteo
            const res2 = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=it&format=json`);
            const data2 = await res2.json();
            if (data2.results && data2.results.length > 0) {
              drop.innerHTML = data2.results.map(r => {
                const extra = [r.admin1, r.country].filter(Boolean).join(', ');
                return `
                  <div class="autocomplete-item" onmousedown="selezionaCitta('${inputElem.id}', '${dropId}', '${r.name.replace(/'/g, "\\'")}', '${extra.replace(/'/g, "\\'")}')">
                    <span class="font-bold text-white">${r.name}</span>
                    <span class="text-[11px] text-gray-400 block">${extra}</span>
                  </div>
                `;
              }).join('');
              drop.classList.remove('hidden');
            } else {
              drop.classList.add('hidden');
            }
          }
        } catch(e) {
          drop.classList.add('hidden');
        }
      }, 200);
    }

    function ritardoChiudiDropdown(dropId) {
      setTimeout(() => {
        const drop = document.getElementById(dropId);
        if (drop) drop.classList.add('hidden');
      }, 250);
    }

    async function selezionaCitta(inputId, dropId, nome, extra) {

    // CALCOLO AUTOMATICO: KM, ORE GUIDA, QUOTA E TEMPERATURE MIN/MAX
    async function calcolaMetricheRottaAutomatica() {
      const p = document.getElementById('m_partenza').value.trim();
      const a = document.getElementById('m_arrivo').value.trim();
      if (!p || !a) return;

      const pClean = p.split('(')[0].trim();
      const aClean = a.split('(')[0].trim();

      try {
        const [resP, resA] = await Promise.all([
          fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(pClean)}&count=1&language=it&format=json`).then(r => r.json()),
          fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(aClean)}&count=1&language=it&format=json`).then(r => r.json())
        ]);

        if (!resP.results || !resA.results) return;

        const start = resP.results[0];
        const end = resA.results[0];

        // Calcolo distanza Haversine
        const dLat = (end.latitude - start.latitude) * Math.PI / 180;
        const dLon = (end.longitude - start.longitude) * Math.PI / 180;
        const h = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(start.latitude * Math.PI / 180) * Math.cos(end.latitude * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        const distKm = Math.round(6371 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h)) * 1.25);

        // Calcolo velocità stimata in base a distanza e orografia
        const elevResInit = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${start.latitude},${end.latitude}&longitude=${start.longitude},${end.longitude}`).then(r => r.json());
        const maxQuotaPunti = Math.max(...elevResInit.elevation);
        
        // Se si toccano quote alte (passi di montagna), andatura stimata a ~70 km/h, altrimenti ~95-100 km/h
        const andaturaMedia = maxQuotaPunti > 900 ? 70 : 95;
        const oreTot = Math.floor(distKm / andaturaMedia);
        const minTot = Math.round((distKm % andaturaMedia) / andaturaMedia * 60);

        document.getElementById('m_km').value = distKm;
        document.getElementById('m_ore').value = `${oreTot}h ${minTot}m`;

        // Quota Massima lungo la tratta campionata
        const ptsLats = [start.latitude, (start.latitude + end.latitude)/2, end.latitude].join(',');
        const ptsLons = [start.longitude, (start.longitude + end.longitude)/2, end.longitude].join(',');
        const elevRes = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${ptsLats}&longitude=${ptsLons}`).then(r => r.json());
        const quotaMax = Math.max(...elevRes.elevation);
        document.getElementById('m_alt').value = `${quotaMax} m`;

        // Temperature Min/Max
        const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${start.latitude}&longitude=${start.longitude}&daily=temperature_2m_max,temperature_2m_min&timezone=auto`).then(r => r.json());
        if (wRes.daily && wRes.daily.temperature_2m_min) {
          const tMin = Math.round(wRes.daily.temperature_2m_min[0]);
          const tMax = Math.round(wRes.daily.temperature_2m_max[0]);
          document.getElementById('m_tempMinMax').value = `${tMin}° / ${tMax}°C`;
        }
      } catch(e) {}
    }

    function aggiornaRiepilogo() {
      document.getElementById('totTappeVal').textContent = tappe.length;
      let totKm = 0;
      let totMinuti = 0;

      tappe.forEach(t => {
        const km = parseFloat(t.kmTot) || 0;
        totKm += km;
        if (t.oreGuida && String(t.oreGuida).includes(':')) {
          const [h, m] = t.oreGuida.split(':').map(Number);
          totMinuti += (h * 60) + (m || 0);
        } else if (km > 0) {
          totMinuti += Math.round((km / 90) * 60);
        }
      });

      document.getElementById('totKmVal').textContent = Math.round(totKm) + " km";
      const ore = Math.floor(totMinuti / 60);
      const min = totMinuti % 60;
      document.getElementById('totOreVal').textContent = `${ore}h ${min}m`;

    function popolaTimelineOrariaIniziale(t) {
      const box = document.getElementById('timelineMeteoBox');
      const kmTot = parseFloat(t.kmTot) || 200;
      const numSegmenti = Math.max(2, Math.ceil(kmTot / 90));
      const [hPart, mPart] = (t.oraPartenza || "08:30").split(':').map(Number);

      const pNome = t.partenza ? t.partenza.split('(')[0].trim() : 'Partenza';
      const aNome = t.arrivo ? t.arrivo.split('(')[0].trim() : 'Arrivo';

      let cardsHtml = '';
      for (let i = 0; i < numSegmenti; i++) {
        const curH = (hPart + i) % 24;
        const curM = String(mPart).padStart(2, '0');
        const kmProg = i * 90;
        const cittaIpotetica = i === 0 ? pNome : (i === numSegmenti - 1 ? aNome : `~Km ${kmProg}`);

        cardsHtml += `
          <div class="flex-shrink-0 bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-center w-24 shadow">
            <span class="text-[11px] text-gray-300 font-mono font-semibold block">${String(curH).padStart(2, '0')}:${curM}</span>

          </div>
        `;
      }
      box.innerHTML = cardsHtml;
    }

    function getWmoIcon(code) {
      if (code === 0) return { icon: "fa-sun text-amber-400", label: "Sereno" };
      if (code >= 1 && code <= 3) return { icon: "fa-cloud-sun text-yellow-300", label: "Poco nuvoloso" };
      if (code >= 45 && code <= 48) return { icon: "fa-smog text-gray-400", label: "Nebbia" };
      if (code >= 51 && code <= 67) return { icon: "fa-cloud-rain text-blue-400", label: "Pioggia" };
      if (code >= 71 && code <= 77) return { icon: "fa-snowflake text-sky-200", label: "Neve" };
      if (code >= 80 && code <= 82) return { icon: "fa-cloud-showers-heavy text-blue-500", label: "Rovesci" };
      if (code >= 95) return { icon: "fa-cloud-bolt text-purple-400", label: "Temporale" };
      return { icon: "fa-cloud text-gray-400", label: "Nuvoloso" };
    }

    // CALCOLO METEO DINAMICO CON REVERSE-GEOCODING DEL NOME CITTÀ
    async function calcolaMeteoDinamicoConGps(idx) {
      const t = tappe[idx];
      const box = document.getElementById('timelineMeteoBox');
      const note = document.getElementById('meteoStatoNote');

      if (!t.partenza && !t.arrivo) {
        alert("Inserisci almeno partenza o arrivo.");
        return;
      }

      note.innerHTML = `<span class="text-sky-300"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Rilevamento comuni attraversati e meteo orario...</span>`;

      try {
        const queryP = t.partenza.split('(')[0].trim();
        const queryA = t.arrivo.split('(')[0].trim();

        const [resP, resA] = await Promise.all([
          fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(queryP)}&count=1&language=it&format=json`).then(r => r.json()),
          fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(queryA)}&count=1&language=it&format=json`).then(r => r.json())
        ]);

        if (!resP.results || !resA.results) {
          note.innerHTML = `<span class="text-amber-400">Località non identificate.</span>`;
          return;
        }

        const coordStart = { lat: resP.results[0].latitude, lon: resP.results[0].longitude, name: resP.results[0].name };
        const coordEnd = { lat: resA.results[0].latitude, lon: resA.results[0].longitude, name: resA.results[0].name };

        const kmTot = parseFloat(t.kmTot) || 200;
        const numSegmenti = Math.max(2, Math.ceil(kmTot / 90));
        const [hPart, mPart] = (t.oraPartenza || "08:30").split(':').map(Number);

        let isStorico = false;
        let dViaggio = null;
        if (t.data) {
          const p = t.data.split('/');
          if (p.length === 3) dViaggio = new Date(p[2], p[1] - 1, p[0]);
          if (dViaggio && !isNaN(dViaggio.getTime())) {
            const diffG = Math.ceil((dViaggio - new Date()) / (1000 * 60 * 60 * 24));
            if (diffG > 14) isStorico = true;
          }
        }

        // Genera segmenti e recupera nome località reale per ciascun punto
        const segmenti = [];
        for (let i = 0; i < numSegmenti; i++) {
          const ratio = i / (numSegmenti - 1);
          const latInterp = coordStart.lat + (coordEnd.lat - coordStart.lat) * ratio;
          const lonInterp = coordStart.lon + (coordEnd.lon - coordStart.lon) * ratio;
          const curH = (hPart + i) % 24;
          const curM = String(mPart).padStart(2, '0');

          let nomePunto = i === 0 ? coordStart.name : (i === numSegmenti - 1 ? coordEnd.name : '');
          segmenti.push({
            orario: `${String(curH).padStart(2, '0')}:${curM}`,
            lat: latInterp,
            lon: lonInterp,
            nome: nomePunto
          });
        }

        // Reverse-geocoding per i punti intermedi
        for (let i = 1; i < segmenti.length - 1; i++) {
          try {
            const revRes = await fetch(`https://photon.komoot.io/reverse?lon=${segmenti[i].lon}&lat=${segmenti[i].lat}`);
            const revData = await revRes.json();
            if (revData.features && revData.features.length > 0) {
              const p = revData.features[0].properties;
              segmenti[i].nome = p.city || p.town || p.village || p.name || `Km ${i*90}`;
            } else {
              segmenti[i].nome = `Km ${i*90}`;
            }
          } catch(e) {
            segmenti[i].nome = `Km ${i*90}`;
          }
        }

        const meteoPromesse = segmenti.map(async (s) => {
          if (isStorico) {
            const anno1 = dViaggio.getFullYear() - 1;
            const anno2 = dViaggio.getFullYear() - 2;
            const mm = String(dViaggio.getMonth() + 1).padStart(2, '0');
            const dd = String(dViaggio.getDate()).padStart(2, '0');
            const resH = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${s.lat}&longitude=${s.lon}&start_date=${anno2}-${mm}-${dd}&end_date=${anno1}-${mm}-${dd}&hourly=temperature_2m`).then(r => r.json());
            let tempMedia = 20;
            if (resH.hourly && resH.hourly.temperature_2m) {
              const arr = resH.hourly.temperature_2m;
              tempMedia = Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
            }
            return { temp: tempMedia, code: 1, pioggia: 0, isStorico: true };
          } else {
            const resW = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&hourly=temperature_2m,precipitation_probability,weathercode&timezone=auto`).then(r => r.json());
            const hIndex = Math.min(12, resW.hourly.time.length - 1);
            return {
              temp: Math.round(resW.hourly.temperature_2m[hIndex]),
              code: resW.hourly.weathercode[hIndex],
              pioggia: resW.hourly.precipitation_probability ? resW.hourly.precipitation_probability[hIndex] : 0,
              isStorico: false
            };
          }
        });

        const risultatiMeteo = await Promise.all(meteoPromesse);

        box.innerHTML = segmenti.map((s, i) => {
          const w = risultatiMeteo[i];
          const { icon, label } = getWmoIcon(w.code);

          return `
            <div class="flex-shrink-0 bg-gray-900 border ${w.isStorico ? 'border-amber-500/30' : 'border-gray-700'} rounded-xl p-2.5 text-center w-24 shadow-md">
              <span class="text-[11px] text-gray-300 font-mono font-semibold block">${s.orario}</span>
              <div class="my-1 text-base"><i class="fa-solid ${icon}"></i></div>
              <span class="text-[12px] text-white font-bold block">${w.temp}°C</span>
              ${w.pioggia > 10 ? `<span class="text-[9px] text-blue-300 block"><i class="fa-solid fa-droplet text-[8px]"></i> ${w.pioggia}%</span>` : ''}
              <span class="text-[10px] text-amber-400 truncate block mt-1 font-medium" title="${s.nome}">${s.nome}</span>
            </div>
          `;
        }).join('');

        if (isStorico) {
          note.innerHTML = `<span class="text-amber-400 font-semibold"><i class="fa-solid fa-calendar-xmark mr-1"></i> Ancora è presto per questo dato.</span> Calcolate medie storiche con città di passaggio.`;
        } else {
          note.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-circle-check mr-1"></i> Previsione meteorologica attiva con comuni reali di transito.</span>`;
        }

      } catch(err) {
        note.innerHTML = `<span class="text-rose-400">Errore calcolo meteo: ${err.message}</span>`;
      }
    }

    // GRAFICO ALTIMETRICO E TEMPERATURE IN QUOTA
    async function apriGraficoQuote() {
      const t = tappe[indexTappaAttiva];
      if (!t || (!t.partenza && !t.arrivo)) return;

      document.getElementById('modalGraficoQuote').classList.remove('hidden');

      try {
        const queryP = t.partenza.split('(')[0].trim();
        const queryA = t.arrivo.split('(')[0].trim();
        const [resP, resA] = await Promise.all([
          fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(queryP)}&count=1&format=json`).then(r => r.json()),
          fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(queryA)}&count=1&format=json`).then(r => r.json())
        ]);

        const start = resP.results[0];
        const end = resA.results[0];

        const pts = [];
        for (let i = 0; i <= 10; i++) {
          const r = i / 10;
          pts.push({
            lat: start.latitude + (end.latitude - start.latitude) * r,
            lon: start.longitude + (end.longitude - start.longitude) * r,
            km: Math.round(((parseFloat(t.kmTot) || 200) / 10) * i)
          });
        }

        const elevRes = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${pts.map(p => p.lat.toFixed(4)).join(',')}&longitude=${pts.map(p => p.lon.toFixed(4)).join(',')}`).then(r => r.json());
        const altitudini = elevRes.elevation;

        // Calcolo temperatura in quota (gradiente termico ~0.65°C ogni 100m)
        const tBase = 22; // temperatura base a livello del mare
        const temperatureStimate = altitudini.map(alt => Math.round(tBase - (alt * 0.0065)));

        const maxAlt = Math.max(...altitudini);
        t.altitudine = `${maxAlt} m`;
        document.getElementById('infoAltMax').textContent = `Quota Max: ${maxAlt} m s.l.m. • Temp. Minima in Quota: ${Math.min(...temperatureStimate)}°C`;

        const ctx = document.getElementById('chartQuoteCanvas').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: pts.map((p, i) => `${p.km} km (${temperatureStimate[i]}°C)`),
            datasets: [{
              label: 'Altitudine (metri)',
              data: altitudini,
              borderColor: '#f59e0b',
              backgroundColor: 'rgba(245, 158, 11, 0.25)',
              fill: true,
              tension: 0.35,
              pointRadius: 3,
              pointBackgroundColor: '#fbbf24'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 9 } } },
              y: { grid: { color: 'rgba(255,255,255,0.08)' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
            }
          }
        });
      } catch(e) {
        document.getElementById('infoAltMax').textContent = "Profilo altimetrico stimato.";
      }
    }

    function chiudiGraficoQuote() {
      document.getElementById('modalGraficoQuote').classList.add('hidden');
    }

    function modificaTappa(idx) {
      const t = tappe[idx];
      document.getElementById('m_editIndex').value = idx;
      document.getElementById('m_data').value = t.data || '';
      document.getElementById('m_giorno').value = t.giorno || calcolaGiornoDaData(t.data);
      document.getElementById('m_ora').value = t.oraPartenza || '08:30';
      document.getElementById('m_partenza').value = t.partenza || '';
      
      const containerInt = document.getElementById('containerIntermediDinamici');
      containerInt.innerHTML = "";
      const arr = Array.isArray(t.intermedi) ? t.intermedi : (t.intermedio ? t.intermedio.split(',') : []);

        arr.forEach(val => aggiungiRigaIntermedio(val.trim()));

        aggiungiRigaIntermedio();

      document.getElementById('m_arrivo').value = t.arrivo || '';

      document.getElementById('m_ore').value = t.oreGuida || '';

      document.getElementById('m_prezzo').value = t.prezzo || '';

    function salvaTappaManuale() {
      const idx = parseInt(document.getElementById('m_editIndex').value, 10);
      const dataInserita = document.getElementById('m_data').value.trim();
      const partenza = document.getElementById('m_partenza').value.trim();
      const arrivo = document.getElementById('m_arrivo').value.trim();

      const inputsInt = document.querySelectorAll('.input-intermedio');
      const intermediList = Array.from(inputsInt).map(i => i.value.trim()).filter(v => v !== '');

      const dataFormattata = formattaInGiornoMeseAnno(dataInserita);
      const giornoCalcolato = calcolaGiornoDaData(dataFormattata);

      const tappaObj = {
        giorno: giornoCalcolato,
        data: dataFormattata,
        oraPartenza: document.getElementById('m_ora').value || "08:30",
        partenza: partenza,
        intermedi: intermediList,
        intermedio: intermediList.join(', '),
        arrivo: arrivo,
        kmTot: document.getElementById('m_km').value.trim(),
        oreGuida: document.getElementById('m_ore').value.trim() || "03:00",
        altitudine: document.getElementById('m_alt').value.trim(),
        tempMinMax: document.getElementById('m_tempMinMax').value.trim(),
        hotel: document.getElementById('m_hotel').value.trim(),
        piattaforma: document.getElementById('m_piattaforma').value,
        prezzo: document.getElementById('m_prezzo').value.trim(),
        pagato: document.getElementById('m_pagato').value,
        parcheggio: document.getElementById('m_parcheggio').value.trim(),
        myRouteUrl: document.getElementById('m_myroute').value.trim()
      };

      if (idx === -1) {
        tappe.push(tappaObj);
        indexTappaAttiva = tappe.length - 1;
      } else {
        tappe[idx] = tappaObj;
      }

      salvaSuMemoria();
      chiudiModalTappa();
      aggiornaVista();
    }

    function eliminaTappa(idx) {
      if (confirm("Vuoi eliminare questa tappa?")) {
        tappe.splice(idx, 1);
        salvaSuMemoria();
        vaiAllaHome();
      }
    }

    function scaricaGpxMultiWaypoint(idx) {
      const t = tappe[idx];
      const p = (t.partenza || 'Partenza').split('(')[0].trim();
      const a = (t.arrivo || 'Arrivo').split('(')[0].trim();
      const arr = Array.isArray(t.intermedi) ? t.intermedi : (t.intermedio ? t.intermedio.split(',') : []);
      const nome = `${p}_${a}`.replace(/\s+/g, '_');

      const waypointsGpx = arr.map(w => `<rtept lat="0.0" lon="0.0"><name>${w.split('(')[0].trim()}</name></rtept>`).join('\n');

      const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="djRoutePlanner">
  <metadata><name>${nome}</name></metadata>
  <rte>
    <name>${nome}</name>
    <rtept lat="0.0" lon="0.0"><name>${p}</name></rtept>
    ${waypointsGpx}
    <rtept lat="0.0" lon="0.0"><name>${a}</name></rtept>
  </rte>
</gpx>`;
      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${nome}.gpx`;
      link.click();
    }

    // PARSER EXCEL UNIVERSALE CON MAPPATURA INTELLIGENTE
    function importaQualsiasiExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array', cellDates: true });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });

          if (rows.length === 0) {
            alert("Il file Excel è vuoto.");
            return;
          }

          function val(riga, chiavi) {
            const cols = Object.keys(riga);
            for (let c of cols) {
              const lower = c.toLowerCase().trim();
              for (let k of chiavi) {
                if (lower === k.toLowerCase() || lower.includes(k.toLowerCase())) {
                  const v = riga[c];
                  if (v !== undefined && v !== null && String(v).trim() !== '') {
                    return String(v).trim();
                  }
                }
              }
            }
            return "";
          }

          tappe = [];
          rows.forEach((r) => {
            const dataRaw = val(r, ['data', 'date']);
            const partenza = val(r, ['partenza', 'start', 'from', 'da']);
            const arrivo = val(r, ['arrivo', 'destinazione', 'arrival', 'to', 'a']);
            const intermedio = val(r, ['intermedio', 'passo', 'via']);
            const temp = val(r, ['temp. min/max', 'temp', 'temperatura']);
            const km = val(r, ['km tot', 'km']);
            const ore = val(r, ['ore guida', 'ore']);
            const alt = val(r, ['alt.', 'altitudine']);
            const hotel = val(r, ['pernottamento', 'hotel', 'alloggio']);
            const parcheggio = val(r, ['indicazioni parcheggio', 'parcheggio', 'parking']);
            const prezzo = val(r, ['costo camera', 'prezzo €', 'prezzo', 'costo']);
            const piattaforma = val(r, ['sito prenotazione', 'piattaforma', 'booking']);
            const myroute = val(r, ['track', 'myroute', 'link']);

            const testIgnora = (dataRaw + " " + partenza + " " + arrivo).toUpperCase();
            if (testIgnora.includes("TOTALE") || testIgnora.includes("MANUTENZIONE") || testIgnora.includes("ASSICURAZIONI") || testIgnora.includes("PREVENTIVO")) {
              return;
            }

            if (dataRaw || partenza || arrivo || temp) {
              const dataFormattata = formattaInGiornoMeseAnno(dataRaw);
              const giornoCalcolato = calcolaGiornoDaData(dataFormattata);
              const arrInt = intermedio ? intermedio.split(',').map(s => s.trim()).filter(Boolean) : [];

              let platSelezionata = "Booking";
              if (piattaforma.toLowerCase().includes("expedia")) platSelezionata = "Expedia";
              if (piattaforma.toLowerCase().includes("dirett")) platSelezionata = "Pren. Diretta";

              tappe.push({
                giorno: giornoCalcolato,
                data: dataFormattata,
                oraPartenza: "08:30",
                partenza: partenza,
                intermedi: arrInt,
                intermedio: arrInt.join(', '),
                arrivo: arrivo,
                kmTot: km,
                oreGuida: ore || (km ? `${Math.floor(parseFloat(km)/90)}h` : "03:00"),
                altitudine: alt,
                tempMinMax: temp,
                hotel: hotel,
                piattaforma: platSelezionata,
                prezzo: prezzo ? (prezzo.includes('€') ? prezzo : prezzo + ' €') : "",
                pagato: "Da pagare",
                parcheggio: parcheggio,
                myRouteUrl: (myroute && myroute.startsWith('http')) ? myroute : ""
              });
            }
          });

          salvaSuMemoria();
          vaiAllaHome();
          alert(`Caricate ${tappe.length} tappe con successo!`);
        } catch(err) {
          alert("Errore nella lettura del file: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // GPS
    function attivaGps() {
      if (!navigator.geolocation) {
        alert("GPS non disponibile sul browser.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(4);
          const lon = pos.coords.longitude.toFixed(4);
          alert(`GPS Attivo!\nLat: ${lat}, Lon: ${lon}`);
          if (vistaAttuale === "dettaglio") {
            calcolaMeteoDinamicoConGps(indexTappaAttiva);
          }
        },
        () => alert("Permesso GPS non concesso o segnale debole.")
      );
    }
