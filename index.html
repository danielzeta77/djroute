<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>djROUTE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #080b11;
      --card: #111723;
      --card-alt: #0c111a;
      --yellow: #facc15;
      --yellow-glow: rgba(250, 204, 21, 0.25);
      --cyan: #00e5ff;
      --green: #10b981;
      --orange: #f97316;
      --red: #f43f5e;
      --border: #222f46;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Chakra Petch', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      padding-bottom: 105px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(145deg, #151e2e, #0b1019);
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--yellow);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 18px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.6);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-btn {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #162032;
      color: var(--yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
      transition: all 0.15s ease;
    }
    .nav-btn:active {
      transform: scale(0.92);
      border-color: var(--yellow);
      box-shadow: 0 0 12px var(--yellow-glow);
    }
    .nav-btn.sync-btn {
      background: linear-gradient(135deg, #facc15, #eab308);
      color: #080b11;
      border-color: #fef08a;
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.35);
    }
    .spin { animation: rotazione 0.9s linear infinite; }
    @keyframes rotazione { 100% { transform: rotate(360deg); } }

    .brand-logo {
      font-size: 24px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 1.5px;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .brand-logo span {
      color: var(--yellow);
    }

    #vistaHome { display: block; }
    .section-tag {
      font-size: 13px;
      font-weight: 800;
      color: var(--yellow);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 12px;
      padding-left: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-tag small {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: none;
    }

    .trips-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .swipe-wrapper {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #991b1b;
      border: 1px solid var(--border);
    }
    .swipe-delete-bg {
      position: absolute;
      top: 0; bottom: 0; right: 0;
      width: 110px;
      background: linear-gradient(90deg, #dc2626, #e11d48);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1;
    }
    .trip-item {
      position: relative;
      z-index: 2;
      background: var(--card);
      padding: 18px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: transform 0.22s ease;
    }
    .trip-item.swiped {
      transform: translateX(-105px);
    }
    .trip-item-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .trip-item-badge {
      font-size: 12px;
      font-weight: 800;
      color: #080b11;
      background: var(--yellow);
      padding: 5px 12px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .btn-create-sheet {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      background: rgba(250, 204, 21, 0.08);
      border: 1.5px dashed var(--yellow);
      border-radius: 14px;
      color: var(--yellow);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-create-sheet:active { background: rgba(250, 204, 21, 0.18); }

    #vistaViaggio { display: none; }
    .trip-banner {
      background: linear-gradient(90deg, #131c2e, #0e1522);
      border: 1px solid var(--border);
      border-left: 4px solid var(--yellow);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .trip-banner-name {
      font-size: 17px;
      font-weight: 800;
      color: var(--yellow);
      text-transform: uppercase;
    }
    .trip-banner-stats {
      font-size: 13px;
      font-weight: 700;
      color: var(--cyan);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.45);
      overflow: hidden;
    }
    .card-head {
      background: #0d131f;
      padding: 11px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--yellow);
    }
    .card-date {
      font-size: 12px;
      font-weight: 700;
      background: #1e293b;
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid #334155;
      color: #fff;
      margin-left: 8px;
    }
    .card-actions { display: flex; gap: 6px; }
    .btn-card {
      border: none;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-edit { background: #1e293b; color: var(--yellow); border: 1px solid var(--yellow); }
    .btn-del { background: rgba(244,63,94,0.18); color: #fda4af; border: 1px solid #f43f5e; }

    .card-body { padding: 14px; }

    .route-box {
      border-left: 2px solid var(--yellow);
      margin-left: 8px;
      padding-left: 16px;
      margin-bottom: 14px;
    }
    .route-point { position: relative; margin-bottom: 10px; }
    .route-point:last-child { margin-bottom: 0; }
    .route-point::before {
      content: '';
      position: absolute;
      left: -22px;
      top: 5px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .route-point.dep::before { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .route-point.via::before { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
    .route-point.arr::before { background: var(--red); box-shadow: 0 0 8px var(--red); }
    .point-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .point-city { font-size: 17px; font-weight: 800; color: #fff; }

    .road-telemetry {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1.25fr;
      gap: 6px;
      margin-bottom: 10px;
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 6px;
    }
    .tele-item { text-align: center; display: flex; flex-direction: column; justify-content: center; }
    .tele-item:not(:last-child) { border-right: 1px solid #1e2a3f; }
    .tele-label { font-size: 9px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
    .tele-val { font-size: 15px; font-weight: 800; color: var(--yellow); }
    
    .temp-hot { color: #f43f5e !important; }
    .temp-cold { color: #38bdf8 !important; }
    .temp-mild { color: #10b981 !important; }

    .btn-elevation {
      width: 100%;
      background: #151f32;
      border: 1px solid #2d3f5e;
      color: var(--yellow);
      padding: 9px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-transform: uppercase;
    }
    .ele-box {
      display: none;
      background: #090d15;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 10px;
      margin-bottom: 12px;
    }

    .grid-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .grid-info div span { display: block; font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .grid-info div strong { color: #fff; font-size: 14px; font-weight: 700; }

    .weather-box {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .weather-head {
      font-size: 11px;
      font-weight: 800;
      color: var(--yellow);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
    }
    .weather-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .weather-cell {
      flex: 0 0 auto;
      background: #131c2c;
      border: 1px solid #24344d;
      border-radius: 8px;
      padding: 7px 10px;
      text-align: center;
      min-width: 84px;
    }
    .w-time { font-size: 11px; color: var(--yellow); font-weight: 800; }
    .w-icon { font-size: 18px; margin: 3px 0; }
    .w-temp { font-size: 14px; font-weight: 800; color: #fff; }
    .w-rain { font-size: 10px; color: var(--cyan); font-weight: 700; }
    .w-name { font-size: 10px; color: var(--text-muted); max-width: 75px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btn-myroute {
      display: block;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #facc15, #eab308);
      color: #080b11;
      text-align: center;
      border-radius: 9px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .fab-btn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #facc15, #eab308);
      color: #080b11;
      border: 2px solid #fef08a;
      padding: 14px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 6px 24px rgba(250, 204, 21, 0.45);
      cursor: pointer;
      z-index: 99;
      text-transform: uppercase;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.88);
      z-index: 100;
      padding: 12px;
      overflow-y: auto;
    }
    .modal-box {
      background: #121927;
      border: 1px solid var(--yellow);
      border-radius: 16px;
      padding: 16px;
      max-width: 480px;
      margin: 10px auto 30px auto;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--yellow);
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .form-group { margin-bottom: 10px; position: relative; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    .form-group label { display: block; font-size: 10px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%;
      background: #080b11;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--yellow);
    }
    .suggest-list {
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: #1b263b;
      border: 1px solid var(--yellow);
      border-radius: 7px;
      z-index: 150;
      max-height: 160px;
      overflow-y: auto;
      display: none;
    }
    .suggest-item {
      padding: 9px 12px;
      font-size: 13px;
      color: #fff;
      border-bottom: 1px solid #24324d;
      cursor: pointer;
    }
    .suggest-item:active, .suggest-item:hover { background: var(--yellow); color: #080b11; font-weight: 700; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-save { flex: 1; background: var(--yellow); color: #080b11; border: none; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; text-transform: uppercase; }
    .btn-cancel { flex: 1; background: #263349; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; text-transform: uppercase; }
  </style>
</head>
<body>

  <header>
    <div class="header-bar">
      <button class="nav-btn" onclick="mostraHome()" title="Torna ai Viaggi">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5.5" cy="17.5" r="3.5"/>
          <circle cx="18.5" cy="17.5" r="3.5"/>
          <path d="M15 6h3l3 5v3h-2"/>
          <path d="M5.5 17.5L9 11h6l2 6.5"/>
          <path d="M9 11L7 7H4"/>
        </svg>
      </button>

      <div class="brand-logo">dj<span>ROUTE</span></div>

      <button class="nav-btn sync-btn" id="btnSync" onclick="sincronizzaVistaAttiva()" title="Sincronizza con Foglio">
        <svg id="syncIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 16h5v5"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="vistaHome">
    <div class="section-tag">
      <span>📁 Schede Viaggi Attive</span>
      <small>⬅️ Scorri a sinistra per eliminare</small>
    </div>
    <div class="trips-list" id="listaSchedeViaggi">
      <div style="text-align:center; padding:30px; color:var(--text-muted);">Sincronizzazione schede viaggio...</div>
    </div>
    <button class="btn-create-sheet" onclick="creaNuovoFoglioViaggio()">+ Crea Nuovo Foglio di Viaggio</button>
  </main>

  <main id="vistaViaggio">
    <div class="trip-banner">
      <div class="trip-banner-name" id="nomeViaggioAttivo">Viaggio</div>
      <div class="trip-banner-stats" id="riepilogoKmViaggio">0 tappe • 0 km</div>
    </div>

    <div id="contenitoreTappe"></div>
  </main>

  <button class="fab-btn" id="fabNuovaTappa" onclick="apriModaleNuovaTappa()">➕ Nuova Tappa</button>

  <div id="modalTappa" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">🏍️ Nuova Tappa</div>
      <input type="hidden" id="editRowId" value="">
      <input type="hidden" id="editKm" value="0">
      <input type="hidden" id="editOre" value="">
      <input type="hidden" id="editAltMax" value="0">
      <input type="hidden" id="editTempMedie" value="">

      <div class="form-row">
        <div class="form-group">
          <label>Data (GG/MM/AAAA)</label>
          <input type="text" id="inpData" placeholder="18/10/2026" maxlength="10">
        </div>
        <div class="form-group">
          <label>Ora Partenza</label>
          <input type="time" id="inpOra" value="08:30">
        </div>
      </div>

      <div class="form-group">
        <label>Città di Partenza</label>
        <input type="text" id="inpPartenza" placeholder="Digita città..." autocomplete="off">
        <div id="sugPartenza" class="suggest-list"></div>
      </div>

      <div class="form-group">
        <label>Passaggi / Valichi Intermedi (separati da virgola)</label>
        <input type="text" id="inpPassaggio" placeholder="es. Passo Tonale, Edolo" autocomplete="off">
        <div id="sugPassaggio" class="suggest-list"></div>
      </div>

      <div class="form-group">
        <label>Città di Arrivo</label>
        <input type="text" id="inpArrivo" placeholder="Digita città..." autocomplete="off">
        <div id="sugArrivo" class="suggest-list"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Nome Alloggio</label>
          <input type="text" id="inpAlloggio" placeholder="es. Hotel Mantova">
        </div>
        <div class="form-group">
          <label>Piattaforma Prenotazione</label>
          <select id="inpPiattaforma">
            <option value="">-- Seleziona --</option>
            <option value="Booking">Booking</option>
            <option value="Airbnb">Airbnb</option>
            <option value="Expedia">Expedia</option>
            <option value="Pren. Diretta">Pren. Diretta</option>
            <option value="Tenda / Libero">Tenda / Libero</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Prezzo Camera / Spesa (€)</label>
          <input type="number" id="inpSpesa" placeholder="0" oninput="ricalcolaPagamentiModale('spesa')">
        </div>
        <div class="form-group">
          <label>Stato Pagamento</label>
          <select id="inpPagamento" onchange="ricalcolaPagamentiModale('stato')">
            <option value="Da pagare">Da pagare</option>
            <option value="Acconto">Acconto</option>
            <option value="Pagato">Pagato</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Importo Pagato / Acconto (€)</label>
          <input type="number" id="inpPagato" placeholder="0" oninput="ricalcolaPagamentiModale('pagato')">
        </div>
        <div class="form-group">
          <label>Residuo Da Pagare (€)</label>
          <input type="number" id="inpDaPagare" placeholder="0" readonly style="background:#161f30; color:var(--yellow); font-weight:800;">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Metodo di Pagamento</label>
          <select id="inpMetodo">
            <option value="">-- Seleziona --</option>
            <option value="Revolut Daniel">Revolut Daniel</option>
            <option value="N26 Daniel">N26 Daniel</option>
            <option value="Carta Emanuela">Carta Emanuela</option>
            <option value="Paypal Emanuela">Paypal Emanuela</option>
            <option value="Bonifico">Bonifico</option>
            <option value="Contanti in struttura">Contanti in struttura</option>
          </select>
        </div>
        <div class="form-group">
          <label>Parcheggio Moto</label>
          <select id="inpParcheggio">
            <option value="">-- Seleziona --</option>
            <option value="Garage coperto">Garage coperto</option>
            <option value="Coperto in Struttura">Coperto in Struttura</option>
            <option value="Parcheggio custodito">Parcheggio custodito</option>
            <option value="Cortile privato">Cortile privato</option>
            <option value="Esterno struttura">Esterno struttura</option>
            <option value="Strada / Libero">Strada / Libero</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Link MyRoute-app / Traccia GPX</label>
        <input type="url" id="inpMyRoute" placeholder="https://www.myrouteapp.com/...">
      </div>

      <div class="form-group">
        <label>Note Tappa</label>
        <input type="text" id="inpNote" placeholder="es. Sosta pranzo, imbarco...">
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="chiudiModale()">Annulla</button>
        <button class="btn-save" id="btnSalvaTappa" onclick="salvaTappa()">💾 Salva Tappa</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSg_iYdW33G7M2RDvckqApsOKZC614zho4-qTsk0ow_Bx3EmrN_kVusQIPyr8qeEC-5w/exec";
    
    let schedeViaggi = [];
    let schedaAttiva = "";
    let tappeCorrenti = [];
    const GEO_CACHE = {};
    const ROUTE_CACHE = {};

    window.addEventListener("DOMContentLoaded", () => {
      mostraHome();
    });

    document.getElementById("inpData").addEventListener("input", (e) => {
      let v = e.target.value.replace(/\D/g, "");
      if (v.length > 2 && v.length <= 4) e.target.value = v.slice(0,2) + "/" + v.slice(2);
      else if (v.length > 4) e.target.value = v.slice(0,2) + "/" + v.slice(2,4) + "/" + v.slice(4,8);
    });

    function ricalcolaPagamentiModale(origine) {
      const spesa = parseFloat(document.getElementById("inpSpesa").value) || 0;
      const selStato = document.getElementById("inpPagamento");
      const inpPagato = document.getElementById("inpPagato");
      const inpDaPagare = document.getElementById("inpDaPagare");

      if (origine === "stato") {
        if (selStato.value === "Pagato") {
          inpPagato.value = spesa;
        } else if (selStato.value === "Da pagare") {
          inpPagato.value = 0;
        }
      } else if (origine === "pagato") {
        const p = parseFloat(inpPagato.value) || 0;
        if (p >= spesa && spesa > 0) selStato.value = "Pagato";
        else if (p > 0 && p < spesa) selStato.value = "Acconto";
        else selStato.value = "Da pagare";
      } else if (origine === "spesa") {
        if (selStato.value === "Pagato") inpPagato.value = spesa;
        else if (selStato.value === "Da pagare") inpPagato.value = 0;
      }

      const pagatoFinale = parseFloat(inpPagato.value) || 0;
      inpDaPagare.value = Math.max(0, Math.round((spesa - pagatoFinale) * 100) / 100);
    }

    function attivaAutocompleteMappa(inputId, boxId, multiplo = false) {
      const inp = document.getElementById(inputId);
      const box = document.getElementById(boxId);
      let timer = null;

      inp.addEventListener("input", () => {
        clearTimeout(timer);
        let raw = inp.value;
        let query = multiplo ? raw.split(",").pop().trim() : raw.trim();
        if (query.length < 3) { box.style.display = "none"; return; }

        timer = setTimeout(async () => {
          try {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&accept-language=it`;
            const res = await fetch(url);
            const list = await res.json();
            if (!list || list.length === 0) { box.style.display = "none"; return; }

            box.innerHTML = "";
            list.forEach(item => {
              const div = document.createElement("div");
              div.className = "suggest-item";
              const parti = item.display_name.split(",");
              div.innerText = "📍 " + parti.slice(0, 3).join(",");
              div.onclick = () => {
                const citta = parti[0].trim();
                if (multiplo && raw.includes(",")) {
                  const prec = raw.split(",").slice(0, -1).map(s => s.trim()).join(", ");
                  inp.value = prec + ", " + citta;
                } else {
                  inp.value = citta;
                }
                GEO_CACHE[citta.toLowerCase()] = { lat: parseFloat(item.lat), lon: parseFloat(item.lon), name: citta };
                box.style.display = "none";
              };
              box.appendChild(div);
            });
            box.style.display = "block";
          } catch (e) { box.style.display = "none"; }
        }, 260);
      });

      document.addEventListener("click", (e) => {
        if (!inp.contains(e.target) && !box.contains(e.target)) box.style.display = "none";
      });
    }

    attivaAutocompleteMappa("inpPartenza", "sugPartenza", false);
    attivaAutocompleteMappa("inpPassaggio", "sugPassaggio", true);
    attivaAutocompleteMappa("inpArrivo", "sugArrivo", false);

    async function mostraHome() {
      schedaAttiva = "";
      document.getElementById("vistaViaggio").style.display = "none";
      document.getElementById("fabNuovaTappa").style.display = "none";
      document.getElementById("vistaHome").style.display = "block";
      await scaricaSchedeViaggi();
    }

    async function sincronizzaVistaAttiva() {
      const icon = document.getElementById("syncIcon");
      icon.classList.add("spin");
      if (schedaAttiva) {
        await apriSchedaViaggio(schedaAttiva);
      } else {
        await scaricaSchedeViaggi();
      }
      setTimeout(() => icon.classList.remove("spin"), 500);
    }

    async function scaricaSchedeViaggi() {
      const cont = document.getElementById("listaSchedeViaggi");
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getSheets&_t=${Date.now()}`);
        const fogli = await res.json();
        if (Array.isArray(fogli)) {
          schedeViaggi = fogli;
          cont.innerHTML = "";
          fogli.forEach(nome => {
            const wrap = document.createElement("div");
            wrap.className = "swipe-wrapper";

            const delBg = document.createElement("div");
            delBg.className = "swipe-delete-bg";
            delBg.innerHTML = `🗑️<span>ELIMINA</span>`;
            delBg.onclick = (e) => {
              e.stopPropagation();
              confermaEliminazioneFoglio(nome);
            };

            const card = document.createElement("div");
            card.className = "trip-item";
            card.innerHTML = `
              <div class="trip-item-title">🏍️ ${nome}</div>
              <div class="trip-item-badge">Apri ➔</div>
            `;

            let startX = 0;
            let swiped = false;
            card.addEventListener("touchstart", (e) => {
              startX = e.touches[0].clientX;
            }, { passive: true });

            card.addEventListener("touchend", (e) => {
              const diffX = e.changedTouches[0].clientX - startX;
              if (diffX < -55) {
                document.querySelectorAll(".trip-item.swiped").forEach(el => el.classList.remove("swiped"));
                card.classList.add("swiped");
                swiped = true;
              } else if (diffX > 40 && swiped) {
                card.classList.remove("swiped");
                swiped = false;
              }
            });

            card.onclick = () => {
              if (card.classList.contains("swiped")) {
                card.classList.remove("swiped");
                return;
              }
              apriSchedaViaggio(nome);
            };

            wrap.appendChild(delBg);
            wrap.appendChild(card);
            cont.appendChild(wrap);
          });
        }
      } catch (e) {
        cont.innerHTML = `<div style="text-align:center; padding:25px; color:var(--red);">Connessione non riuscita. Tocca il tasto giallo Sync in alto.</div>`;
      }
    }

    async function confermaEliminazioneFoglio(nomeFoglio) {
      const ok = confirm(`Attenzione procedendo si cancellerà anche il File Excel ("${nomeFoglio}").\n\nVuoi procedere definitivamente?`);
      if (!ok) return;

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "deleteSheet", sheetName: nomeFoglio })
      });

      setTimeout(() => scaricaSchedeViaggi(), 1100);
    }

    async function creaNuovoFoglioViaggio() {
      const nome = prompt("Nome del nuovo viaggio (es. Kurdistan 2027):");
      if (!nome || !nome.trim()) return;
      const clean = nome.trim();

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "createSheet", newSheetName: clean })
      });

      setTimeout(() => scaricaSchedeViaggi(), 1200);
    }

    async function apriSchedaViaggio(nomeFoglio) {
      schedaAttiva = nomeFoglio;
      document.getElementById("vistaHome").style.display = "none";
      document.getElementById("vistaViaggio").style.display = "block";
      document.getElementById("fabNuovaTappa").style.display = "block";
      document.getElementById("nomeViaggioAttivo").innerText = "🏍️ " + nomeFoglio;

      const cont = document.getElementById("contenitoreTappe");
      cont.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">Lettura tappe "${nomeFoglio}"...</div>`;

      try {
        const res = await fetch(`${SCRIPT_URL}?sheetName=${encodeURIComponent(nomeFoglio)}&_t=${Date.now()}`);
        tappeCorrenti = await res.json();
        renderTappeViaggio(tappeCorrenti);
      } catch (e) {
        cont.innerHTML = `<div style="text-align:center; padding:30px; color:var(--red);">Errore lettura tappe.</div>`;
      }
    }

    function getTempColorClass(tempStr) {
      if (!tempStr) return "temp-mild";
      const nums = (tempStr.match(/-?\d+/g) || []).map(Number);
      if (nums.length === 0) return "temp-mild";
      if (Math.max(...nums) > 28) return "temp-hot";
      if (Math.min(...nums) < 15) return "temp-cold";
      return "temp-mild";
    }

    function generaSvgAltimetriaHD(elevationArray, depName, arrName, maxEle) {

      }
      const W = 340, H = 105;
      const tetto = Math.max(...elevationArray, 150);

        const x = (16 + idx * stepX).toFixed(1);
        const y = (H - 22 - ((Math.max(0, ele) / tetto) * (H - 44))).toFixed(1);
        return { x, y, ele: Math.round(ele) };
      });

      const linePoints = pts.map(p => `${p.x},${p.y}`).join(" ");

      let peakPt = pts[0];
      pts.forEach(p => { if (p.ele > peakPt.ele) peakPt = p; });

      return `
        <svg viewBox="0 0 ${W}${H}" style="width:100%; height:auto;">
          <defs>
            <linearGradient id="gradEle" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#facc15" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#facc15" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <polygon points="${polyPoints}" fill="url(#gradEle)" />
          <polyline points="${linePoints}" fill="none" stroke="#facc15" stroke-width="2.2" />
          <circle cx="${peakPt.x}" cy="${peakPt.y}" r="4" fill="#00e5ff" />
          <text x="${peakPt.x}" y="${Math.max(12, peakPt.y - 6)}" fill="#00e5ff" font-size="10" font-weight="800" text-anchor="middle">⛰️ Max ${maxEle}m</text>
          <text x="16" y="${H-5}" fill="#94a3b8" font-size="9
