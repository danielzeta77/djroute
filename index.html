<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>djRoute Planner & Meteo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #080b11;
      --card: #111723;
      --card-alt: #0c111a;
      --yellow: #facc15;
      --yellow-glow: rgba(250, 204, 21, 0.25);
      --cyan: #00e5ff;
      --green: #10b981;
      --orange: #f97316;
      --red: #f43f5e;
      --fuchsia: #d946ef;
      --border: #222f46;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Chakra Petch', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { background-color: var(--bg); color: var(--text); padding: 12px; padding-bottom: 105px; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

    header {
      background: linear-gradient(145deg, #151e2e, #0b1019);
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--yellow);
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 18px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.6);
    }
    .header-bar { display: flex; justify-content: space-between; align-items: center; }
    .nav-btn {
      width: 46px; height: 46px; border-radius: 12px; border: 1px solid #334155;
      background: #162032; color: var(--yellow); display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); transition: all 0.15s ease;
    }
    .nav-btn:active { transform: scale(0.92); border-color: var(--yellow); box-shadow: 0 0 12px var(--yellow-glow); }
    .nav-btn.sync-btn { background: linear-gradient(135deg, #facc15, #eab308); color: #080b11; border-color: #fef08a; box-shadow: 0 0 14px rgba(250, 204, 21, 0.35); }
    .spin { animation: rotazione 0.9s linear infinite; }
    @keyframes rotazione { 100% { transform: rotate(360deg); } }

    .brand-box { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
    .brand-logo { font-size: 25px; font-weight: 800; font-style: italic; letter-spacing: 1.5px; color: #fff; }
    .brand-logo span { color: var(--yellow); }
    .brand-sub { font-size: 10px; color: var(--fuchsia); font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; }

    #vistaHome { display: block; }
    .section-tag { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; margin-bottom: 16px; }
    .section-tag span { font-size: 14px; font-weight: 800; color: var(--yellow); text-transform: uppercase; letter-spacing: 1.2px; }
    .section-tag small { color: var(--text-muted); font-size: 11px; font-weight: 600; }

    .trips-list { display: flex; flex-direction: column; gap: 12px; }
    .swipe-wrapper { position: relative; border-radius: 14px; overflow: hidden; background: #991b1b; border: 1px solid var(--border); }
    .swipe-delete-bg { position: absolute; top: 0; bottom: 0; right: 0; width: 110px; background: linear-gradient(90deg, #dc2626, #e11d48); color: #fff; font-weight: 800; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; z-index: 1; }
    .trip-item { position: relative; z-index: 2; background: var(--card); padding: 18px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: transform 0.22s ease; }
    .trip-item.swiped { transform: translateX(-105px); }
    .trip-item-title { font-size: 18px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }
    .trip-item-badge { font-size: 12px; font-weight: 800; color: #080b11; background: var(--yellow); padding: 5px 12px; border-radius: 20px; text-transform: uppercase; }

    .btn-create-sheet { width: 100%; margin-top: 18px; padding: 16px; background: rgba(250, 204, 21, 0.08); border: 1.5px dashed var(--yellow); border-radius: 14px; color: var(--yellow); font-size: 15px; font-weight: 800; letter-spacing: 0.8px; cursor: pointer; text-transform: uppercase; }

    #vistaViaggio { display: none; }
    .trip-banner { background: linear-gradient(90deg, #131c2e, #0e1522); border: 1px solid var(--border); border-left: 4px solid var(--yellow); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .trip-banner-name { font-size: 17px; font-weight: 800; color: var(--yellow); text-transform: uppercase; }
    .trip-banner-stats { font-size: 13px; font-weight: 700; color: var(--cyan); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.45); overflow: hidden; }
    .card-head { background: #0d131f; padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
    .card-title-box { display: flex; align-items: center; gap: 6px; }
    .card-title { font-size: 15px; font-weight: 800; color: var(--yellow); }
    .card-date { font-size: 12px; font-weight: 700; background: #1e293b; padding: 3px 9px; border-radius: 6px; border: 1px solid #334155; color: #fff; }
    .card-actions { display: flex; gap: 6px; }
    .btn-card { border: none; padding: 6px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-edit { background: #1e293b; color: var(--yellow); border: 1px solid var(--yellow); }
    .btn-del { background: rgba(244,63,94,0.18); color: #fda4af; border: 1px solid #f43f5e; }

    .card-body { padding: 14px; }
    .route-box { border-left: 2px solid var(--yellow); margin-left: 8px; padding-left: 16px; margin-bottom: 14px; }
    .route-point { position: relative; margin-bottom: 10px; }
    .route-point:last-child { margin-bottom: 0; }
    .route-point::before { content: ''; position: absolute; left: -22px; top: 5px; width: 10px; height: 10px; border-radius: 50%; }
    .route-point.dep::before { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .route-point.via::before { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
    .route-point.arr::before { background: var(--red); box-shadow: 0 0 8px var(--red); }
    .point-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .point-city { font-size: 17px; font-weight: 800; color: #fff; }

    .road-telemetry { display: grid; grid-template-columns: 1fr 1fr 1fr 1.25fr; gap: 6px; margin-bottom: 10px; background: var(--card-alt); border: 1px solid var(--border); border-radius: 12px; padding: 9px 6px; }
    .tele-item { text-align: center; display: flex; flex-direction: column; justify-content: center; }
    .tele-item:not(:last-child) { border-right: 1px solid #1e2a3f; }
    .tele-label { font-size: 9px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
    .tele-val { font-size: 15px; font-weight: 800; color: var(--yellow); }

    .btn-elevation { width: 100%; background: #151f32; border: 1px solid #2d3f5e; color: var(--yellow); padding: 9px; border-radius: 9px; font-size: 12px; font-weight: 800; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; text-transform: uppercase; }
    .ele-box { display: none; background: #090d15; border: 1px solid var(--border); border-radius: 10px; padding: 12px 10px; margin-bottom: 12px; }

    .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--card-alt); border: 1px solid var(--border); border-radius: 10px; padding: 11px; margin-bottom: 12px; font-size: 12px; }
    .grid-info div span { display: block; font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .grid-info div strong { color: #fff; font-size: 14px; font-weight: 700; }

    .weather-box { background: var(--card-alt); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 12px; }
    .weather-head { font-size: 11px; font-weight: 800; color: var(--yellow); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; }
    .weather-badge-status { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 5px; letter-spacing: 0.5px; }
    .status-obsoleto { background: rgba(244, 63, 94, 0.15); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.4); }
    .status-future { background: rgba(250, 204, 21, 0.15); color: #fef08a; border: 1px solid rgba(250, 204, 21, 0.4); }
    .status-live { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }

    .weather-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .weather-cell { flex: 0 0 auto; background: #131c2c; border: 1px solid #24344d; border-radius: 8px; padding: 7px 10px; text-align: center; min-width: 86px; }
    .w-time { font-size: 11px; color: var(--yellow); font-weight: 800; }
    .w-km { font-size: 9px; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
    .w-icon { font-size: 18px; margin: 2px 0; }
    .w-temp { font-size: 14px; font-weight: 800; }
    .w-rain { font-size: 10px; color: var(--cyan); font-weight: 700; }
    .w-name { font-size: 10px; color: #cbd5e1; max-width: 78px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }

    .btn-myroute { display: block; width: 100%; padding: 12px; background: linear-gradient(135deg, #facc15, #eab308); color: #080b11; text-align: center; border-radius: 9px; text-decoration: none; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }

    .fab-btn { display: none; position: fixed; bottom: 20px; right: 20px; background: linear-gradient(135deg, #facc15, #eab308); color: #080b11; border: 2px solid #fef08a; padding: 14px 22px; border-radius: 30px; font-size: 14px; font-weight: 800; box-shadow: 0 6px 24px rgba(250, 204, 21, 0.45); cursor: pointer; z-index: 99; text-transform: uppercase; }

    /* LAYOUT MODALE OTTIMIZZATO PER SMARTPHONE */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.88); z-index: 100; padding: 12px; overflow-y: auto; }
    .modal-box { background: #121927; border: 1px solid var(--yellow); border-radius: 16px; padding: 16px; max-width: 480px; margin: 10px auto 30px auto; }
    .modal-title { font-size: 18px; font-weight: 800; color: var(--yellow); margin-bottom: 16px; text-transform: uppercase; }
    
    .form-group { margin-bottom: 14px; position: relative; }
    .form-group label { display: block; font-size: 10px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    
    /* CAMPI PERFETTAMENTE IN LINEA */
    .form-group input { width: 100%; min-width: 0; box-sizing: border-box; background: #080b11; border: 1px solid var(--border); border-radius: 7px; padding: 10px; color: #fff; font-size: 14px; font-weight: 600; }
    .form-group input:focus { outline: none; border-color: var(--yellow); }

    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    /* GRIGLIA PULSANTI */
    .btn-select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .opt-btn { background: #162032; border: 1px solid #2d3f5e; color: #cbd5e1; padding: 10px 4px; border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.15s ease; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* COLORI BOTTONI PIATTAFORME */
    .opt-btn[data-val="Booking"].active { background: #003b95 !important; color: #fff !important; border-color: #0056d2 !important; box-shadow: 0 0 12px rgba(0,59,149,0.5) !important; }
    .opt-btn[data-val="Airbnb"].active { background: #10b981 !important; color: #fff !important; border-color: #34d399 !important; box-shadow: 0 0 12px rgba(16,185,129,0.5) !important; }
    .opt-btn[data-val="Expedia"].active { background: #facc15 !important; color: #080b11 !important; border-color: #fef08a !important; box-shadow: 0 0 12px rgba(250,204,21,0.5) !important; }
    
    .opt-btn.active { background: var(--yellow); color: #080b11; border-color: #fef08a; box-shadow: 0 0 10px var(--yellow-glow); }

    .suggest-list { position: absolute; top: 100%; left: 0; right: 0; background: #1b263b; border: 1px solid var(--yellow); border-radius: 7px; z-index: 150; max-height: 160px; overflow-y: auto; display: none; }
    .suggest-item { padding: 9px 12px; font-size: 13px; color: #fff; border-bottom: 1px solid #24324d; cursor: pointer; }
    .suggest-item:active, .suggest-item:hover { background: var(--yellow); color: #080b11; font-weight: 700; }
    
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn-save { flex: 1; background: var(--yellow); color: #080b11; border: none; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; text-transform: uppercase; }
    .btn-cancel { flex: 1; background: #263349; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; text-transform: uppercase; }
  </style>
</head>
<body>

  <header>
    <div class="header-bar">
      <button class="nav-btn" onclick="mostraHome()" title="Torna ai Viaggi">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5.5" cy="17.5" r="3.5" stroke="#00e5ff"/>
          <circle cx="18.5" cy="17.5" r="3.5" stroke="#facc15"/>
          <path d="M15 6h3l3 5v3h-2" stroke="#fff"/>
          <path d="M5.5 17.5L9 11h6l2 6.5" stroke="#fff"/>
          <path d="M9 11L7 7H4" stroke="#d946ef"/>
        </svg>
      </button>

      <div class="brand-box">
        <div class="brand-logo">dj<span>Route</span></div>
        <div class="brand-sub">planner & Meteo</div>
      </div>

      <button class="nav-btn sync-btn" id="btnSync" onclick="sincronizzaVistaAttiva()" title="Sincronizza con Foglio">
        <svg id="syncIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 16h5v5"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="vistaHome">
    <div class="section-tag">
      <span>📁 Schede Viaggi Attive</span>
      <small>⬅️ Scorri a sinistra sulla scheda per eliminare</small>
    </div>
    <div class="trips-list" id="listaSchedeViaggi">
      <div style="text-align:center; padding:30px; color:var(--text-muted);">Sincronizzazione schede viaggio...</div>
    </div>
    <button class="btn-create-sheet" onclick="creaNuovoFoglioViaggio()">+ Crea Nuovo Foglio Viaggio</button>
  </main>

  <main id="vistaViaggio">
    <div class="trip-banner">
      <div class="trip-banner-name" id="nomeViaggioAttivo">Viaggio</div>
      <div class="trip-banner-stats" id="riepilogoKmViaggio">0 tappe • 0 km</div>
    </div>
    <div id="contenitoreTappe"></div>
  </main>

  <button class="fab-btn" id="fabNuovaTappa" onclick="apriModaleNuovaTappa()">➕ Nuova Tappa</button>

  <div id="modalTappa" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">🏍️ Nuova Tappa</div>
      <input type="hidden" id="editRowId" value="">
      <input type="hidden" id="editKm" value="0">
      <input type="hidden" id="editOre" value="">
      <input type="hidden" id="editAltMax" value="0">
      <input type="hidden" id="editTempMedie" value="">

      <input type="hidden" id="valPiattaforma" value="Booking">
      <input type="hidden" id="valPagamento" value="Da pagare">
      <input type="hidden" id="valMetodo" value="Revolut Daniel">
      <input type="hidden" id="valParcheggio" value="Garage">

      <div class="form-row-2">
        <div class="form-group">
          <label>Data (GG/MM/AAAA)</label>
          <input type="text" id="inpData" placeholder="18/10/2026" maxlength="10">
        </div>
        <div class="form-group">
          <label>Ora Partenza</label>
          <input type="time" id="inpOra" value="08:30">
        </div>
      </div>

      <div class="form-group">
        <label>Città di Partenza</label>
        <input type="text" id="inpPartenza" placeholder="Digita città..." autocomplete="off">
        <div id="sugPartenza" class="suggest-list"></div>
      </div>

      <div class="form-group">
        <label>Passaggi / Valichi</label>
        <input type="text" id="inpPassaggio" placeholder="es. Passo Tonale, Edolo" autocomplete="off">
        <div id="sugPassaggio" class="suggest-list"></div>
      </div>

      <div class="form-group">
        <label>Città di Arrivo</label>
        <input type="text" id="inpArrivo" placeholder="Digita città..." autocomplete="off">
        <div id="sugArrivo" class="suggest-list"></div>
      </div>

      <div class="form-group">
        <label>Nome Alloggio</label>
        <input type="text" id="inpAlloggio" placeholder="es. Hotel Mantova">
      </div>

      <div class="form-group">
        <label>Piattaforma Prenotazione</label>
        <div class="btn-select-grid" id="gridPiattaforma">
          <button type="button" class="opt-btn active" data-val="Booking" onclick="selezionaPulsante('gridPiattaforma', 'valPiattaforma', 'Booking')">Booking</button>
          <button type="button" class="opt-btn" data-val="Airbnb" onclick="selezionaPulsante('gridPiattaforma', 'valPiattaforma', 'Airbnb')">Airbnb</button>
          <button type="button" class="opt-btn" data-val="Expedia" onclick="selezionaPulsante('gridPiattaforma', 'valPiattaforma', 'Expedia')">Expedia</button>
          <button type="button" class="opt-btn" data-val="Pren. Diretta" onclick="selezionaPulsante('gridPiattaforma', 'valPiattaforma', 'Pren. Diretta')">Pren. Diretta</button>
          <button type="button" class="opt-btn" data-val="Altro" style="grid-column: span 2;" onclick="selezionaPulsante('gridPiattaforma', 'valPiattaforma', 'Altro')">Altro</button>
        </div>
      </div>

      <div class="form-group">
        <label>Stato Pagamento</label>
        <div class="btn-select-grid" id="gridPagamento" style="grid-template-columns: 1fr 1fr 1fr;">
          <button type="button" class="opt-btn active" data-val="Da pagare" onclick="selezionaStatoPagamento('Da pagare')">Da pagare</button>
          <button type="button" class="opt-btn" data-val="Acconto" onclick="selezionaStatoPagamento('Acconto')">Acconto</button>
          <button type="button" class="opt-btn" data-val="Pagato" onclick="selezionaStatoPagamento('Pagato')">Pagato</button>
        </div>
      </div>

      <div class="form-row-3">
        <div class="form-group">
          <label>Spesa (€)</label>
          <input type="number" id="inpSpesa" placeholder="0" oninput="ricalcolaPagamentiDaInput('spesa')">
        </div>
        <div class="form-group">
          <label>Pagato (€)</label>
          <input type="number" id="inpPagato" placeholder="0" oninput="ricalcolaPagamentiDaInput('pagato')">
        </div>
        <div class="form-group">
          <label>Residuo (€)</label>
          <input type="number" id="inpDaPagare" placeholder="0" readonly style="background:#161f30; color:var(--yellow); font-weight:800;">
        </div>
      </div>

      <div class="form-group">
        <label>Metodo di Pagamento</label>
        <div class="btn-select-grid" id="gridMetodo">
          <button type="button" class="opt-btn active" data-val="Revolut Daniel" onclick="selezionaPulsante('gridMetodo', 'valMetodo', 'Revolut Daniel')">Revolut Daniel</button>
          <button type="button" class="opt-btn" data-val="N26 Daniel" onclick="selezionaPulsante('gridMetodo', 'valMetodo', 'N26 Daniel')">N26 Daniel</button>
          <button type="button" class="opt-btn" data-val="Carta Emanuela" onclick="selezionaPulsante('gridMetodo', 'valMetodo', 'Carta Emanuela')">Carta Emanuela</button>
          <button type="button" class="opt-btn" data-val="Paypal Emanuela" onclick="selezionaPulsante('gridMetodo', 'valMetodo', 'Paypal Emanuela')">Paypal Emanuela</button>
          <button type="button" class="opt-btn" data-val="Paypal Daniel" onclick="selezionaPulsante('gridMetodo', 'valMetodo', 'Paypal Daniel')">Paypal Daniel</button>
          <button type="button" class="opt-btn" data-val="Bonifico" onclick="selezionaPulsante('gridMetodo', 'valMetodo', 'Bonifico')">Bonifico</button>
          <button type="button" class="opt-btn" data-val="Cash in Struttura" style="grid-column: span 2;" onclick="selezionaPulsante('gridMetodo', 'valMetodo', 'Cash in Struttura')">Cash in Struttura</button>
        </div>
      </div>

      <div class="form-group">
        <label>Parcheggio Moto</label>
        <div class="btn-select-grid" id="gridParcheggio">
          <button type="button" class="opt-btn active" data-val="Garage" onclick="selezionaPulsante('gridParcheggio', 'valParcheggio', 'Garage')">Garage</button>
          <button type="button" class="opt-btn" data-val="Coperto in Struttura" onclick="selezionaPulsante('gridParcheggio', 'valParcheggio', 'Coperto in Struttura')">Coperto Strutt.</button>
          <button type="button" class="opt-btn" data-val="Parcheggio custodito" onclick="selezionaPulsante('gridParcheggio', 'valParcheggio', 'Parcheggio custodito')">Custodito</button>
          <button type="button" class="opt-btn" data-val="Cortile privato" onclick="selezionaPulsante('gridParcheggio', 'valParcheggio', 'Cortile privato')">Cortile</button>
          <button type="button" class="opt-btn" data-val="Esterno struttura" onclick="selezionaPulsante('gridParcheggio', 'valParcheggio', 'Esterno struttura')">Esterno</button>
          <button type="button" class="opt-btn" data-val="In attesa di conferma" onclick="selezionaPulsante('gridParcheggio', 'valParcheggio', 'In attesa di conferma')">In attesa</button>
        </div>
      </div>

      <div class="form-group">
        <label>Link MyRoute-app / Traccia GPX</label>
        <input type="url" id="inpMyRoute" placeholder="https://www.myrouteapp.com/...">
      </div>

      <div class="form-group">
        <label>Note Tappa</label>
        <input type="text" id="inpNote" placeholder="es. Sosta pranzo, imbarco...">
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="chiudiModale()">Annulla</button>
        <button class="btn-save" id="btnSalvaTappa" onclick="salvaTappa()">💾 Salva Tappa</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSg_iYdW33G7M2RDvckqApsOKZC614zho4-qTsk0ow_Bx3EmrN_kVusQIPyr8qeEC-5w/exec";
    
    let schedeViaggi = [];
    let schedaAttiva = "";
    let tappeCorrenti = [];
    const GEO_CACHE = {};
    const ROUTE_CACHE = {};

    window.addEventListener("DOMContentLoaded", () => {
      mostraHome();
    });

    function selezionaPulsante(containerId, hiddenInputId, valore) {
      document.getElementById(hiddenInputId).value = valore;
      const btns = document.getElementById(containerId).querySelectorAll('.opt-btn');
      btns.forEach(btn => {
        if (btn.getAttribute('data-val') === valore) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function selezionaStatoPagamento(stato) {
      selezionaPulsante('gridPagamento', 'valPagamento', stato);
      const spesa = parseFloat(document.getElementById("inpSpesa").value) || 0;
      const inpPagato = document.getElementById("inpPagato");
      const inpDaPagare = document.getElementById("inpDaPagare");

      if (stato === "Pagato") {
        inpPagato.value = spesa;
        inpDaPagare.value = 0;
      } else if (stato === "Da pagare") {
        inpPagato.value = 0;
        inpDaPagare.value = spesa;
      } else {
        const p = parseFloat(inpPagato.value) || 0;
        inpDaPagare.value = Math.max(0, Math.round((spesa - p) * 100) / 100);
      }
    }

    function ricalcolaPagamentiDaInput(origine) {
      const spesa = parseFloat(document.getElementById("inpSpesa").value) || 0;
      const inpPagato = document.getElementById("inpPagato");
      const inpDaPagare = document.getElementById("inpDaPagare");
      let p = parseFloat(inpPagato.value) || 0;

      if (origine === 'spesa') {
        const stato = document.getElementById("valPagamento").value;
        if (stato === "Pagato") {
          inpPagato.value = spesa;
          p = spesa;
        }
      } else if (origine === 'pagato') {
        if (p >= spesa && spesa > 0) selezionaStatoPagamento('Pagato');
        else if (p > 0 && p < spesa) selezionaStatoPagamento('Acconto');
        else selezionaStatoPagamento('Da pagare');
      }

      inpDaPagare.value = Math.max(0, Math.round((spesa - p) * 100) / 100);
    }

    document.getElementById("inpData").addEventListener("input", (e) => {
      let v = e.target.value.replace(/\D/g, "");
      if (v.length > 2 && v.length <= 4) e.target.value = v.slice(0,2) + "/" + v.slice(2);
      else if (v.length > 4) e.target.value = v.slice(0,2) + "/" + v.slice(2,4) + "/" + v.slice(4,8);
    });

    function attivaAutocompleteMappa(inputId, boxId, multiplo = false) {
      const inp = document.getElementById(inputId);
      const box = document.getElementById(boxId);
      let timer = null;

      inp.addEventListener("input", () => {
        clearTimeout(timer);
        let raw = inp.value;
        let query = multiplo ? raw.split(",").pop().trim() : raw.trim();
        if (query.length < 3) { box.style.display = "none"; return; }

        timer = setTimeout(async () => {
          try {
            const res = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&accept-language=it,en,fr,de,es,tr,el,ka,hr,bg,sr,ro,ru`, 3500);
            const list = await res.json();
            if (!list || list.length === 0) { box.style.display = "none"; return; }

            box.innerHTML = "";
            list.forEach(item => {
              const div = document.createElement("div");
              div.className = "suggest-item";
              const parti = item.display_name.split(",");
              div.innerText = "📍 " + parti.slice(0, 3).join(",");
              div.onclick = () => {
                const citta = parti[0].trim();
                if (multiplo && raw.includes(",")) {
                  const prec = raw.split(",").slice(0, -1).map(s => s.trim()).join(", ");
                  inp.value = prec + ", " + citta;
                } else {
                  inp.value = citta;
                }
                GEO_CACHE[citta.toLowerCase()] = { lat: parseFloat(item.lat), lon: parseFloat(item.lon), name: citta };
                box.style.display = "none";
              };
              box.appendChild(div);
            });
            box.style.display = "block";
          } catch (e) { box.style.display = "none"; }
        }, 260);
      });

      document.addEventListener("click", (e) => {
        if (!inp.contains(e.target) && !box.contains(e.target)) box.style.display = "none";
      });
    }

    attivaAutocompleteMappa("inpPartenza", "sugPartenza", false);
    attivaAutocompleteMappa("inpPassaggio", "sugPassaggio", true);
    attivaAutocompleteMappa("inpArrivo", "sugArrivo", false);

    async function fetchWithTimeout(resource, timeout = 4500) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(resource, { signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (error) {
        clearTimeout(id);
        throw error;
      }
    }

    function analizzaFinestraMeteo(dataStr) {
      if (!dataStr) return { stato: "invalid", diffDays: 999 };
      let d = null, m = null, y = null;
      const str = String(dataStr).trim();

      const matchSlash = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (matchSlash) {
        d = parseInt(matchSlash[1]);
        m = parseInt(matchSlash[2]) - 1;
        y = parseInt(matchSlash[3]);
      } else {
        const matchIso = str.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (matchIso) {
          y = parseInt(matchIso[1]);
          m = parseInt(matchIso[2]) - 1;
          d = parseInt(matchIso[3]);
        }
      }

      if (d === null || m === null || y === null) return { stato: "invalid", diffDays: 999 };

      const target = new Date(y, m, d, 23, 59, 59);
      const oggi = new Date();
      oggi.setHours(0, 0, 0, 0);

      const diffMs = target.getTime() - oggi.getTime();
      const diffGiorni = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const isoDate = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

      if (diffGiorni < 0) {
        return { stato: "obsoleto", diffDays: diffGiorni, isoDate, d, m: m + 1 };
      } else if (diffGiorni > 10) {
        return { stato: "futuro", diffDays: diffGiorni, isoDate, d, m: m + 1 };
      } else {
        return { stato: "disponibile", diffDays: diffGiorni, isoDate, d, m: m + 1 };
      }
    }

    function getLiveTempColor(valTemp) {
      if (valTemp === null || valTemp === undefined || valTemp === "--") return "color:#94a3b8;";
      const t = parseFloat(valTemp);
      if (isNaN(t)) return "color:#94a3b8;";

      if (t <= 8)  return "color:#38bdf8; text-shadow:0 0 8px rgba(56,189,248,0.4);";
      if (t <= 16) return "color:#2dd4bf;";
      if (t <= 25) return "color:#10b981;";
      if (t <= 32) return "color:#f59e0b;";
      return "color:#f43f5e; text-shadow:0 0 8px rgba(244,63,94,0.45);";
    }

    function getTempColorClass(tempStr) {
      if (!tempStr || tempStr.includes("--")) return "temp-mild";
      const nums = (tempStr.match(/-?\d+/g) || []).map(Number);
      if (nums.length === 0) return "temp-mild";
      const tMax = Math.max(...nums);
      const tMin = Math.min(...nums);
      if (tMax >= 28) return "temp-hot";
      if (tMin <= 14) return "temp-cold";
      return "temp-mild";
    }

    async function mostraHome() {
      schedaAttiva = "";
      document.getElementById("vistaViaggio").style.display = "none";
      document.getElementById("fabNuovaTappa").style.display = "none";
      document.getElementById("vistaHome").style.display = "block";
      await scaricaSchedeViaggi();
    }

    async function sincronizzaVistaAttiva() {
      const icon = document.getElementById("syncIcon");
      icon.classList.add("spin");
      if (schedaAttiva) {
        await apriSchedaViaggio(schedaAttiva);
      } else {
        await scaricaSchedeViaggi();
      }
      setTimeout(() => icon.classList.remove("spin"), 500);
    }

    async function scaricaSchedeViaggi() {
      const cont = document.getElementById("listaSchedeViaggi");
      try {
        const res = await fetchWithTimeout(`${SCRIPT_URL}?action=getSheets&_t=${Date.now()}`, 6000);
        const fogli = await res.json();
        if (Array.isArray(fogli)) {
          schedeViaggi = fogli;
          cont.innerHTML = "";
          fogli.forEach(nome => {
            const wrap = document.createElement("div");
            wrap.className = "swipe-wrapper";

            const delBg = document.createElement("div");
            delBg.className = "swipe-delete-bg";
            delBg.innerHTML = `🗑️<span>ELIMINA</span>`;
            delBg.onclick = (e) => {
              e.stopPropagation();
              confermaEliminazioneFoglio(nome);
            };

            const card = document.createElement("div");
            card.className = "trip-item";
            card.innerHTML = `
              <div class="trip-item-title">🏍️ ${nome}</div>
              <div class="trip-item-badge">Apri ➔</div>
            `;

            let startX = 0;
            let swiped = false;
            card.addEventListener("touchstart", (e) => {
              startX = e.touches[0].clientX;
            }, { passive: true });

            card.addEventListener("touchend", (e) => {
              const diffX = e.changedTouches[0].clientX - startX;
              if (diffX < -55) {
                document.querySelectorAll(".trip-item.swiped").forEach(el => el.classList.remove("swiped"));
                card.classList.add("swiped");
                swiped = true;
              } else if (diffX > 40 && swiped) {
                card.classList.remove("swiped");
                swiped = false;
              }
            });

            card.onclick = () => {
              if (card.classList.contains("swiped")) {
                card.classList.remove("swiped");
                return;
              }
              apriSchedaViaggio(nome);
            };

            wrap.appendChild(delBg);
            wrap.appendChild(card);
            cont.appendChild(wrap);
          });
        }
      } catch (e) {
        cont.innerHTML = `<div style="text-align:center; padding:25px; color:var(--red);">Connessione con Google Drive fallita. Tocca 🔄 in alto per riprovare.</div>`;
      }
    }

    async function confermaEliminazioneFoglio(nomeFoglio) {
      const ok = confirm(`Attenzione procedendo si cancellerà anche il File Excel ("${nomeFoglio}").\n\nVuoi procedere definitivamente?`);
      if (!ok) return;

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "deleteSheet", sheetName: nomeFoglio })
      });

      setTimeout(() => scaricaSchedeViaggi(), 1100);
    }

    async function creaNuovoFoglioViaggio() {
      const nome = prompt("Nome del nuovo viaggio (es. Kurdistan 2027):");
      if (!nome || !nome.trim()) return;
      const clean = nome.trim();

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "createSheet", newSheetName: clean })
      });

      setTimeout(() => scaricaSchedeViaggi(), 1200);
    }

    async function apriSchedaViaggio(nomeFoglio) {
      schedaAttiva = nomeFoglio;
      document.getElementById("vistaHome").style.display = "none";
      document.getElementById("vistaViaggio").style.display = "block";
      document.getElementById("fabNuovaTappa").style.display = "block";
      document.getElementById("nomeViaggioAttivo").innerText = "🏍️ " + nomeFoglio;

      const cont = document.getElementById("contenitoreTappe");
      cont.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">Lettura tappe "${nomeFoglio}"...</div>`;

      try {
        const res = await fetchWithTimeout(`${SCRIPT_URL}?sheetName=${encodeURIComponent(nomeFoglio)}&_t=${Date.now()}`, 6000);
        tappeCorrenti = await res.json();
        renderTappeViaggio(tappeCorrenti);
      } catch (e) {
        cont.innerHTML = `<div style="text-align:center; padding:30px; color:var(--red);">Errore lettura tappe o timeout connessione.</div>`;
      }
    }

    function toggleProfiloAltimetrico(idx) {
      const box = document.getElementById(`ele-box-${idx}`);
      if (box) box.style.display = (box.style.display === "block") ? "none" : "block";
    }

    function generaSvgAltimetriaHD(elevationArray, depName, arrName, maxEle) {
      if (!elevationArray || elevationArray.length < 2) {
        return `<div style="font-size:11px; color:var(--text-muted); text-align:center;">Dati altimetrici non disponibili</div>`;
      }
      const W = 340, H = 105;
      const tetto = Math.max(...elevationArray, 150);
      const stepX = (W - 32) / (elevationArray.length - 1);

      const pts = elevationArray.map((ele, idx) => {
        const x = (16 + idx * stepX).toFixed(1);
        const y = (H - 22 - ((Math.max(0, ele) / tetto) * (H - 44))).toFixed(1);
        return { x, y, ele: Math.round(ele) };
      });

      const polyPoints = `${pts[0].x},${H-20} ` + pts.map(p => `${p.x},${p.y}`).join(" ") + ` ${pts[pts.length-1].x},${H-20}`;
      const linePoints = pts.map(p => `${p.x},${p.y}`).join(" ");

      let peakPt = pts[0];
      pts.forEach(p => { if (p.ele > peakPt.ele) peakPt = p; });

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">
          <defs>
            <linearGradient id="gradEle" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#facc15" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#facc15" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <polygon points="${polyPoints}" fill="url(#gradEle)" />
          <polyline points="${linePoints}" fill="none" stroke="#facc15" stroke-width="2.2" />
          <circle cx="${peakPt.x}" cy="${peakPt.y}" r="4" fill="#00e5ff" />
          <text x="${peakPt.x}" y="${Math.max(12, peakPt.y - 6)}" fill="#00e5ff" font-size="10" font-weight="800" text-anchor="middle">⛰️ Max ${maxEle}m</text>
          <text x="16" y="${H-5}" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="start">${depName.slice(0,12)} (${pts[0].ele}m)</text>
          <text x="${W-16}" y="${H-5}" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="end">${arrName.slice(0,12)} (${pts[pts.length-1].ele}m)</text>
        </svg>
      `;
    }

    async function renderTappeViaggio(tappe) {
      const cont = document.getElementById("contenitoreTappe");
      const statsHeader = document.getElementById("riepilogoKmViaggio");
      cont.innerHTML = "";

      if (!tappe || tappe.length === 0) {
        statsHeader.innerText = "0 tappe • 0 km";
        cont.innerHTML = `<div style="text-align:center; padding:45px 20px; color:var(--text-muted);">Nessuna tappa presente.<br>Tocca <strong>➕ NUOVA TAPPA</strong> in basso a destra.</div>`;
        return;
      }

      let sommaKm = 0;

      for (let i = 0; i < tappe.length; i++) {
        const t = tappe[i];
        sommaKm += (parseFloat(t.km) || 0);

        const card = document.createElement("article");
        card.className = "card";

        const gmaps = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(t.partenza)}&destination=${encodeURIComponent(t.arrivo)}${t.passaggio ? '&waypoints=' + encodeURIComponent(t.passaggio) : ''}`;
        const btnRouteHtml = (t.myRouteUrl && t.myRouteUrl.startsWith("http"))
          ? `<a href="${t.myRouteUrl}" target="_blank" class="btn-myroute">🚀 Apri in MyRoute-App</a>`
          : `<a href="${gmaps}" target="_blank" class="btn-myroute">🗺️ Apri Percorso in Mappa</a>`;

        const tempEsistente = t.tempMedie && t.tempMedie.trim() ? t.tempMedie.trim() : "--° / --°";
        const tClass = getTempColorClass(tempEsistente);
        const bH = t.ora ? parseInt(t.ora.split(":")[0]) || 8 : 8;
        const bM = t.ora ? parseInt(t.ora.split(":")[1]) || 30 : 30;

        card.innerHTML = `
          <div class="card-head">
            <div class="card-title-box">
              <span class="card-title">TAPPA #${i + 1}</span>
              <span class="card-date">${t.data || 'DATA N/D'}</span>
            </div>
            <div class="card-actions">
              <button class="btn-card btn-edit" onclick="apriModaleModifica(${i})">✏️ Modifica</button>
              <button class="btn-card btn-del" onclick="eliminaTappa(${t.id})">🗑️</button>
            </div>
          </div>

          <div class="card-body">
            <div class="route-box">
              <div class="route-point dep">
                <div class="point-label">Partenza • Ore ${t.ora || '08:30'}</div>
                <div class="point-city">${t.partenza || 'N/D'}</div>
              </div>
              ${t.passaggio ? `
              <div class="route-point via">
                <div class="point-label">Passaggi / Valichi</div>
                <div class="point-city" style="font-size:14px; color:var(--yellow);">${t.passaggio}</div>
              </div>` : ''}
              <div class="route-point arr">
                <div class="point-label">Arrivo</div>
                <div class="point-city">${t.arrivo || 'N/D'}</div>
              </div>
            </div>

            <div class="road-telemetry">
              <div class="tele-item">
                <div class="tele-label">Distanza</div>
                <div class="tele-val" id="km-val-${i}">${t.km ? Math.round(t.km) + ' km' : '-- km'}</div>
              </div>
              <div class="tele-item">
                <div class="tele-label">Ore Guida</div>
                <div class="tele-val" id="time-val-${i}">${t.oreGuida || '--:--'}</div>
              </div>
              <div class="tele-item">
                <div class="tele-label">Alt. Max</div>
                <div class="tele-val" id="ele-val-${i}">${t.altMax ? Math.round(t.altMax) + ' m' : '-- m'}</div>
              </div>
              <div class="tele-item">
                <div class="tele-label">Temp Medie</div>
                <div class="tele-val ${tClass}" id="temp-val-${i}">${tempEsistente}</div>
              </div>
            </div>

            <button class="btn-elevation" onclick="toggleProfiloAltimetrico(${i})">
              ⛰️ Mostra Curva Altimetrica Tappa ▾
            </button>
            <div class="ele-box" id="ele-box-${i}">
              <div style="font-size:11px; color:var(--text-muted); text-align:center;">Elaborazione altimetria stradale...</div>
            </div>

            <div class="grid-info">
              <div><span>Alloggio</span><strong>${t.alloggio || 'Non spec.'} ${t.piattaforma ? '('+t.piattaforma+')' : ''}</strong></div>
              <div><span>Parcheggio Moto</span><strong>${t.parcheggio || 'Non spec.'}</strong></div>
              <div><span>Prezzo Camera</span><strong>${t.spesa ? t.spesa + ' €' : '0 €'} (${t.pagamento || 'Da pagare'})</strong></div>
              <div><span>Pagato / Da Pagare</span><strong>${t.pagato || 0} € / <b style="color:${t.daPagare > 0 ? '#f43f5e' : '#10b981'}">${t.daPagare > 0 ? t.daPagare + ' €' : 'Saldato'}</b></strong></div>
              <div style="grid-column: span 2;"><span>Metodo di Pagamento</span><strong>${t.metodoPagamento || 'Non specificato'}</strong></div>
            </div>

            <div class="weather-box">
              <div class="weather-head">
                <span>⛅ Meteo Percorso (Step 45 Min)</span>
                <span id="w-badge-${i}" class="weather-badge-status">Inizializzazione...</span>
              </div>
              <div class="weather-scroll" id="weather-line-${i}">
                <div class="weather-cell"><div class="w-time">--:--</div><div class="w-icon">⏳</div><div class="w-temp">In attesa</div></div>
              </div>
            </div>

            ${t.note ? `<div style="font-size:12px; color:var(--yellow); margin-bottom:12px; background:#182235; padding:8px 10px; border-radius:7px; border-left:3px solid var(--yellow);">📌 ${t.note}</div>` : ''}

            ${btnRouteHtml}
          </div>
        `;

        cont.appendChild(card);
        calcolaTelemetriaCompletaCard(i, t, bH, bM);
      }

      statsHeader.innerText = `${tappe.length} tappe • ${Math.round(sommaKm)} km`;
    }

    async function calcolaTelemetriaCompletaCard(idx, t, bH, bM) {
      const wLine = document.getElementById(`weather-line-${idx}`);
      const wBadge = document.getElementById(`w-badge-${idx}`);
      const tempEl = document.getElementById(`temp-val-${idx}`);

      const checkMeteo = analizzaFinestraMeteo(t.data);

      if (wBadge && wLine) {
        if (checkMeteo.stato === "obsoleto") {
          wBadge.className = "weather-badge-status status-obsoleto";
          wBadge.innerText = "DATO OBSOLETO";
          wLine.innerHTML = `<div style="padding:10px; text-align:center; color:#fda4af; font-size:12px; font-weight:700; width:100%;">⏳ Tappa passata: previsioni meteo non più attive.</div>`;
        } else if (checkMeteo.stato === "futuro") {
          wBadge.className = "weather-badge-status status-future";
          wBadge.innerText = "DATO NON ANCORA DISPONIBILE";
          wLine.innerHTML = `<div style="padding:10px; text-align:center; color:#fef08a; font-size:12px; font-weight:700; width:100%;">📡 Oltre 10 giorni: dati previsionali disponibili all'avvicinarsi della data.</div>`;
        } else if (checkMeteo.stato === "invalid") {
          wBadge.className = "weather-badge-status status-obsoleto";
          wBadge.innerText = "DATA NON VALIDA";
          wLine.innerHTML = `<div style="padding:10px; text-align:center; color:#fda4af; font-size:12px; font-weight:700; width:100%;">Inserire data in formato GG/MM/AAAA.</div>`;
        }
      }

      const locNomi = [];
      if (t.partenza) locNomi.push(t.partenza);
      if (t.passaggio) {
        t.passaggio.split(",").forEach(p => { if (p.trim()) locNomi.push(p.trim()); });
      }
      if (t.arrivo) locNomi.push(t.arrivo);

      const coords = [];
      for (const name of locNomi) {
        try {
          const c = await geocode(name);
          if (c) coords.push({ ...c, name: name });
        } catch(e) {}
      }

      if (coords.length >= 2) {
        let stats = { km: t.km || 0, timeMin: 180, oreStr: t.oreGuida || "3:00", maxEle: t.altMax || 0, elevationCurve: [], fullGeometry: [] };
        try {
          stats = await getRouteAndElevationHD(coords);
        } catch (e) {
          stats.fullGeometry = coords.map(p => [p.lon, p.lat]);
        }

        const kmEl = document.getElementById(`km-val-${idx}`);
        const timeEl = document.getElementById(`time-val-${idx}`);
        const eleEl = document.getElementById(`ele-val-${idx}`);
        const eleBox = document.getElementById(`ele-box-${idx}`);

        const kmToShow = t.km > 0 ? t.km : stats.km;
        const altToShow = t.altMax > 0 ? t.altMax : stats.maxEle;

        if (kmEl) kmEl.innerText = `${Math.round(kmToShow)} km`;
        if (timeEl) timeEl.innerText = (t.oreGuida && t.oreGuida !== "0:00") ? t.oreGuida : stats.oreStr;
        if (eleEl) eleEl.innerText = `${Math.round(altToShow)} m`;
        if (eleBox && stats.elevationCurve.length > 0) {
          eleBox.innerHTML = generaSvgAltimetriaHD(stats.elevationCurve, t.partenza, t.arrivo, Math.round(altToShow));
        }

        if ((!t.tempMedie || t.tempMedie.includes("--")) && tempEl) {
          const dest = coords[coords.length - 1];
          const tStorica = await getHistoricalTempRange(dest.lat, dest.lon, t.data);
          if (tStorica) {
            tempEl.innerText = tStorica;
            tempEl.className = "tele-val " + getTempColorClass(tStorica);
          }
        }

        if (checkMeteo.stato === "disponibile" && wBadge && wLine) {
          wBadge.className = "weather-badge-status status-live";
          wBadge.innerText = `PREVISIONE LIVE (${checkMeteo.diffDays === 0 ? 'OGGI' : 'tra ' + checkMeteo.diffDays + ' gg'})`;

          const geo = (stats.fullGeometry && stats.fullGeometry.length > 0) ? stats.fullGeometry : coords.map(p => [p.lon, p.lat]);
          const totMin = Math.max(20, stats.timeMin);
          const numStep = Math.max(2, Math.floor(totMin / 45) + 1);
          let wHtml = "";
          let tempRilevateTratta = [];

          for (let s = 0; s < numStep; s++) {
            const frazione = s / (numStep - 1);
            const geoIdx = Math.min(geo.length - 1, Math.round(frazione * (geo.length - 1)));
            const minProg = Math.round(frazione * totMin);
            const kmProg = Math.round(frazione * kmToShow);

            const lon = geo[geoIdx][0];
            const lat = geo[geoIdx][1];

            let nomePunto = "";
            if (s === 0) nomePunto = t.partenza;
            else if (s === numStep - 1) nomePunto = t.arrivo;
            else nomePunto = `Tratta +${kmProg}km`;

            const passMin = bH * 60 + bM + minProg;
            const h = Math.floor(passMin / 60) % 24;
            const m = passMin % 60;
            const timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

            const w = await getForecastLiveFast(lat, lon, checkMeteo.isoDate, h);
            if (w.temp !== "--") tempRilevateTratta.push(parseFloat(w.temp));

            const stileColoreTermico = getLiveTempColor(w.temp);

            wHtml += `
              <div class="weather-cell">
                <div class="w-time">${timeStr}</div>
                <div class="w-km">+${kmProg} km</div>
                <div class="w-icon">${w.icon}</div>
                <div class="w-temp" style="${stileColoreTermico}">${w.temp}°C</div>
                <div class="w-rain">💧${w.rain}%</div>
                <div class="w-name" title="${nomePunto}">${nomePunto}</div>
              </div>
            `;
          }
          wLine.innerHTML = wHtml;

          if (tempRilevateTratta.length > 0 && tempEl) {
            const liveMin = Math.min(...tempRilevateTratta);
            const liveMax = Math.max(...tempRilevateTratta);
            tempEl.innerText = `${Math.round(liveMin)}° / ${Math.round(liveMax)}°`;
            tempEl.setAttribute("style", getLiveTempColor(liveMax));
          }
        }
      }
    }

    async function geocode(loc) {
      if (!loc) return null;
      const k = loc.trim().toLowerCase();
      if (GEO_CACHE[k]) return GEO_CACHE[k];
      try {
        const r = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(loc)}&limit=1&accept-language=it,en,fr,de,es,tr,el,ka,hr,bg,sr,ro,ru`, 3500);
        const d = await r.json();
        if (d && d.length > 0) {
          const c = { lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon) };
          GEO_CACHE[k] = c;
          return c;
        }
      } catch(e){}
      return null;
    }

    async function getRouteAndElevationHD(coords) {
      const coordStr = coords.map(p => `${p.lon},${p.lat}`).join(";");
      if (ROUTE_CACHE[coordStr]) return ROUTE_CACHE[coordStr];
      try {
        const res = await fetchWithTimeout(`https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`, 4500);
        const data = await res.json();
        let km = 0, timeMin = 0, oreStr = "0:00";
        let sampleLats = [], sampleLons = [];
        let fullGeometry = [];

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          km = Math.round(route.distance / 1000);
          timeMin = Math.round(route.duration / 60);
          const h = Math.floor(timeMin / 60);
          const m = String(timeMin % 60).padStart(2, "0");
          oreStr = `${h}:${m}`;

          fullGeometry = route.geometry.coordinates;
          const numSamples = 14;
          for (let i = 0; i < numSamples; i++) {
            const idx = Math.min(fullGeometry.length - 1, Math.floor((i / (numSamples - 1)) * (fullGeometry.length - 1)));
            sampleLons.push(fullGeometry[idx][0].toFixed(4));
            sampleLats.push(fullGeometry[idx][1].toFixed(4));
          }
        } else {
          sampleLats = coords.map(p => p.lat);
          sampleLons = coords.map(p => p.lon);
          fullGeometry = coords.map(p => [p.lon, p.lat]);
        }

        const eleRes = await fetchWithTimeout(`https://api.open-meteo.com/v1/elevation?latitude=${sampleLats.join(",")}&longitude=${sampleLons.join(",")}`, 3500);
        const eleData = await eleRes.json();
        let maxEle = 0;
        let elevationCurve = [];
        if (eleData && eleData.elevation) {
          elevationCurve = eleData.elevation;
          maxEle = Math.round(Math.max(...elevationCurve));
        }

        const out = { km, timeMin, oreStr, maxEle, elevationCurve, fullGeometry };
        ROUTE_CACHE[coordStr] = out;
        return out;
      } catch(e){
        return { km: 0, timeMin: 0, oreStr: "0:00", maxEle: 0, elevationCurve: [], fullGeometry: coords.map(p => [p.lon, p.lat]) };
      }
    }

    async function getForecastLiveFast(lat, lon, isoDate, h) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,weather_code&start_date=${isoDate}&end_date=${isoDate}&timezone=auto`;
        const res = await fetchWithTimeout(url, 3500);
        const j = await res.json();
        if (j && j.hourly && j.hourly.temperature_2m) {
          const code = j.hourly.weather_code[h] || 0;
          return {
            temp: Math.round(j.hourly.temperature_2m[h] ?? 20),
            rain: j.hourly.precipitation_probability[h] ?? 0,
            icon: code > 50 ? "🌧️" : (code > 2 ? "⛅" : "☀️")
          };
        }
      } catch(e) {}
      return { temp: "--", rain: 0, icon: "🌤️" };
    }

    async function getHistoricalTempRange(lat, lon, dataStr) {
      try {
        const chk = analizzaFinestraMeteo(dataStr);
        let m = "10", d = "18";
        if (chk.m && chk.d) {
          m = String(chk.m).padStart(2, "0");
          d = String(chk.d).padStart(2, "0");
        }
        const refDate = `2024-${m}-${d}`;
        const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${refDate}&end_date=${refDate}&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
        const res = await fetchWithTimeout(url, 3500);
        const j = await res.json();
        if (j && j.daily && j.daily.temperature_2m_min) {
          return `${Math.round(j.daily.temperature_2m_min[0])}° / ${Math.round(j.daily.temperature_2m_max[0])}°`;
        }
      } catch(e){}
      return "";
    }

    function calcolaDataSuccessiva(dataStr) {
      if (!dataStr) return "";
      const m = analizzaFinestraMeteo(dataStr);
      if (m.stato === "invalid") return "";
      const p = dataStr.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (!p) return "";
      const dt = new Date(parseInt(p[3]), parseInt(p[2]) - 1, parseInt(p[1]));
      dt.setDate(dt.getDate() + 1);
      const gg = String(dt.getDate()).padStart(2, "0");
      const mm = String(dt.getMonth() + 1).padStart(2, "0");
      return `${gg}/${mm}/${dt.getFullYear()}`;
    }

    function apriModaleNuovaTappa() {
      document.getElementById("modalTitle").innerText = `🏍️ Nuova Tappa (${schedaAttiva})`;
      document.getElementById("editRowId").value = "";
      document.getElementById("editKm").value = "0";
      document.getElementById("editOre").value = "";
      document.getElementById("editAltMax").value = "0";
      document.getElementById("editTempMedie").value = "";

      const ultima = tappeCorrenti.length > 0 ? tappeCorrenti[tappeCorrenti.length - 1] : null;
      
      const oggi = new Date();
      const strOggi = `${String(oggi.getDate()).padStart(2, '0')}/${String(oggi.getMonth() + 1).padStart(2, '0')}/${oggi.getFullYear()}`;
      let targetData = ultima ? calcolaDataSuccessiva(ultima.data) : strOggi;
      document.getElementById("inpData").value = targetData;

      if (targetData === strOggi) {
        const h = String(oggi.getHours()).padStart(2, '0');
        const m = String(oggi.getMinutes()).padStart(2, '0');
        document.getElementById("inpOra").value = `${h}:${m}`;
      } else {
        document.getElementById("inpOra").value = "08:30";
      }

      document.getElementById("inpPartenza").value = ultima ? (ultima.arrivo || "") : "";
      document.getElementById("inpPassaggio").value = "";
      document.getElementById("inpArrivo").value = "";
      document.getElementById("inpAlloggio").value = "";
      document.getElementById("inpSpesa").value = "";
      document.getElementById("inpPagato").value = "0";
      document.getElementById("inpDaPagare").value = "0";
      document.getElementById("inpMyRoute").value = "";
      document.getElementById("inpNote").value = "";

      selezionaPulsante('gridPiattaforma', 'valPiattaforma', 'Booking');
      selezionaStatoPagamento('Da pagare');
      selezionaPulsante('gridMetodo', 'valMetodo', 'Revolut Daniel');
      selezionaPulsante('gridParcheggio', 'valParcheggio', 'Garage');

      document.getElementById("modalTappa").style.display = "block";
    }

    function apriModaleModifica(idx) {
      const t = tappeCorrenti[idx];
      if (!t) return;
      document.getElementById("modalTitle").innerText = `✏️ Modifica Tappa #${idx + 1}`;
      document.getElementById("editRowId").value = t.id;
      document.getElementById("editKm").value = t.km || 0;
      document.getElementById("editOre").value = t.oreGuida || "";
      document.getElementById("editAltMax").value = t.altMax || 0;
      document.getElementById("editTempMedie").value = t.tempMedie || "";

      document.getElementById("inpData").value = t.data || "";
      document.getElementById("inpOra").value = t.ora || "08:30";
      document.getElementById("inpPartenza").value = t.partenza || "";
      document.getElementById("inpPassaggio").value = t.passaggio || "";
      document.getElementById("inpArrivo").value = t.arrivo || "";
      document.getElementById("inpAlloggio").value = t.alloggio || "";
      document.getElementById("inpSpesa").value = t.spesa || 0;
      document.getElementById("inpPagato").value = t.pagato || 0;
      document.getElementById("inpDaPagare").value = t.daPagare || 0;
      document.getElementById("inpMyRoute").value = t.myRouteUrl || "";
      document.getElementById("inpNote").value = t.note || "";

      selezionaPulsante('gridPiattaforma', 'valPiattaforma', t.piattaforma || 'Booking');
      selezionaStatoPagamento(t.pagamento || 'Da pagare');
      selezionaPulsante('gridMetodo', 'valMetodo', t.metodoPagamento || 'Revolut Daniel');
      selezionaPulsante('gridParcheggio', 'valParcheggio', t.parcheggio || 'Garage');

      document.getElementById("modalTappa").style.display = "block";
    }

    function chiudiModale() {
      document.getElementById("modalTappa").style.display = "none";
    }

    async function eliminaTappa(rowId) {
      if (!confirm("Confermi l'eliminazione di questa tappa?")) return;
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "delete", sheetName: schedaAttiva, rowId: rowId })
      });
      setTimeout(() => apriSchedaViaggio(schedaAttiva), 1000);
    }

    async function salvaTappa() {
      const dep = document.getElementById("inpPartenza").value.trim();
      const via = document.getElementById("inpPassaggio").value.trim();
      const arr = document.getElementById("inpArrivo").value.trim();
      const dataStr = document.getElementById("inpData").value.trim();
      const rowId = document.getElementById("editRowId").value;

      if (!dep || !arr) {
        alert("Inserisci Città di Partenza e Arrivo!");
        return;
      }

      const btn = document.getElementById("btnSalvaTappa");
      btn.innerText = "⏳ Calcolo...";
      btn.disabled = true;

      let kmCalc = parseFloat(document.getElementById("editKm").value) || 0;
      let oreCalc = document.getElementById("editOre").value || "0:00";
      let altMaxCalc = parseFloat(document.getElementById("editAltMax").value) || 0;
      let tempCalc = document.getElementById("editTempMedie").value || "";

      try {
        const nomi = [dep];
        if (via) via.split(",").forEach(p => { if (p.trim()) nomi.push(p.trim()); });
        nomi.push(arr);

        const pts = [];
        for (const n of nomi) {
          const c = await geocode(n);
          if (c) pts.push({ ...c, name: n });
        }
        if (pts.length >= 2) {
          const st = await getRouteAndElevationHD(pts);
          if (st.km > 0) kmCalc = st.km;
          if (st.oreStr) oreCalc = st.oreStr;
          if (st.maxEle > 0) altMaxCalc = st.maxEle;
        }
      } catch (e) {}

      const spesa = parseFloat(document.getElementById("inpSpesa").value) || 0;
      const pagato = parseFloat(document.getElementById("inpPagato").value) || 0;
      const daPagare = parseFloat(document.getElementById("inpDaPagare").value) || 0;

      const payload = {
        sheetName: schedaAttiva,
        action: rowId ? "update" : "create",
        rowId: rowId || undefined,
        data: dataStr,
        ora: document.getElementById("inpOra").value || "08:30",
        partenza: dep,
        passaggio: via,
        arrivo: arr,
        km: kmCalc,
        oreGuida: oreCalc,
        altMax: altMaxCalc,
        tempMedie: tempCalc,
        alloggio: document.getElementById("inpAlloggio").value.trim(),
        piattaforma: document.getElementById("valPiattaforma").value,
        spesa: spesa,
        pagamento: document.getElementById("valPagamento").value,
        pagato: pagato,
        daPagare: daPagare,
        metodoPagamento: document.getElementById("valMetodo").value,
        parcheggio: document.getElementById("valParcheggio").value,
        note: document.getElementById("inpNote").value.trim(),
        myRouteUrl: document.getElementById("inpMyRoute").value.trim()
      };

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      btn.innerText = "💾 Salva Tappa";
      btn.disabled = false;
      chiudiModale();
      setTimeout(() => apriSchedaViaggio(schedaAttiva), 1100);
    }
  </script>
