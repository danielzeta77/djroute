<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>djRoutePlanner - Roadbook & Live Weather</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="djRoute">
  <meta name="theme-color" content="#0d1117">
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS per lettura Excel universale -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    body { background-color: #0d1117; color: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card { background: #161b22; border: 1px solid #30363d; }
    .scroll-hide::-webkit-scrollbar { display: none; }
    .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-28">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#161b22]/95 backdrop-blur border-b border-gray-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center">
        <i class="fa-solid fa-motorcycle text-amber-500 text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm sm:text-base leading-tight">djRoutePlanner</h1>
        <p class="text-[10px] text-gray-400">Garmin • TomTom • GPX • Live Weather</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <!-- Importa Excel -->
      <label class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-600 px-2.5 py-1.5 rounded-lg text-xs font-medium cursor-pointer flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-file-excel text-emerald-400"></i> Importa Excel
        <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" class="hidden" onchange="importaQualsiasiExcel(event)">
      </label>
      <!-- Aggiungi Tappa a mano -->
      <button onclick="apriModalTappa()" class="bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold px-2.5 py-1.5 rounded-lg text-xs flex items-center gap-1 shadow-sm">
        <i class="fa-solid fa-plus"></i> Tappa
      </button>
    </div>
  </header>

  <!-- GPS Live Bar -->
  <section class="m-3 p-3 rounded-xl bg-gray-900/90 border border-gray-800 shadow">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        <span id="gpsStatus" class="text-xs text-gray-300 font-medium">GPS: Pronto</span>
      </div>
      <button onclick="attivaGps()" class="bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-600/30 text-xs px-2.5 py-1 rounded-md font-medium flex items-center gap-1">
        <i class="fa-solid fa-location-crosshairs"></i> Posizione Live
      </button>
    </div>
    <div id="liveWeatherBox" class="mt-2 text-xs text-gray-300 border-t border-gray-800 pt-2 hidden"></div>
  </section>

  <!-- Container Tappe -->
  <main class="px-3 space-y-3.5" id="tappeContainer">
    <div id="emptyState" class="text-center py-16 px-4">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gray-800/80 flex items-center justify-center border border-gray-700">
        <i class="fa-solid fa-map-location-dot text-2xl text-amber-500"></i>
      </div>
      <h2 class="text-base font-semibold text-white">Nessuna tappa presente</h2>
      <p class="text-xs text-gray-400 mt-1 max-w-xs mx-auto">
        Premi <strong>"Importa Excel"</strong> per caricare qualsiasi roadbook, oppure crea una tappa con <strong>"+ Tappa"</strong>.
      </p>
    </div>
  </main>

  <!-- MODAL EXPORT TRACCIA NAVIGATORI (GARMIN, TOMTOM, GPX, KML) -->
  <div id="exportModal" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-4">
    <div class="card w-full max-w-sm rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-800 pb-2">
        <h3 class="font-bold text-sm text-white flex items-center gap-2">
          <i class="fa-solid fa-satellite-dish text-amber-500"></i> Esporta per Navigatore
        </h3>
        <button onclick="chiudiExportModal()" class="text-gray-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <p class="text-xs text-gray-300" id="exportDesc">Seleziona il formato del tuo navigatore GPS:</p>

      <div class="grid grid-cols-1 gap-2 text-xs">
        <!-- Garmin / Universale (GPX) -->
        <button onclick="eseguiDownloadFormato('gpx')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 p-2.5 rounded-xl flex items-center justify-between text-left">
          <div>
            <span class="font-bold text-white block">Formato GPX (.gpx)</span>
            <span class="text-[11px] text-gray-400">Garmin (Zūmo/Tread/BMW), OsmAnd, Rever</span>
          </div>
          <i class="fa-solid fa-download text-amber-400 text-sm"></i>
        </button>

        <!-- TomTom (ITN) -->
        <button onclick="eseguiDownloadFormato('itn')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 p-2.5 rounded-xl flex items-center justify-between text-left">
          <div>
            <span class="font-bold text-white block">TomTom Itinerary (.itn)</span>
            <span class="text-[11px] text-gray-400">TomTom Rider serie 400/500/550, TomTom GO</span>
          </div>
          <i class="fa-solid fa-download text-cyan-400 text-sm"></i>
        </button>

        <!-- Google Earth / KML -->
        <button onclick="eseguiDownloadFormato('kml')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 p-2.5 rounded-xl flex items-center justify-between text-left">
          <div>
            <span class="font-bold text-white block">Google Earth KML (.kml)</span>
            <span class="text-[11px] text-gray-400">Google Earth, Mapsme, viewer 3D</span>
          </div>
          <i class="fa-solid fa-download text-emerald-400 text-sm"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL NUOVA / MODIFICA TAPPA -->
  <div id="tappaModal" class="fixed inset-0 bg-black/85 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="card w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-4 sm:p-5 max-h-[90vh] overflow-y-auto space-y-3">
      <div class="flex justify-between items-center border-b border-gray-800 pb-2">
        <h3 class="font-bold text-sm sm:text-base flex items-center gap-2">
          <i class="fa-solid fa-route text-amber-500"></i> Scheda Tappa
        </h3>
        <button onclick="chiudiModalTappa()" class="text-gray-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <input type="hidden" id="editIndex" value="-1">

      <div class="grid grid-cols-3 gap-2 text-xs">
        <div>
          <label class="block text-gray-400 mb-1">Giorno</label>
          <input type="text" id="m_giorno" placeholder="es. lun" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Data Partenza</label>
          <input type="date" id="m_data" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
        <div>
          <label class="block text-amber-400 font-semibold mb-1">Ora Partenza</label>
          <input type="time" id="m_ora" value="08:30" class="w-full bg-gray-800 border border-amber-500/40 rounded-lg p-2 text-white font-bold">
        </div>
      </div>

      <div class="space-y-2 text-xs">
        <div>
          <label class="block text-gray-300 font-medium mb-1">Luogo di Partenza *</label>
          <input type="text" id="m_partenza" placeholder="es. Ancona" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Passi / Punti Intermedi (separati da virgola)</label>
          <input type="text" id="m_intermedio" placeholder="es. Igoumenitsa, Passo Katara" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
        <div>
          <label class="block text-gray-300 font-medium mb-1">Destinazione Finale (Arrivo) *</label>
          <input type="text" id="m_arrivo" placeholder="es. Kalambaka" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 text-xs">
        <div>
          <label class="block text-gray-400 mb-1">Km Totali</label>
          <input type="number" id="m_km" placeholder="250" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Ore di Guida</label>
          <input type="text" id="m_ore" placeholder="03:30" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Quota Max (m)</label>
          <input type="text" id="m_alt" placeholder="1690 m" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
      </div>

      <!-- SEZIONE ALLOGGIO -->
      <div class="border-t border-gray-800 pt-2.5 space-y-2 text-xs">
        <span class="text-[11px] font-bold text-amber-400 uppercase tracking-wider block">Dettagli Alloggio & Parcheggio</span>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-400 mb-1">Nome Alloggio / Hotel</label>
            <input type="text" id="m_hotel" placeholder="Nome Struttura" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">Piattaforma di Prenotazione</label>
            <input type="text" id="m_piattaforma" placeholder="es. Booking, Airbnb, Diretto" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-400 mb-1">Prezzo Totale €</label>
            <input type="text" id="m_prezzo" placeholder="es. 85 €" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">Stato Pagamento</label>
            <select id="m_pagato" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
              <option value="Da pagare">Da pagare</option>
              <option value="Già pagato">Già pagato</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-emerald-400 font-semibold mb-1"><i class="fa-solid fa-shield-halved mr-1"></i> Indicazioni Parcheggio Moto</label>
          <input type="text" id="m_parcheggio" placeholder="es. Cortile interno privato con cancello su asfalto" class="w-full bg-gray-800 border border-emerald-600/40 rounded-lg p-2 text-white">
        </div>
      </div>

      <!-- CARICAMENTO FILE ESTERNO DI NAVIGAZIONE (GARMIN, TOMTOM, GPX, ITN, KML, GEOJSON) -->
      <div class="border-t border-gray-800 pt-2 space-y-2 text-xs">
        <label class="block text-amber-400 font-semibold mb-1">
          <i class="fa-solid fa-file-import mr-1"></i> Carica File Traccia (GPX, ITN, KML, FIT, GeoJSON)
        </label>
        <div class="flex items-center gap-2">
          <label class="bg-gray-800 hover:bg-gray-700 border border-gray-700 px-3 py-2 rounded-lg cursor-pointer text-gray-300 w-full text-center truncate">
            <span id="labelFileTraccia">Scegli file dal telefono/PC...</span>
            <input type="file" id="navFileInput" accept=".gpx, .itn, .kml, .kmz, .fit, .tcx, .json, .geojson" class="hidden" onchange="gestisciCaricamentoFileTraccia(event)">
          </label>
        </div>

        <div>
          <label class="block text-orange-400 mb-1"><i class="fa-solid fa-route mr-1"></i> Oppure Link MyRoute-app</label>
          <input type="url" id="m_myroute" placeholder="https://www.myrouteapp.com/..." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
      </div>

      <div class="pt-2 flex gap-2">
        <button onclick="chiudiModalTappa()" class="w-1/2 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-lg text-xs font-semibold text-gray-300">Annulla</button>
        <button onclick="salvaTappa()" class="w-1/2 py-2.5 bg-amber-500 hover:bg
