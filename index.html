<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>djRoute Master Roadbook</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a29;
      --card-alt: #0e1420;
      --cyan: #00e5ff;
      --green: #10b981;
      --orange: #f59e0b;
      --red: #f43f5e;
      --blue: #2563eb;
      --border: #233047;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: 12px;
      padding-bottom: 110px;
      -webkit-font-smoothing: antialiased;
    }

    /* BARRA SUPERIORE / CRUSCOTTO */
    header {
      background: linear-gradient(145deg, #162032, #0d131f);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .logo {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--cyan);
      letter-spacing: 1px;
    }
    .logo span { color: #fff; }
    
    .btn-sync {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff;
      border: none;
      padding: 9px 14px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 12px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-sync:active { transform: scale(0.96); }

    /* SELETTORE VIAGGI / HOMEPAGE MULTI-SCHEDA */
    .trips-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .trips-bar::-webkit-scrollbar { display: none; }
    .trip-tab {
      flex: 0 0 auto;
      background: #0f1726;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }
    .trip-tab.active {
      background: var(--cyan);
      color: #0b0f17;
      border-color: var(--cyan);
    }
    .trip-tab.add-tab {
      background: #1e293b;
      color: #cbd5e1;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .km-badge {
      color: var(--cyan);
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
    }

    /* SWIPE CONTAINER PER ELIMINAZIONE */
    .swipe-container {
      position: relative;
      margin-bottom: 16px;
      overflow: hidden;
      border-radius: 14px;
    }
    .swipe-delete-bg {
      position: absolute;
      top: 0; bottom: 0; right: 0;
      width: 100px;
      background: var(--red);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      z-index: 1;
    }

    /* CARD DELLA TAPPA */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      position: relative;
      z-index: 2;
      transition: transform 0.2s ease-out;
    }

    .card-head {
      background: #0f1624;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .card-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: var(--cyan);
    }
    .card-date {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 13px;
      font-weight: 700;
      background: #1e293b;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      color: #fff;
    }

    .card-body { padding: 14px; }

    /* TIMELINE PERCORSO */
    .route-box {
      border-left: 2px solid #334155;
      margin-left: 8px;
      padding-left: 16px;
      margin-bottom: 14px;
    }
    .route-point {
      position: relative;
      margin-bottom: 10px;
    }
    .route-point:last-child { margin-bottom: 0; }
    .route-point::before {
      content: '';
      position: absolute;
      left: -22px;
      top: 5px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #475569;
    }
    .route-point.dep::before { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .route-point.arr::before { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .route-point.via::before { background: var(--orange); }

    .point-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .point-city { font-size: 16px; font-weight: 700; color: #fff; }

    /* CRUSCOTTO SU STRADA (TRA ARRIVO E ALLOGGIO) */
    .road-telemetry {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1.3fr;
      gap: 6px;
      margin-bottom: 14px;
      background: #0d1422;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    .tele-item {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .tele-item:not(:last-child) {
      border-right: 1px solid #1e2a3f;
    }
    .tele-label {
      font-size: 9px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 2px;
    }
    .tele-val {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: var(--cyan);
    }

    /* BADGE TEMPERATURE MEDIE STORICHE */
    .temp-hot {
      color: #f43f5e !important;
      text-shadow: 0 0 8px rgba(244, 63, 94, 0.4);
    }
    .temp-cold {
      color: #38bdf8 !important;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }
    .temp-mild {
      color: #10b981 !important;
    }

    /* ALLOGGIO E LOGISTICA */
    .grid-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .grid-info div span { display: block; font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .grid-info div strong { color: #f1f5f9; font-size: 13px; }

    /* METEO ROTTA OGNI 45 MIN */
    .weather-box {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .weather-head {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .weather-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .weather-cell {
      flex: 0 0 auto;
      background: #141c2c;
      border: 1px solid #233147;
      border-radius: 8px;
      padding: 6px 10px;
      text-align: center;
      min-width: 78px;
    }
    .w-time { font-family: 'Chakra Petch', sans-serif; font-size: 11px; color: var(--orange); font-weight: 700; }
    .w-icon { font-size: 18px; margin: 2px 0; }
    .w-temp { font-size: 14px; font-weight: 800; color: #fff; }
    .w-rain { font-size: 10px; color: #60a5fa; }
    .w-name { font-size: 10px; color: var(--text-muted); max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btn-myroute {
      display: block;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      color: #fff;
      text-align: center;
      border-radius: 8px;
      text-decoration: none;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      border: 1px solid #60a5fa;
    }

    .fab-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #0284c7, #00e5ff);
      color: #04101e;
      border: none;
      padding: 14px 20px;
      border-radius: 30px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4);
      cursor: pointer;
      z-index: 99;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* MODALE CREAZIONE TAPPA */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      padding: 16px;
      overflow-y: auto;
    }
    .modal-box {
      background: #141c2b;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      max-width: 480px;
      margin: 15px auto;
      position: relative;
    }
    .modal-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--cyan);
      margin-bottom: 14px;
    }
    .form-group {
      margin-bottom: 10px;
      position: relative;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
    }
    .suggest-list {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: #1b263b;
      border: 1px solid #334155;
      border-radius: 6px;
      z-index: 120;
      max-height: 160px;
      overflow-y: auto;
      display: none;
    }
    .suggest-item {
      padding: 8px 12px;
      font-size: 13px;
      color: #e2e8f0;
      border-bottom: 1px solid #24324d;
      cursor: pointer;
    }
    .suggest-item:hover, .suggest-item:active {
      background: #2563eb;
      color: #fff;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .btn-save {
      flex: 1;
      background: var(--green);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-cancel {
      flex: 1;
      background: #334155;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="top-row">
      <div class="logo">🏍️ djRoute <span>ROADBOOK</span></div>
      <button id="btnSyncCloud" class="btn-sync" onclick="sincronizzaCloud()">
        🔄 AGGIORNA
      </button>
    </div>

    <!-- HOMEPAGE MULTI-SCHEDA (SELEZIONE VIAGGIO) -->
    <div class="trips-bar" id="tripsBar"></div>

    <div class="status-row">
      <span id="syncStatus">Pronto</span>
      <span id="stageCounter">0 tappe</span>
      <span id="totalKmHeader" class="km-badge">Totale: 0 km</span>
    </div>
  </header>

  <!-- CONTENITORE TAPPE -->
  <main id="tappeContainer">
    <div style="text-align:center; padding:50px 20px; color:#94a3b8;">
      Tocca <strong>AGGIORNA</strong> in alto oppure <strong>➕ NUOVA TAPPA</strong> per iniziare.
    </div>
  </main>

  <!-- PULSANTE AGGIUNGI TAPPA -->
  <button class="fab-btn" onclick="apriModaleNuovaTappa()">
    ➕ NUOVA TAPPA
  </button>

  <!-- MODALE CREAZIONE TAPPA -->
  <div id="modalTappa" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">🏍️ Inserisci Nuova Tappa</div>
      
      <div class="form-group">
        <label>Data Tappa (GG/MM/AAAA)</label>
        <input type="text" id="inpData" placeholder="es. 15/05/2026" maxlength="10">
      </div>

      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Orario Partenza</label>
          <input type="time" id="inpOra" value="08:30">
        </div>
        <div class="form-group" style="flex:1;">
          <label>Costo Alloggio (€)</label>
          <input type="number" id="inpSpesa" placeholder="0">
        </div>
      </div>

      <div class="form-group">
        <label>Città di Partenza</label>
        <input type="text" id="inpPartenza" placeholder="es. Tione di Trento" autocomplete="off">
        <div id="sugPartenza" class="suggest-list"></div>
      </div>

      <div class="form-group">
        <label>Passaggi / Valichi intermedi</label>
        <input type="text" id="inpPassaggio" placeholder="es. Passo Tonale, Edolo" autocomplete="off">
        <div id="sugPassaggio" class="suggest-list"></div>
      </div>

      <div class="form-group">
        <label>Città di Arrivo</label>
        <input type="text" id="inpArrivo" placeholder="es. Mantova" autocomplete="off">
        <div id="sugArrivo" class="suggest-list"></div>
      </div>

      <div class="form-group">
        <label>Nome Alloggio / Hotel</label>
        <input type="text" id="inpAlloggio" placeholder="es. Hotel Mantova">
      </div>

      <div class="form-group">
        <label>Link MyRoute-app / Percorso</label>
        <input type="url" id="inpMyRoute" placeholder="https://www.myrouteapp.com/...">
      </div>

      <div class="form-group">
        <label>Note Roadbook</label>
        <input type="text" id="inpNote" placeholder="es. Sosta pranzo">
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="chiudiModaleNuovaTappa()">ANNULLA</button>
        <button class="btn-save" onclick="salvaNuovaTappa()">💾 SALVA TAPPA</button>
      </div>
    </div>
  </div>

  <script>
    // GESTIONE MULTI-VIAGGIO
    const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSg_iYdW33G7M2RDvckqApsOKZC614zho4-qTsk0ow_Bx3EmrN_kVusQIPyr8qeEC-5w/exec";
    
    let tourList = JSON.parse(localStorage.getItem("djRoute_tours") || "[]");
    if (tourList.length === 0) {
      tourList = [
        { id: "tour_2026", name: "Grecia & Turchia 2026", url: DEFAULT_SCRIPT_URL },
        { id: "tour_kurdistan", name: "Iraqi Kurdistan 2027", url: DEFAULT_SCRIPT_URL }
      ];
      localStorage.setItem("djRoute_tours", JSON.stringify(tourList));
    }

    let activeTourId = localStorage.getItem("djRoute_active_tour_id") || tourList[0].id;
    function getActiveTour() {
      return tourList.find(t => t.id === activeTourId) || tourList[0];
    }

    const GEO_CACHE = {};
    const ROUTE_CACHE = {};

    // RENDER DELLE SCHEDE DEI VIAGGI
    function renderTripsBar() {
      const bar = document.getElementById("tripsBar");
      bar.innerHTML = "";
      tourList.forEach(t => {
        const tab = document.createElement("div");
        tab.className = `trip-tab ${t.id === activeTourId ? 'active' : ''}`;
        tab.innerText = t.name;
        tab.onclick = () => {
          activeTourId = t.id;
          localStorage.setItem("djRoute_active_tour_id", activeTourId);
          renderTripsBar();
          caricaTappeAttive();
        };
        bar.appendChild(tab);
      });

      const addBtn = document.createElement("div");
      addBtn.className = "trip-tab add-tab";
      addBtn.innerText = "+ Nuovo Tour";
      addBtn.onclick = () => {
        const nome = prompt("Inserisci il nome del nuovo tour (es. Alpi 2026):");
        if (nome && nome.trim()) {
          const newId = "tour_" + Date.now();
          tourList.push({ id: newId, name: nome.trim(), url: DEFAULT_SCRIPT_URL });
          localStorage.setItem("djRoute_tours", JSON.stringify(tourList));
          activeTourId = newId;
          localStorage.setItem("djRoute_active_tour_id", activeTourId);
          renderTripsBar();
          caricaTappeAttive();
        }
      };
      bar.appendChild(addBtn);
    }

    // FORMATTAZIONE DATA AUTOMATICA GG/MM/AAAA
    const inpData = document.getElementById("inpData");
    inpData.addEventListener("input", (e) => {
      let v = e.target.value.replace(/\D/g, "");
      if (v.length > 2 && v.length <= 4) {
        e.target.value = v.slice(0,2) + "/" + v.slice(2);
      } else if (v.length > 4) {
        e.target.value = v.slice(0,2) + "/" + v.slice(2,4) + "/" + v.slice(4,8);
      }
    });

    // AUTOCOMPLETAMENTO CITTA
    function setupAutocomplete(inputId, suggestBoxId) {
      const input = document.getElementById(inputId);
      const box = document.getElementById(suggestBoxId);
      let timer = null;

      input.addEventListener("input", () => {
        clearTimeout(timer);
        const q = input.value.trim();
        if (q.length < 3) { box.style.display = "none"; return; }

        timer = setTimeout(async () => {
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5&addressdetails=1`);
            const items = await res.json();
            if (!items || items.length === 0) { box.style.display = "none"; return; }

            box.innerHTML = "";
            items.forEach(it => {
              const div = document.createElement("div");
              div.className = "suggest-item";
              div.innerText = it.display_name.split(",").slice(0, 3).join(",");
              div.onclick = () => {
                input.value = it.display_name.split(",")[0].trim();
                GEO_CACHE[input.value.toLowerCase()] = { lat: parseFloat(it.lat), lon: parseFloat(it.lon) };
                box.style.display = "none";
              };
              box.appendChild(div);
            });
            box.style.display = "block";
          } catch(e) { box.style.display = "none"; }
        }, 300);
      });

      document.addEventListener("click", (e) => {
        if (!input.contains(e.target) && !box.contains(e.target)) box.style.display = "none";
      });
    }

    setupAutocomplete("inpPartenza", "sugPartenza");
    setupAutocomplete("inpPassaggio", "sugPassaggio");
    setupAutocomplete("inpArrivo", "sugArrivo");

    // GEOCODIFICA E OSRM ROUTE
    async function geocode(location) {
      if (!location) return null;
      const key = location.trim().toLowerCase();
      if (GEO_CACHE[key]) return GEO_CACHE[key];

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(location)}&limit=1`);
        const data = await res.json();
        if (data && data.length > 0) {
          const coords = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
          GEO_CACHE[key] = coords;
          return coords;
        }
      } catch (e) {}
      return null;
    }

    async function getRouteStats(pts) {
      if (pts.length < 2) return { km: 0, timeMin: 0, maxEle: 0 };
      const coordStr = pts.map(p => `${p.lon},${p.lat}`).join(";");
      if (ROUTE_CACHE[coordStr]) return ROUTE_CACHE[coordStr];

      try {
        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=false`;
        const res = await fetch(osrmUrl);
        const data = await res.json();
        
        let km = 0;
        let timeMin = 0;
        if (data.routes && data.routes.length > 0) {
          km = Math.round(data.routes[0].distance / 1000);
          timeMin = Math.round(data.routes[0].duration / 60);
        }

        // ALTIMETRIA PRECISA MEDIANTE OPEN-METEO
        let maxEle = 0;
        const lats = pts.map(p => p.lat).join(",");
        const lons = pts.map(p => p.lon).join(",");
        const eleRes = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lons}`);
        const eleData = await eleRes.json();
        if (eleData && eleData.elevation) {
          maxEle = Math.round(Math.max(...eleData.elevation));
        }

        const stats = { km, timeMin, maxEle };
        ROUTE_CACHE[coordStr] = stats;
        return stats;
      } catch (e) {
        return { km: 0, timeMin: 0, maxEle: 0 };
      }
    }

    // CLASSIFICAZIONE COLORE TEMPERATURE MEDIE STORICHE
    function getTempClass(tempStr) {
      if (!tempStr) return "temp-mild";
      // Cerca numeri nella stringa (es. "11° / 29°")
      const matches = tempStr.match(/-?\d+/g);
      if (!matches) return "temp-mild";
      const nums = matches.map(Number);
      const minT = Math.min(...nums);
      const maxT = Math.max(...nums);

      if (maxT > 28) return "temp-hot";
      if (minT < 15) return "temp-cold";
      return "temp-mild";
    }

    // METEO ROTTA
    function getWmoInfo(code) {
      if (code === 0) return { icon: "☀️" };
      if ([1, 2].includes(code)) return { icon: "🌤️" };
      if (code === 3) return { icon: "☁️" };
      if ([45, 48].includes(code)) return { icon: "🌫️" };
      if ([51, 53, 55].includes(code)) return { icon: "🌦️" };
      if ([61, 63, 65].includes(code)) return { icon: "🌧️" };
      if ([71, 73, 75].includes(code)) return { icon: "🌨️" };
      if ([80, 81, 82].includes(code)) return { icon: "🌦️" };
      if ([95, 96, 99].includes(code)) return { icon: "⛈️" };
      return { icon: "🌡️" };
    }

    async function getPointWeather(lat, lon, hourInt) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,weather_code&timezone=auto&forecast_days=14`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.hourly) {
          const idx = hourInt;
          const temp = Math.round(data.hourly.temperature_2m[idx] || 20);
          const rain = data.hourly.precipitation_probability[idx] || 0;
          const code = data.hourly.weather_code[idx] || 0;
          return { temp, rain, icon: getWmoInfo(code).icon };
        }
      } catch (e) {}
      return { temp: "--", rain: 0, icon: "🌤️" };
    }

    // CARICAMENTO INIZIALE
    window.addEventListener("DOMContentLoaded", () => {
      renderTripsBar();
      caricaTappeAttive();
    });

    function caricaTappeAttive() {
      const storageKey = `djRoute_tappe_${activeTourId}`;
      const cached = localStorage.getItem(storageKey);
      if (cached) {
        try {
          renderRoadbook(JSON.parse(cached));
          return;
        } catch(e) {}
      }
      renderRoadbook([]);
    }

    // SINCRONIZZAZIONE CON GOOGLE SHEETS
    async function sincronizzaCloud() {
      const btn = document.getElementById("btnSyncCloud");
      const status = document.getElementById("syncStatus");
      btn.disabled = true;
      btn.innerHTML = "⏳ CARICO...";
      status.innerText = "Download tappe...";

      const tour = getActiveTour();

      try {
        const url = tour.url + "?_nocache=" + new Date().getTime();
        const response = await fetch(url);
        if (!response.ok) throw new Error("Errore API");

        const tappe = await response.json();
        const storageKey = `djRoute_tappe_${activeTourId}`;
        localStorage.setItem(storageKey, JSON.stringify(tappe));
        status.innerText = "Calcolo percorsi...";
        await renderRoadbook(tappe);
        status.innerText = `Aggiornato: ${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
      } catch (err) {
        alert("Errore sincronizzazione con Google Sheets.");
        status.innerText = "Errore connessione";
      } finally {
        btn.disabled = false;
        btn.innerHTML = "🔄 AGGIORNA";
      }
    }

    // RENDERING DEL ROADBOOK CON SWIPE PER ELIMINARE
    async function renderRoadbook(tappe) {
      const container = document.getElementById("tappeContainer");
      const counter = document.getElementById("stageCounter");
      const totalKmHeader = document.getElementById("totalKmHeader");

      container.innerHTML = "";
      counter.innerText = `${tappe.length} tappe`;

      if (tappe.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:50px 20px; color:#94a3b8;">Nessuna tappa presente per questo tour.<br>Tocca <strong>AGGIORNA</strong> o <strong>➕ NUOVA TAPPA</strong>.</div>`;
        totalKmHeader.innerText = "Totale: 0 km";
        return;
      }

      let totalTripKm = 0;

      for (let i = 0; i < tappe.length; i++) {
        const t = tappe[i];
        
        const swipeWrapper = document.createElement("div");
        swipeWrapper.className = "swipe-container";

        // Tasto Elimina sotto lo swipe
        const deleteBg = document.createElement("div");
        deleteBg.className = "swipe-delete-bg";
        deleteBg.innerText = "🗑️ ELIMINA";
        deleteBg.onclick = () => eliminaTappa(i, t);

        const card = document.createElement("article");
        card.className = "card";

        // GESTIONE SWIPE TOUCH MOBILE
        let startX = 0;
        let currentX = 0;

        card.addEventListener("touchstart", (e) => {
          startX = e.touches[0].clientX;
        }, { passive: true });

        card.addEventListener("touchmove", (e) => {
          currentX = e.touches[0].clientX;
          const diff = currentX - startX;
          if (diff < 0 && diff > -110) {
            card.style.transform = `translateX(${diff}px)`;
          }
        }, { passive: true });

        card.addEventListener("touchend", () => {
          const diff = currentX - startX;
          if (diff < -60) {
            card.style.transform = "translateX(-100px)";
          } else {
            card.style.transform = "translateX(0px)";
          }
        });

        // Tasto Navigazione MyRoute-app
        let btnRouteHtml = "";
        if (t.myRouteUrl && t.myRouteUrl.trim().startsWith("http")) {
          btnRouteHtml = `<a href="${t.myRouteUrl.trim()}" target="_blank" class="btn-myroute">🚀 APRI IN MYROUTE-APP</a>`;
        } else {
          const gmaps = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(t.partenza)}&destination=${encodeURIComponent(t.arrivo)}${t.passaggio ? '&waypoints=' + encodeURIComponent(t.passaggio) : ''}`;
          btnRouteHtml = `<a href="${gmaps}" target="_blank" class="btn-myroute">🗺️ APRI IN MAPPA</a>`;
        }

        const baseOra = t.ora ? parseInt(t.ora.split(":")[0]) || 8 : 8;
        const baseMin = t.ora ? parseInt(t.ora.split(":")[1]) || 30 : 30;
        const tempClass = getTempClass(t.tempMedie);

        card.innerHTML = `
          <div class="card-head">
            <span class="card-title">TAPPA #${i + 1}</span>
            <span class="card-date">${t.data || 'DATA N/D'}</span>
          </div>

          <div class="card-body">
            <!-- 1. TIMELINE PERCORSO -->
            <div class="route-box">
              <div class="route-point dep">
                <div class="point-label">Partenza (Ore ${t.ora || '08:30'})</div>
                <div class="point-city">${t.partenza || 'N/D'}</div>
              </div>
              ${t.passaggio ? `
              <div class="route-point via">
                <div class="point-label">Passaggi / Valichi</div>
                <div class="point-city" style="font-size:14px; color:#cbd5e1;">${t.passaggio}</div>
              </div>` : ''}
              <div class="route-point arr">
                <div class="point-label">Arrivo</div>
                <div class="point-city">${t.arrivo || 'N/D'}</div>
              </div>
            </div>

            <!-- 2. CRUSCOTTO TELEMETRIA & TEMPERATURE MEDIE STORICHE -->
            <div class="road-telemetry">
              <div class="tele-item">
                <div class="tele-label">Distanza</div>
                <div class="tele-val" id="km-val-${i}">${t.km ? t.km + ' km' : '-- km'}</div>
              </div>
              <div class="tele-item">
                <div class="tele-label">Tempo Guida</div>
                <div class="tele-val" id="time-val-${i}">--h --m</div>
              </div>
              <div class="tele-item">
                <div class="tele-label">Quota Max</div>
                <div class="tele-val" id="ele-val-${i}">-- m</div>
              </div>
              <div class="tele-item">
                <div class="tele-label">Temp Medie</div>
                <div class="tele-val ${tempClass}" id="temp-val-${i}">${t.tempMedie || '--° / --°'}</div>
              </div>
            </div>

            <!-- 3. ALLOGGIO E SPESE -->
            <div class="grid-info">
              <div><span>Alloggio</span><strong>${t.alloggio || 'Libero / Tenda'}</strong></div>
              <div><span>Parcheggio</span><strong>${t.parcheggio || 'Non spec.'}</strong></div>
              <div><span>Spesa Prevista</span><strong>${t.spesa ? t.spesa + ' €' : '-'}</strong></div>
              <div><span>Residuo</span><strong style="color:${t.daPagare > 0 ? '#f43f5e' : '#10b981'}">${t.daPagare > 0 ? t.daPagare + ' €' : 'Saldato'}</strong></div>
            </div>

            <!-- 4. METEO ROTTA (OGNI 45 MIN) -->
            <div class="weather-box">
              <div class="weather-head">
                <span>METEO ROTTA (STEP 45 MIN)</span>
                <span style="color:#94a3b8;">Open-Meteo HD</span>
              </div>
              <div class="weather-scroll" id="weather-timeline-${i}">
                <div class="weather-cell"><div class="w-time">--:--</div><div class="w-icon">⏳</div><div class="w-temp">Calcolo...</div></div>
              </div>
            </div>

            ${t.note ? `<div style="font-size:12px; color:#fde68a; margin-bottom:12px; background:#1c2536; padding:8px 10px; border-radius:6px;">📌 ${t.note}</div>` : ''}

            ${btnRouteHtml}
          </div>
        `;

        swipeWrapper.appendChild(deleteBg);
        swipeWrapper.appendChild(card);
        container.appendChild(swipeWrapper);

        // CALCOLO SU STRADA (OSRM + ALTIMETRIA + METEO)
        (async (idx, tappaData, bH, bM) => {
          const locList = [];
          if (tappaData.partenza) locList.push({ name: tappaData.partenza, delta: 0 });
          if (tappaData.passaggio) {
            tappaData.passaggio.split(",").forEach((p, pIdx) => {
              locList.push({ name: p.trim(), delta: (pIdx + 1) * 45 });
            });
          }
          if (tappaData.arrivo) {
            const lastDelta = locList.length > 1 ? locList[locList.length - 1].delta + 45 : 90;
            locList.push({ name: tappaData.arrivo, delta: lastDelta });
          }

          const resolvedCoords = [];
          for (const item of locList) {
            const c = await geocode(item.name);
            if (c) resolvedCoords.push(c);
          }

          if (resolvedCoords.length >= 2) {
            const stats = await getRouteStats(resolvedCoords);
            const kmEl = document.getElementById(`km-val-${idx}`);
            const timeEl = document.getElementById(`time-val-${idx}`);
            const eleEl = document.getElementById(`ele-val-${idx}`);

            const kmFinal = tappaData.km > 0 ? tappaData.km : stats.km;
            if (kmEl) kmEl.innerText = `${kmFinal} km`;
            if (timeEl) {
              const h = Math.floor(stats.timeMin / 60);
              const m = stats.timeMin % 60;
              timeEl.innerText = `${h}h ${m}m`;
            }
            if (eleEl) eleEl.innerText = `${stats.maxEle} m`;

            totalTripKm += kmFinal;
            totalKmHeader.innerText = `Totale: ${totalTripKm} km`;
          }

          // METEO ROTTA A PASSI DI 45 MIN
          const wCont = document.getElementById(`weather-timeline-${idx}`);
          if (!wCont) return;

          let stepsHtml = "";
          for (const item of locList) {
            const totMin = bH * 60 + bM + item.delta;
            const h = Math.floor(totMin / 60) % 24;
            const m = totMin % 60;
            const timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

            const coords = await geocode(item.name);
            let w = { icon: "🌤️", temp: "--", rain: 0 };
            if (coords) w = await getPointWeather(coords.lat, coords.lon, h);

            stepsHtml += `
              <div class="weather-cell">
                <div class="w-time">${timeStr}</div>
                <div class="w-icon">${w.icon}</div>
                <div class="w-temp">${w.temp}°C</div>
                <div class="w-rain">💧${w.rain}%</div>
                <div class="w-name">${item.name}</div>
              </div>
            `;
          }
          wCont.innerHTML = stepsHtml || `<div style="font-size:11px; color:#64748b;">Meteo non disponibile</div>`;
        })(i, t, baseOra, baseMin);
      }
    }

    // ELIMINAZIONE TAPPA TRAMITE SWIPE
    async function eliminaTappa(index, tappa) {
      if (!confirm(`Vuoi davvero eliminare la Tappa #${index + 1} (${tappa.partenza} ➔ ${tappa.arrivo})?`)) {
        renderRoadbook(JSON.parse(localStorage.getItem(`djRoute_tappe_${activeTourId}`) || "[]"));
        return;
      }

      const storageKey = `djRoute_tappe_${activeTourId}`;
      let tappe = JSON.parse(localStorage.getItem(storageKey) || "[]");
      tappe.splice(index, 1);
      localStorage.setItem(storageKey, JSON.stringify(tappe));
      renderRoadbook(tappe);

      // Eliminazione remota sul foglio Google
      const tour = getActiveTour();
      try {
        await fetch(tour.url, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "delete", rowId: tappa.id })
        });
      } catch (e) {
        console.warn("Cancellazione cloud differita");
      }
    }

    // GESTIONE MODALE AGGIUNGI TAPPA
    function apriModaleNuovaTappa() {
      const storageKey = `djRoute_tappe_${activeTourId}`;
      const cached = localStorage.getItem(storageKey);
      if (cached) {
        try {
          const tappe = JSON.parse(cached);
          if (tappe.length > 0) {
            const ultima = tappe[tappe.length - 1];
            if (ultima.arrivo) document.getElementById("inpPartenza").value = ultima.arrivo;
          }
        } catch(e) {}
      }
      document.getElementById("modalTappa").style.display = "block";
    }

    function chiudiModaleNuovaTappa() {
      document.getElementById("modalTappa").style.display = "none";
    }

    async function salvaNuovaTappa() {
      const dataStr = document.getElementById("inpData").value.trim();
      const partenza = document.getElementById("inpPartenza").value.trim();
      const arrivo = document.getElementById("inpArrivo").value.trim();

      if (!partenza || !arrivo) {
        alert("Inserisci almeno Partenza e Arrivo!");
        return;
      }

      const nuovaTappa = {
        data: dataStr || "Data N/D",
        ora: document.getElementById("inpOra").value || "08:30",
        partenza: partenza,
        passaggio: document.getElementById("inpPassaggio").value.trim(),
        arrivo: arrivo,
        km: 0,
        tempMedie: "",
        alloggio: document.getElementById("inpAlloggio").value.trim(),
        piattaforma: "",
        spesa: parseFloat(document.getElementById("inpSpesa").value) || 0,
        pagamento: "Da pagare",
        pagato: 0,
        daPagare: parseFloat(document.getElementById("inpSpesa").value) || 0,
        metodoPagamento: "",
        parcheggio: "",
        note: document.getElementById("inpNote").value.trim(),
        myRouteUrl: document.getElementById("inpMyRoute").value.trim()
      };

      const storageKey = `djRoute_tappe_${activeTourId}`;
      let tappe = JSON.parse(localStorage.getItem(storageKey) || "[]");
      tappe.push(nuovaTappa);
      localStorage.setItem(storageKey, JSON.stringify(tappe));
      chiudiModaleNuovaTappa();
      renderRoadbook(tappe);

      const tour = getActiveTour();
      try {
        await fetch(tour.url, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(nuovaTappa)
        });
      } catch (err) {
        console.warn("Invio foglio differito:", err);
      }
    }
  </script>
