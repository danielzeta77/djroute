<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>djRoute MASTER</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a29;
      --card-alt: #0e1420;
      --cyan: #00e5ff;
      --green: #10b981;
      --orange: #f59e0b;
      --red: #f43f5e;
      --blue: #2563eb;
      --border: #233047;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: 12px;
      padding-bottom: 100px;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER PULITO CON TASTI GEMELLI PROPORZIONATI */
    header {
      background: linear-gradient(145deg, #162032, #0d131f);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #1a2438;
      color: var(--cyan);
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
    }
    .icon-btn:active {
      transform: scale(0.93);
      background: #24324d;
    }
    .icon-btn.sync-btn {
      background: linear-gradient(135deg, #059669, #10b981);
      border-color: #34d399;
      color: #fff;
    }
    .logo {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--cyan);
      letter-spacing: 0.8px;
      text-align: center;
    }
    .logo span { color: #fff; }

    /* VISTA HOME: SOLO SCHEDE VIAGGI E CREA NUOVO */
    #vistaHome { display: block; }
    .home-header-label {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .trips-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .trip-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      transition: border-color 0.2s, transform 0.15s;
    }
    .trip-item:active {
      transform: scale(0.98);
      border-color: var(--cyan);
    }
    .trip-item-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .trip-item-arrow {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--cyan);
      background: rgba(0, 229, 255, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 229, 255, 0.3);
    }
    .btn-create-sheet {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      background: rgba(0, 229, 255, 0.06);
      border: 1px dashed var(--cyan);
      border-radius: 14px;
      color: var(--cyan);
      font-family: 'Chakra Petch', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    .btn-create-sheet:active { background: rgba(0, 229, 255, 0.15); }

    /* VISTA DETTAGLIO VIAGGIO */
    #vistaViaggio { display: none; }
    .trip-banner {
      background: #0f1624;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .trip-banner-name {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--cyan);
    }
    .trip-banner-stats {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    /* CARD TAPPA */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    .card-head {
      background: #0f1624;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .card-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: var(--cyan);
    }
    .card-date {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 12px;
      font-weight: 700;
      background: #1e293b;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      color: #fff;
      margin-left: 8px;
    }
    .card-actions { display: flex; gap: 6px; }
    .btn-card {
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
    }
    .btn-edit { background: #1e3a8a; color: #93c5fd; border: 1px solid #3b82f6; }
    .btn-del { background: rgba(244,63,94,0.2); color: #fca5a5; border: 1px solid #f43f5e; }

    .card-body { padding: 14px; }

    /* TIMELINE PERCORSO */
    .route-box {
      border-left: 2px solid #334155;
      margin-left: 8px;
      padding-left: 16px;
      margin-bottom: 14px;
    }
    .route-point { position: relative; margin-bottom: 10px; }
    .route-point:last-child { margin-bottom: 0; }
    .route-point::before {
      content: '';
      position: absolute;
      left: -22px;
      top: 5px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #475569;
    }
    .route-point.dep::before { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .route-point.arr::before { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .route-point.via::before { background: var(--orange); }
    .point-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .point-city { font-size: 16px; font-weight: 700; color: #fff; }

    /* CRUSCOTTO TELEMETRIA & TEMPERATURE STORICHE */
    .road-telemetry {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1.3fr;
      gap: 6px;
      margin-bottom: 10px;
      background: #0d1422;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    .tele-item { text-align: center; display: flex; flex-direction: column; justify-content: center; }
    .tele-item:not(:last-child) { border-right: 1px solid #1e2a3f; }
    .tele-label { font-size: 9px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
    .tele-val { font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 800; color: var(--cyan); }
    
    .temp-hot { color: #f43f5e !important; text-shadow: 0 0 8px rgba(244,63,94,0.4); }
    .temp-cold { color: #38bdf8 !important; text-shadow: 0 0 8px rgba(56,189,248,0.4); }
    .temp-mild { color: #10b981 !important; }

    /* TASTO E PANNELLO PROFILO ALTIMETRICO */
    .btn-elevation {
      width: 100%;
      background: #141e30;
      border: 1px solid #283a56;
      color: var(--cyan);
      padding: 8px;
      border-radius: 8px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .ele-box {
      display: none;
      background: #0a0f18;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    /* ALLOGGIO, PAGAMENTI, ACCONTI */
    .grid-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .grid-info div span { display: block; font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .grid-info div strong { color: #f1f5f9; font-size: 13px; }

    /* METEO 45 MIN */
    .weather-box {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .weather-head {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .weather-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .weather-cell {
      flex: 0 0 auto;
      background: #141c2c;
      border: 1px solid #233147;
      border-radius: 8px;
      padding: 6px 10px;
      text-align: center;
      min-width: 82px;
    }
    .w-time { font-family: 'Chakra Petch', sans-serif; font-size: 11px; color: var(--orange); font-weight: 700; }
    .w-icon { font-size: 18px; margin: 2px 0; }
    .w-temp { font-size: 14px; font-weight: 800; color: #fff; }
    .w-rain { font-size: 10px; color: #60a5fa; }
    .w-name { font-size: 10px; color: var(--text-muted); max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btn-myroute {
      display: block;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      color: #fff;
      text-align: center;
      border-radius: 8px;
      text-decoration: none;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 13px;
      font-weight: 800;
      border: 1px solid #60a5fa;
    }

    /* TASTO FLUTTUANTE NUOVA TAPPA (NASCOSTO IN HOME) */
    .fab-btn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #0284c7, #00e5ff);
      color: #04101e;
      border: none;
      padding: 14px 20px;
      border-radius: 30px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4);
      cursor: pointer;
      z-index: 99;
    }

    /* MODALE COMPLETO CON AUTOCOMPLETE E FINANZA */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      padding: 14px;
      overflow-y: auto;
    }
    .modal-box {
      background: #141c2b;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      max-width: 480px;
      margin: 10px auto 30px auto;
    }
    .modal-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 17px;
      font-weight: 800;
      color: var(--cyan);
      margin-bottom: 12px;
    }
    .form-group { margin-bottom: 10px; position: relative; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    .form-group label { display: block; font-size: 10px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
    }
    .suggest-list {
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: #1b263b;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      z-index: 150;
      max-height: 160px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    }
    .suggest-item {
      padding: 9px 12px;
      font-size: 13px;
      color: #e2e8f0;
      border-bottom: 1px solid #24324d;
      cursor: pointer;
    }
    .suggest-item:active, .suggest-item:hover { background: #2563eb; color: #fff; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-save { flex: 1; background: var(--green); color: #fff; border: none; padding: 12px; border-radius: 8px; font-family: 'Chakra Petch', sans-serif; font-weight: 800; cursor: pointer; }
    .btn-cancel { flex: 1; background: #334155; color: #fff; border: none; padding: 12px; border-radius: 8px; font-family: 'Chakra Petch', sans-serif; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <!-- HEADER ESSENZIALE: SOLO HOME, TITOLO E AGGIORNA PROPORZIONATI -->
  <header>
    <div class="header-bar">
      <button class="icon-btn" onclick="mostraHome()" title="Home Viaggi">🏠</button>
      <div class="logo">djRoute <span>MASTER</span></div>
      <button class="icon-btn sync-btn" id="btnSync" onclick="sincronizzaVistaAttiva()" title="Aggiorna">🔄</button>
    </div>
  </header>

  <!-- VISTA 1: HOME (SOLO SCHEDE VIAGGI ATTIVE E TASTO CREA NUOVO) -->
  <main id="vistaHome">
    <div class="home-header-label">📁 Schede Viaggi Attive</div>
    <div class="trips-list" id="listaSchedeViaggi">
      <div style="text-align:center; padding:30px; color:var(--text-muted);">Caricamento schede viaggio...</div>
    </div>
    <button class="btn-create-sheet" onclick="creaNuovoFoglioViaggio()">+ CREA NUOVO FOGLIO DI VIAGGIO</button>
  </main>

  <!-- VISTA 2: DETTAGLIO DEL VIAGGIO SELEZIONATO -->
  <main id="vistaViaggio">
    <div class="trip-banner">
      <div class="trip-banner-name" id="nomeViaggioAttivo">Viaggio</div>
      <div class="trip-banner-stats" id="riepilogoKmViaggio">0 tappe • 0 km</div>
    </div>

    <div id="contenitoreTappe"></div>
  </main>

  <!-- PULSANTE NUOVA TAPPA (VISIBILE SOLO DENTRO UN VIAGGIO) -->
  <button class="fab-btn" id="fabNuovaTappa" onclick="apriModaleNuovaTappa()">➕ NUOVA TAPPA</button>

  <!-- MODALE CREA / MODIFICA TAPPA COMPLETO -->
  <div id="modalTappa" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">🏍️ Nuova Tappa</div>
      <input type="hidden" id="editRowId" value="">
      <input type="hidden" id="editKm" value="0">
      <input type="hidden" id="editTempMedie" value="">

      <div class="form-row">
        <div class="form-group">
          <label>Data (GG/MM/AAAA)</label>
          <input type="text" id="inpData" placeholder="17/10/2026" maxlength="10">
        </div>
        <div class="form-group">
          <label>Ora Partenza</label>
          <input type="time" id="inpOra" value="08:30">
        </div>
      </div>

      <div class="form-group">
        <label>Città di Partenza (Autocompletamento Mappe)</label>
        <input type="text" id="inpPartenza" placeholder="Digita città..." autocomplete="off">
        <div id="sugPartenza" class="suggest-list"></div>
      </div>

      <div class="form-group">
        <label>Passaggi / Valichi Intermedi (separati da virgola)</label>
        <input type="text" id="inpPassaggio" placeholder="es. Passo Tonale, Edolo" autocomplete="off">
        <div id="sugPassaggio" class="suggest-list"></div>
      </div>

      <div class="form-group">
        <label>Città di Arrivo (Autocompletamento Mappe)</label>
        <input type="text" id="inpArrivo" placeholder="Digita città..." autocomplete="off">
        <div id="sugArrivo" class="suggest-list"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Alloggio / Struttura</label>
          <input type="text" id="inpAlloggio" placeholder="es. Hotel Mantova">
        </div>
        <div class="form-group">
          <label>Piattaforma</label>
          <select id="inpPiattaforma">
            <option value="">-- Seleziona --</option>
            <option value="Booking">Booking</option>
            <option value="Airbnb">Airbnb</option>
            <option value="Expedia">Expedia</option>
            <option value="Pren. Diretta">Pren. Diretta</option>
            <option value="Tenda / Libero">Tenda / Libero</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Spesa Totale (€)</label>
          <input type="number" id="inpSpesa" placeholder="0" oninput="aggiornaCalcoloPagamenti()">
        </div>
        <div class="form-group">
          <label>Stato Pagamento</label>
          <select id="inpPagamento" onchange="aggiornaCalcoloPagamenti()">
            <option value="Da pagare">Da pagare</option>
            <option value="Acconto">Acconto</option>
            <option value="Pagato">Pagato</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Importo Pagato / Acconto (€)</label>
          <input type="number" id="inpPagato" placeholder="0" oninput="aggiornaCalcoloPagamenti()">
        </div>
        <div class="form-group">
          <label>Residuo Da Pagare (€)</label>
          <input type="number" id="inpDaPagare" placeholder="0" readonly style="background:#161f30; color:var(--cyan); font-weight:700;">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Metodo di Pagamento</label>
          <input type="text" id="inpMetodo" placeholder="es. Revolut, N26, Contanti">
        </div>
        <div class="form-group">
          <label>Parcheggio Moto</label>
          <input type="text" id="inpParcheggio" placeholder="es. Garage coperto">
        </div>
      </div>

      <div class="form-group">
        <label>Link MyRoute-app / Traccia GPX</label>
        <input type="url" id="inpMyRoute" placeholder="https://www.myrouteapp.com/...">
      </div>

      <div class="form-group">
        <label>Note Tappa</label>
        <input type="text" id="inpNote" placeholder="es. Visita monasteri, imbarco...">
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="chiudiModale()">ANNULLA</button>
        <button class="btn-save" id="btnSalvaTappa" onclick="salvaTappa()">💾 SALVA</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSg_iYdW33G7M2RDvckqApsOKZC614zho4-qTsk0ow_Bx3EmrN_kVusQIPyr8qeEC-5w/exec";
    
    let schedeViaggi = [];
    let schedaAttiva = "";
    let tappeCorrenti = [];
    const GEO_CACHE = {};
    const ROUTE_CACHE = {};

    window.addEventListener("DOMContentLoaded", () => {
      mostraHome();
    });

    // FORMATTAZIONE DATA AUTOMATICA GG/MM/AAAA
    document.getElementById("inpData").addEventListener("input", (e) => {
      let v = e.target.value.replace(/\D/g, "");
      if (v.length > 2 && v.length <= 4) e.target.value = v.slice(0,2) + "/" + v.slice(2);
      else if (v.length > 4) e.target.value = v.slice(0,2) + "/" + v.slice(2,4) + "/" + v.slice(4,8);
    });

    // CALCOLO AUTOMATICO ACCONTO / PAGATO / DA PAGARE NEL MODALE
    function aggiornaCalcoloPagamenti() {
      const spesa = parseFloat(document.getElementById("inpSpesa").value) || 0;
      const stato = document.getElementById("inpPagamento").value;
      const inpPagato = document.getElementById("inpPagato");
      const inpDaPagare = document.getElementById("inpDaPagare");

      if (stato === "Pagato") {
        inpPagato.value = spesa;
        inpDaPagare.value = 0;
      } else if (stato === "Da pagare") {
        inpPagato.value = 0;
        inpDaPagare.value = spesa;
      } else {
        const pagato = parseFloat(inpPagato.value) || 0;
        inpDaPagare.value = Math.max(0, Math.round((spesa - pagato) * 100) / 100);
      }
    }

    // AUTOCOMPLETAMENTO CITTA TRAMITE MAPPE OPENSTREETMAP
    function attivaAutocompleteMappa(inputId, boxId, multiplo = false) {
      const inp = document.getElementById(inputId);
      const box = document.getElementById(boxId);
      let timer = null;

      inp.addEventListener("input", () => {
        clearTimeout(timer);
        let raw = inp.value;
        let query = multiplo ? raw.split(",").pop().trim() : raw.trim();
        if (query.length < 3) { box.style.display = "none"; return; }

        timer = setTimeout(async () => {
          try {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&accept-language=it`;
            const res = await fetch(url);
            const list = await res.json();
            if (!list || list.length === 0) { box.style.display = "none"; return; }

            box.innerHTML = "";
            list.forEach(item => {

    // DISEGNA IL PROFILO ALTIMETRICO SVG
    function generaSvgAltimetria(puntiQuote) {
      if (!puntiQuote || puntiQuote.length < 2) return `<div style="font-size:11px; color:var(--text-muted);">Dati altimetrici non sufficienti</div>`;
      const W = 320, H = 95;
      const maxE = Math.max(...puntiQuote.map(p => p.ele), 100);
      const stepX = (W - 40) / (puntiQuote.length - 1);

      const coords = puntiQuote.map((p, idx) => {
        const x = 20 + idx * stepX;
        const y = H - 22 - ((p.ele / maxE) * (H - 42));
        return { x, y, ele: p.ele, name: p.name };
      });

      const polyPoints = `${coords[0].x},${H-20} ` + coords.map(c => `${c.x},${c.y}`).join(" ") + ` ${coords[coords.length-1].x},${H-20}`;
      const linePoints = coords.map(c => `${c.x},${c.y}`).join(" ");

      let dotsHtml = "";
      coords.forEach(c => {
        dotsHtml += `
          <circle cx="${c.x}" cy="${c.y}" r="3.5" fill="#00e5ff" />
          <text x="${c.x}" y="${c.y - 6}" fill="#fff" font-size="9" font-family="Chakra Petch" font-weight="700" text-anchor="middle">${c.ele}m</text>
          <text x="${c.x}" y="${H - 6}" fill="#94a3b8" font-size="8" text-anchor="middle">${c.name.slice(0,9)}</text>
        `;
      });

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">
          <polygon points="${polyPoints}" fill="rgba(0, 229, 255, 0.15)" />
          <polyline points="${linePoints}" fill="none" stroke="#00e5ff" stroke-width="2" />
          ${dotsHtml}
        </svg>
      `;
    }

    async function calcolaTelemetriaCard(idx, t, bH, bM) {
      const locs = [];
      if (t.partenza) locs.push({ name: t.partenza, delta: 0 });
      if (t.passaggio) {
        t.passaggio.split(",").forEach((p, pIdx) => {
          if (p.trim()) locs.push({ name: p.trim(), delta: (pIdx + 1) * 45 });
        });
      }
      if (t.arrivo) {
        const lastDelta = locs.length > 1 ? locs[locs.length - 1].delta + 45 : 90;
        locs.push({ name: t.arrivo, delta: lastDelta });
      }

      const coords = [];
      for (const item of locs) {
        const c = await geocode(item.name);
        if (c) coords.push({ ...c, name: item.name, delta: item.delta });
      }

      if (coords.length >= 2) {
        const stats = await getRouteAndElevation(coords);
        const kmEl = document.getElementById(`km-val-${idx}`);
        const timeEl = document.getElementById(`time-val-${idx}`);
        const eleEl = document.getElementById(`ele-val-${idx}`);
        const eleBox = document.getElementById(`ele-box-${idx}`);

        const kmToShow = t.km > 0 ? t.km : stats.km;
        if (kmEl) kmEl.innerText = `${Math.round(kmToShow)} km`;
        if (timeEl) timeEl.innerText = `${Math.floor(stats.timeMin/60)}h ${stats.timeMin%60}m`;
        if (eleEl) eleEl.innerText = `${stats.maxEle} m`;
        if (eleBox) eleBox.innerHTML = generaSvgAltimetria(stats.puntiQuote);

        // Se manca la Temp Media storica nel foglio, la calcola al volo
        const tempEl = document.getElementById(`temp-val-${idx}`);
        if ((!t.tempMedie || t.tempMedie === "") && tempEl) {
          const dest = coords[coords.length - 1];
          const tStorica = await getHistoricalTemp(dest.lat, dest.lon, t.data);
          if (tStorica) {
            tempEl.innerText = tStorica;
            tempEl.className = "tele-val " + getTempColorClass(tStorica);
          }
        }
      }

      // Popola Meteo Rotta 45 min
      const wLine = document.getElementById(`weather-line-${idx}`);
      if (!wLine) return;
      let wHtml = "";
      for (const c of coords) {
        const totMin = bH * 60 + bM + c.delta;
        const h = Math.floor(totMin / 60) % 24;
        const m = totMin % 60;
        const timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        const w = await getPointWeather(c.lat, c.lon, h);
        wHtml += `
          <div class="weather-cell">
            <div class="w-time">${timeStr}</div>
            <div class="w-icon">${w.icon}</div>
            <div class="w-temp">${w.temp}°C</div>
            <div class="w-rain">💧${w.rain}%</div>
            <div class="w-name">${c.name}</div>
          </div>
        `;
      }
      if (wHtml) wLine.innerHTML = wHtml;
    }

    async function geocode(loc) {
      if (!loc) return null;
      const k = loc.trim().toLowerCase();
      if (GEO_CACHE[k]) return GEO_CACHE[k];
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(loc)}&limit=1`);
        const d = await r.json();
        if (d && d.length > 0) {
          const c = { lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon) };
          GEO_CACHE[k] = c;
          return c;
        }
      } catch(e){}
      return null;
    }

    async function getRouteAndElevation(coords) {
      const coordStr = coords.map(p => `${p.lon},${p.lat}`).join(";");
      if (ROUTE_CACHE[coordStr]) return ROUTE_CACHE[coordStr];
      try {
        const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=false`);
        const data = await res.json();
        let km = 0, timeMin = 0;
        if (data.routes && data.routes.length > 0) {
          km = Math.round(data.routes[0].distance / 1000);
          timeMin = Math.round(data.routes[0].duration / 60);
        }

        const lats = coords.map(p => p.lat).join(",");
        const lons = coords.map(p => p.lon).join(",");
        const eleRes = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lons}`);
        const eleData = await eleRes.json();
        let maxEle = 0;
        const puntiQuote = [];
        if (eleData && eleData.elevation) {
          maxEle = Math.round(Math.max(...eleData.elevation));
          coords.forEach((c, idx) => {
            puntiQuote.push({ name: c.name, ele: Math.round(eleData.elevation[idx] || 0) });
          });
        }

        const out = { km, timeMin, maxEle, puntiQuote };
        ROUTE_CACHE[coordStr] = out;
        return out;
      } catch(e){
        return { km: 0, timeMin: 0, maxEle: 0, puntiQuote: [] };
      }
    }

    async function getHistoricalTemp(lat, lon, dataStr) {
      try {
        let m = "05", d = "15";
        if (dataStr && dataStr.includes("/")) {
          const parts = dataStr.split("/");
          d = String(parts[0]).padStart(2, "0");
          m = String(parts[1]).padStart(2, "0");
        }
        const refDate = `2024-${m}-${d}`;
        const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${refDate}&end_date=${refDate}&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
        const res = await fetch(url);
        const j = await res.json();
        if (j && j.daily && j.daily.temperature_2m_min) {
          return `${Math.round(j.daily.temperature_2m_min[0])}° / ${Math.round(j.daily.temperature_2m_max[0])}°`;
        }
      } catch(e){}
      return "";
    }

    async function getPointWeather(lat, lon, h) {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,weather_code&timezone=auto`);
        const d = await res.json();
        if (d && d.hourly) {
          return {
            temp: Math.round(d.hourly.temperature_2m[h] || 20),
            rain: d.hourly.precipitation_probability[h] || 0,
            icon: d.hourly.weather_code[h] > 50 ? "🌧️" : "🌤️"
          };
        }
      } catch(e){}
      return { temp: "--", rain: 0, icon: "🌤️" };
    }

    // SALVA TAPPA CON CALCOLO AUTOMATICO KM E TEMPERATURE PRIMA DI INVIARE AL FOGLIO
    async function salvaTappa() {
      const dep = document.getElementById("inpPartenza").value.trim();
      const via = document.getElementById("inpPassaggio").value.trim();
      const arr = document.getElementById("inpArrivo").value.trim();
      const dataStr = document.getElementById("inpData").value.trim();
      const rowId = document.getElementById("editRowId").value;

      if (!dep || !arr) {
        alert("Inserisci Città di Partenza e Arrivo!");
        return;
      }

      const btn = document.getElementById("btnSalvaTappa");
      btn.innerText = "⏳ CALCOLO E SALVO...";
      btn.disabled = true;

      // Calcola automaticamente KM e Temp Medie da salvare anche sul foglio Excel
      let kmCalc = parseFloat(document.getElementById("editKm").value) || 0;
      let tempCalc = document.getElementById("editTempMedie").value || "";

      try {
        const nomi = [dep];
        if (via) via.split(",").forEach(p => { if (p.trim()) nomi.push(p.trim()); });
        nomi.push(arr);

        const pts = [];
        for (const n of nomi) {
          const c = await geocode(n);
          if (c) pts.push({ ...c, name: n });
        }
        if (pts.length >= 2) {
          const st = await getRouteAndElevation(pts);
          if (st.km > 0) kmCalc = st.km;
          const dest = pts[pts.length - 1];
          const tSt = await getHistoricalTemp(dest.lat, dest.lon, dataStr);
          if (tSt) tempCalc = tSt;
        }
      } catch (e) {}

      const spesa = parseFloat(document.getElementById("inpSpesa").value) || 0;
      const pagato = parseFloat(document.getElementById("inpPagato").value) || 0;
      const daPagare = parseFloat(document.getElementById("inpDaPagare").value) || 0;

      const payload = {
        sheetName: schedaAttiva,
        action: rowId ? "update" : "create",
        rowId: rowId || undefined,
        data: dataStr,
        ora: document.getElementById("inpOra").value || "08:30",
        partenza: dep,
        passaggio: via,
        arrivo: arr,
        km: kmCalc,
        tempMedie: tempCalc,
        alloggio: document.getElementById("inpAlloggio").value.trim(),
        piattaforma: document.getElementById("inpPiattaforma").value,
        spesa: spesa,
        pagamento: document.getElementById("inpPagamento").value,
        pagato: pagato,
        daPagare: daPagare,
        metodoPagamento: document.getElementById("inpMetodo").value.trim(),
        parcheggio: document.getElementById("inpParcheggio").value.trim(),
        note: document.getElementById("inpNote").value.trim(),
        myRouteUrl: document.getElementById("inpMyRoute").value.trim()
      };

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      btn.innerText = "💾 SALVA";
      btn.disabled = false;
      chiudiModale();
      setTimeout(() => apriSchedaViaggio(schedaAttiva), 1100);
    }
  </script>
</body>
</html>
