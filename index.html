<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>djRoutePlanner - Roadbook & Live Weather</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="djRoute">
  <meta name="theme-color" content="#0b0f17">
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS per importazione Excel universale -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <!-- Chart.js per profilo altimetrico -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { 
      background-color: #0b0f17; 
      color: #f0f6fc; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Protezione per Dynamic Island e Notch su iPhone */
    .safe-top-header {
      padding-top: max(env(safe-area-inset-top), 24px);
    }

    /* Sfondo Cinematografico con animazione Ken Burns */
    .bg-cinema-wrap {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -2;
      overflow: hidden;
      background: #090d14;
    }
    .bg-cinema {
      position: absolute;
      top: -10%; left: -10%; width: 120%; height: 120%;
      background: url('https://images.unsplash.com/photo-1558981806-ec527fa84c39?q=80&w=1920&auto=format&fit=crop') center center / cover no-repeat;
      animation: kenburns 35s ease-in-out infinite alternate;
      filter: brightness(0.28) contrast(1.15) saturate(1.1);
    }
    @keyframes kenburns {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.08) translate(-1.5%, -1%); }
      100% { transform: scale(1.15) translate(1.5%, 1.5%); }
    }
    .cinema-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(180deg, rgba(11,15,23,0.85) 0%, rgba(11,15,23,0.92) 50%, rgba(11,15,23,0.98) 100%);
      z-index: -1;
      pointer-events: none;
    }

    .glass-card {
      background: rgba(22, 27, 34, 0.90);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .scroll-hide::-webkit-scrollbar { display: none; }
    .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* Tendina suggerimenti autocompletamento città */
    .autocomplete-dropdown {
      position: absolute;
      left: 0; right: 0; top: 100%;
      z-index: 60;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 0.75rem;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 4px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .autocomplete-item {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 1px solid #21262d;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover, .autocomplete-item:active {
      background: #21262d;
      color: #f59e0b;
    }
  </style>
</head>
<body class="pb-24 min-h-screen relative select-none">

  <!-- Sfondo Cinematografico -->
  <div class="bg-cinema-wrap">
    <div class="bg-cinema"></div>
  </div>
  <div class="cinema-overlay"></div>

  <!-- Header Abbassato per Dynamic Island su iPhone -->
  <header class="sticky top-0 z-40 bg-[#0f141c]/95 backdrop-blur-md border-b border-gray-800/80 px-3.5 pb-2.5 safe-top-header flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-2 pt-1">
      <!-- Tasto Indietro -->
      <button onclick="navigaIndietro()" id="btnNavPrev" class="w-9 h-9 rounded-xl bg-gray-800/90 border border-gray-700 hover:bg-gray-700 text-gray-200 flex items-center justify-center active:scale-95 transition-all shadow" title="Indietro">
        <i class="fa-solid fa-chevron-left text-xs"></i>
      </button>
      <!-- Tasto Home -->
      <button onclick="vaiAllaHome()" class="w-9 h-9 rounded-xl bg-gray-800/90 border border-gray-700 hover:bg-gray-700 text-amber-400 flex items-center justify-center active:scale-95 transition-all shadow" title="Torna all'Elenco">
        <i class="fa-solid fa-house text-xs"></i>
      </button>
      <!-- Tasto Avanti -->
      <button onclick="navigaAvanti()" id="btnNavNext" class="w-9 h-9 rounded-xl bg-gray-800/90 border border-gray-700 hover:bg-gray-700 text-gray-200 flex items-center justify-center active:scale-95 transition-all shadow" title="Avanti">
        <i class="fa-solid fa-chevron-right text-xs"></i>
      </button>
    </div>

    <!-- Titolo & Icona Moto Originale -->
    <div class="flex items-center space-x-2 truncate mx-2 pt-1 cursor-pointer" onclick="vaiAllaHome()">
      <i class="fa-solid fa-motorcycle text-amber-500 text-xl flex-shrink-0"></i>
      <div class="truncate text-center">
        <h1 class="font-bold text-sm tracking-wide text-white leading-tight">djRoutePlanner</h1>
        <p class="text-[9px] text-amber-400 font-medium" id="headerSubtitle">Dashboard Roadbook</p>
      </div>
    </div>

    <!-- Indicatore GPS -->
    <div class="flex items-center pt-1">
      <button onclick="attivaGps()" class="px-2.5 py-1.5 rounded-xl bg-emerald-950/50 border border-emerald-500/40 text-[10px] text-emerald-400 font-mono flex items-center gap-1.5 active:scale-95 shadow">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> GPS
      </button>
    </div>
  </header>

  <!-- VISTA 1: DASHBOARD PRINCIPALE (ELENCO COMPATTO TAPPE) -->
  <section id="vistaDashboard" class="p-3 space-y-3.5 max-w-xl mx-auto">
    
    <!-- Tasti Grandi ed Evidenti: Excel e Tappa -->
    <div class="grid grid-cols-2 gap-2.5">
      <!-- Tasto Verde Importa Excel -->
      <label class="glass-card hover:bg-emerald-950/40 border border-emerald-500/40 p-3 rounded-2xl flex items-center space-x-3 cursor-pointer shadow-lg active:scale-95 transition-all">
        <div class="w-11 h-11 rounded-xl bg-emerald-500 flex items-center justify-center text-gray-950 font-bold text-xl shadow-md shadow-emerald-950/50 flex-shrink-0">
          <i class="fa-solid fa-file-excel"></i>
        </div>
        <div class="truncate">
          <span class="text-xs font-bold text-white block leading-tight">Importa Excel</span>
          <span class="text-[10px] text-emerald-400 truncate block">Carica file .xlsx</span>
        </div>
        <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" class="hidden" onchange="importaQualsiasiExcel(event)">
      </label>

      <!-- Tasto Giallo Nuova Tappa -->
      <button onclick="apriModalNuovaTappa()" class="glass-card hover:bg-amber-950/40 border border-amber-500/40 p-3 rounded-2xl flex items-center space-x-3 shadow-lg active:scale-95 transition-all text-left">
        <div class="w-11 h-11 rounded-xl bg-amber-400 flex items-center justify-center text-gray-950 font-bold text-xl shadow-md shadow-amber-950/50 flex-shrink-0">
          <i class="fa-solid fa-plus"></i>
        </div>
        <div class="truncate">
          <span class="text-xs font-bold text-white block leading-tight">Aggiungi Tappa</span>
          <span class="text-[10px] text-amber-400 truncate block">Crea manuale</span>
        </div>
      </button>
    </div>

    <!-- Barra Riepilogo Viaggio -->
    <div id="boxRiepilogoViaggio" class="glass-card rounded-2xl p-3 flex justify-between items-center text-xs text-gray-300">
      <div>
        <span class="text-[10px] text-gray-400 uppercase tracking-wider block">Tappe</span>
        <strong id="totTappeVal" class="text-white text-sm">0</strong>
      </div>
      <div>
        <span class="text-[10px] text-gray-400 uppercase tracking-wider block">Distanza Tot.</span>
        <strong id="totKmVal" class="text-amber-400 text-sm">0 km</strong>
      </div>
      <div>
        <span class="text-[10px] text-gray-400 uppercase tracking-wider block">Tempo Guida</span>
        <strong id="totOreVal" class="text-sky-300 text-sm">0h 0m</strong>
      </div>
    </div>

    <!-- Elenco Tappe -->
    <div id="listaTappeContainer" class="space-y-2.5">
      <!-- Generato dinamicamente via JS -->
    </div>
  </section>

  <!-- VISTA 2: SCHEDA DETTAGLIO TAPPA SINGOLA -->
  <section id="vistaDettaglio" class="p-3 max-w-xl mx-auto hidden space-y-3.5">
    <div id="schedaDettaglioContainer">
      <!-- Generato dinamicamente per la tappa selezionata -->
    </div>
  </section>

  <!-- MODAL GRAFICO QUOTE ALTIMETRICO -->
  <div id="modalGraficoQuote" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-3">
    <div class="glass-card w-full max-w-lg rounded-2xl p-4 space-y-3">
      <div class="flex justify-between items-center border-b border-gray-800 pb-2">
        <h3 class="font-bold text-xs sm:text-sm text-white flex items-center gap-2">
          <i class="fa-solid fa-mountain text-amber-400"></i> Profilo Altimetrico della Tratta
        </h3>
        <button onclick="chiudiGraficoQuote()" class="text-gray-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>

      <div class="w-full h-56 sm:h-64 relative">
        <canvas id="chartQuoteCanvas"></canvas>
      </div>
      <p id="infoAltMax" class="text-[11px] text-center text-amber-400 font-mono"></p>
    </div>
  </div>

  <!-- MODAL NUOVA / MODIFICA TAPPA -->
  <div id="tappaModal" class="fixed inset-0 bg-black/85 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="glass-card w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-4 sm:p-5 max-h-[92vh] overflow-y-auto space-y-3.5">
      <div class="flex justify-between items-center border-b border-gray-800 pb-2">
        <h3 class="font-bold text-sm text-white flex items-center gap-2">
          <i class="fa-solid fa-route text-amber-500"></i> Scheda Tappa
        </h3>
        <button onclick="chiudiModalTappa()" class="text-gray-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <input type="hidden" id="m_editIndex" value="-1">

      <!-- DATA GG/MM/AAAA (Touch Target 44px) + GIORNO AUTO -->
      <div class="grid grid-cols-3 gap-2 text-xs">
        <div>
          <label class="block text-gray-400 mb-1 font-medium">Data (GG/MM/AAAA) *</label>
          <input type="text" id="m_data" placeholder="GG/MM/AAAA" maxlength="10" oninput="gestisciInputData(this)" 
                 class="w-full h-11 bg-gray-900 border border-gray-700 rounded-xl px-3 text-white font-mono text-xs focus:border-amber-400 outline-none">
        </div>
        <div>
          <label class="block text-gray-400 mb-1 font-medium">Giorno (Auto)</label>
          <input type="text" id="m_giorno" placeholder="Calcolato..." readonly 
                 class="w-full h-11 bg-gray-950 border border-gray-800 rounded-xl px-3 text-amber-400 font-bold capitalize text-xs">
        </div>
        <div>
          <label class="block text-amber-400 font-semibold mb-1">Ora Partenza</label>
          <input type="time" id="m_ora" value="08:30" 
                 class="w-full h-11 bg-gray-900 border border-amber-500/40 rounded-xl px-2 text-white font-bold text-xs focus:border-amber-400 outline-none">
        </div>
      </div>

      <!-- LOCALITÀ CON AUTOCOMPLETAMENTO E INTERMEDI MULTIPLI DINAMICI -->
      <div class="space-y-2.5 text-xs">
        <!-- Partenza con autocompletamento -->
        <div class="relative">
          <label class="block text-gray-300 font-medium mb-1">Luogo / Indirizzo di Partenza *</label>
          <input type="text" id="m_partenza" placeholder="es. Ancona Porto" autocomplete="off" oninput="cercaCittaLive(this, 'sugg_partenza')"
                 class="w-full h-11 bg-gray-900 border border-gray-700 rounded-xl px-3 text-white text-xs focus:border-amber-400 outline-none">
          <div id="sugg_partenza" class="autocomplete-dropdown hidden"></div>
        </div>

        <!-- Sezione Punti Intermedi Dinamici col tasto + -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label class="text-gray-300 font-medium">Passi / Punti Intermedi</label>
            <button type="button" onclick="aggiungiRigaIntermedio()" class="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[11px] font-bold flex items-center gap-1 active:scale-95">
              <i class="fa-solid fa-plus text-xs"></i> Aggiungi Intermedio
            </button>
          </div>
          <div id="containerIntermediDinamici" class="space-y-2">
            <!-- Righe intermedie inserite dinamicamente -->
          </div>
        </div>

        <!-- Destinazione Finale con autocompletamento -->
        <div class="relative">
          <label class="block text-gray-300 font-medium mb-1">Destinazione Finale (Arrivo) *</label>
          <input type="text" id="m_arrivo" placeholder="es. Kalambaka Meteora" autocomplete="off" oninput="cercaCittaLive(this, 'sugg_arrivo')"
                 class="w-full h-11 bg-gray-900 border border-gray-700 rounded-xl px-3 text-white text-xs focus:border-amber-400 outline-none">
          <div id="sugg_arrivo" class="autocomplete-dropdown hidden"></div>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 text-xs">
        <div>
          <label class="block text-gray-400 mb-1">Km Totali</label>
          <input type="number" id="m_km" placeholder="es. 250" class="w-full h-10 bg-gray-900 border border-gray-700 rounded-xl px-3 text-white text-xs">
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Ore Guida</label>
          <input type="text" id="m_ore" placeholder="es. 03:00" class="w-full h-10 bg-gray-900 border border-gray-700 rounded-xl px-3 text-white text-xs">
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Quota Max (m)</label>
          <input type="text" id="m_alt" placeholder="es. 1690 m" class="w-full h-10 bg-gray-900 border border-gray-700 rounded-xl px-3 text-white text-xs">
        </div>
      </div>

      <!-- SEZIONE ALLOGGIO -->
      <div class="border-t border-gray-800 pt-2.5 space-y-2 text-xs">
        <span class="text-[11px] font-bold text-amber-400 uppercase tracking-wider block">Alloggio & Parcheggio</span>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-400 mb-1">Nome Alloggio</label>
            <input type="text" id="m_hotel" placeholder="Nome Struttura" class="w-full h-10 bg-gray-900 border border-gray-700 rounded-xl px-3 text-white text-xs">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">Piattaforma</label>
            <input type="text" id="m_piattaforma" placeholder="Booking, Airbnb, Diretto" class="w-full h-10 bg-gray-900 border border-gray-700 rounded-xl px-3 text-white text-xs">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-400 mb-1">Prezzo Totale €</label>
            <input type="text" id="m_prezzo" placeholder="75 €" class="w-full h-10 bg-gray-900 border border-gray-700 rounded-xl px-3 text-white text-xs">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">Stato Pagamento</label>
            <select id="m_pagato" class="w-full h-10 bg-gray-900 border border-gray-700 rounded-xl px-3 text-white text-xs">
              <option value="Da pagare">Da pagare</option>
              <option value="Già pagato">Già pagato</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-emerald-400 font-semibold mb-1"><i class="fa-solid fa-square-parking mr-1"></i> Indicazioni Parcheggio Moto</label>
          <input type="text" id="m_parcheggio" placeholder="es. Cortile privato interno con cancello" class="w-full h-10 bg-gray-900 border border-emerald-600/40 rounded-xl px-3 text-white text-xs">
        </div>
      </div>

      <!-- MYROUTE-APP INTEGRAZIONE -->
      <div class="border-t border-gray-800 pt-2 space-y-1.5 text-xs">
        <label class="block text-orange-400 mb-1 font-semibold"><i class="fa-solid fa-route mr-1"></i> Link MyRoute-app</label>
        <input type="url" id="m_myroute" placeholder="https://www.myrouteapp.com/..." class="w-full h-10 bg-gray-900 border border-gray-700 rounded-xl px-3 text-white text-xs">
      </div>

      <div class="pt-2 flex gap-2">
        <button onclick="chiudiModalTappa()" class="w-1/2 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-xl text-xs font-semibold text-gray-300">Annulla</button>
        <button onclick="salvaTappaManuale()" class="w-1/2 py-2.5 bg-amber-500 hover:bg-amber-400 rounded-xl text-xs font-bold text-gray-950">Salva Tappa</button>
      </div>
    </div>
  </div>

  <script>
    let tappe = [];
    let vistaAttuale = "dashboard";
    let indexTappaAttiva = 0;
    let chartInstance = null;
    let debounceTimer = null;

    // FORMATTAZIONE DATA GG/MM/AAAA & AUTO-SEPARATORE /
    function gestisciInputData(input) {
      let v = input.value.replace(/\D/g, '');
      if (v.length > 2 && v.length <= 4) {
        v = v.substring(0, 2) + '/' + v.substring(2);
      } else if (v.length > 4) {
        v = v.substring(0, 2) + '/' + v.substring(2, 4) + '/' + v.substring(4, 8);
      }
      input.value = v;
      document.getElementById('m_giorno').value = calcolaGiornoDaData(v);
    }

    function formattaInGiornoMeseAnno(val) {
      if (!val) return "";
      if (val instanceof Date && !isNaN(val.getTime())) {
        const gg = String(val.getDate()).padStart(2, '0');
        const mm = String(val.getMonth() + 1).padStart(2, '0');
        const aaaa = val.getFullYear();
        return `${gg}/${mm}/${aaaa}`;
      }
      const str = String(val).trim();
      if (str.includes('/')) {
        const p = str.split('/');
        if (p.length === 3) return `${p[0].padStart(2, '0')}/${p[1].padStart(2, '0')}/${p[2]}`;
      }
      if (str.includes('-')) {
        const p = str.split('T')[0].split('-');
        if (p.length === 3) return `${p[2].padStart(2, '0')}/${p[1].padStart(2, '0')}/${p[0]}`;
      }
      return str;
    }

    function calcolaGiornoDaData(strData) {
      if (!strData || strData.length < 10) return "";
      const p = strData.split('/');
      if (p.length !== 3) return "";
      const gg = parseInt(p[0], 10);
      const mm = parseInt(p[1], 10) - 1;
      const aaaa = parseInt(p[2], 10);
      const d = new Date(aaaa, mm, gg);
      if (isNaN(d.getTime())) return "";
      const nomi = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
      return nomi[d.getDay()];
    }

    // AUTOCOMPLETAMENTO LIVE CITTÀ (OPEN-METEO GEOCODING)
    function cercaCittaLive(inputElem, dropId) {
      const q = inputElem.value.trim();
      const drop = document.getElementById(dropId);
      clearTimeout(debounceTimer);

      if (q.length < 2) {
        drop.classList.add('hidden');
        drop.innerHTML = '';
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=it&format=json`);
          const data = await res.json();
          if (data.results && data.results.length > 0) {
            drop.innerHTML = data.results.map(r => {
              const extra = [r.admin1, r.country].filter(Boolean).join(', ');
              return `
                <div class="autocomplete-item" onclick="selezionaCitta('${inputElem.id}', '${dropId}', '${r.name.replace(/'/g, "\\'")}', '${extra.replace(/'/g, "\\'")}')">
                  <span class="font-bold text-white">${r.name}</span>
                  <span class="text-[10px] text-gray-400 block">${extra}</span>
                </div>
              `;
            }).join('');
            drop.classList.remove('hidden');
          } else {
            drop.classList.add('hidden');
          }
        } catch(e) {
          drop.classList.add('hidden');
        }
      }, 250);
    }

    function selezionaCitta(inputId, dropId, nome, extra) {
      document.getElementById(inputId).value = `${nome} (${extra})`;
      document.getElementById(dropId).classList.add('hidden');
    }

    // GESTIONE PUNTI INTERMEDI DINAMICI MULTIPLI COL TASTO +
    function aggiungiRigaIntermedio(valore = "") {
      const container = document.getElementById('containerIntermediDinamici');
      const idx = container.children.length;
      const div = document.createElement('div');
      div.className = "flex items-center gap-1.5 relative";
      div.innerHTML = `
        <div class="relative flex-1">
          <input type="text" placeholder="Passo / Punto intermedio" value="${valore}" autocomplete="off"
                 oninput="cercaCittaLive(this, 'sugg_intermedio_${idx}')"
                 class="input-intermedio w-full h-10 bg-gray-900 border border-gray-700 rounded-xl px-3 text-white text-xs focus:border-amber-400 outline-none">
          <div id="sugg_intermedio_${idx}" class="autocomplete-dropdown hidden"></div>
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="w-9 h-9 rounded-xl bg-gray-800 text-rose-400 hover:bg-rose-950/40 border border-gray-700 flex items-center justify-center flex-shrink-0 active:scale-95" title="Rimuovi">
          <i class="fa-solid fa-trash-can text-xs"></i>
        </button>
      `;
      container.appendChild(div);
    }

    // MEMORIA LOCALE
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('djroute_v10_tappe');
      if (saved) {
        try { tappe = JSON.parse(saved); } catch(e) { tappe = []; }
      }
      aggiornaVista();
    });

    function salvaSuMemoria() {
      localStorage.setItem('djroute_v10_tappe', JSON.stringify(tappe));
      aggiornaRiepilogo();
    }

    function aggiornaRiepilogo() {
      document.getElementById('totTappeVal').textContent = tappe.length;
      let totKm = 0;
      let totMinuti = 0;

      tappe.forEach(t => {
        const km = parseFloat(t.kmTot) || 0;
        totKm += km;
        if (t.oreGuida && String(t.oreGuida).includes(':')) {
          const [h, m] = t.oreGuida.split(':').map(Number);
          totMinuti += (h * 60) + (m || 0);
        } else if (km > 0) {
          totMinuti += Math.round((km / 100) * 60);
        }
      });

      document.getElementById('totKmVal').textContent = Math.round(totKm) + " km";
      const ore = Math.floor(totMinuti / 60);
      const min = totMinuti % 60;
      document.getElementById('totOreVal').textContent = `${ore}h ${min}m`;
    }

    // CALCOLO METEO DINAMICO LUNGO LA ROTTA A STEP DI 100 KM
    async function calcolaMeteoDinamicoConGps(idx) {
      const t = tappe[idx];
      const box = document.getElementById('timelineMeteoBox');
      const note = document.getElementById('meteoStatoNote');

      if (!t.partenza && !t.arrivo) {
        alert("Inserisci almeno partenza o arrivo nella tappa.");
        return;
      }

      note.innerHTML = `<span class="text-sky-300"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Rilevamento coordinate e consultazione modelli meteorologici...</span>`;

      try {
        const queryP = t.partenza || t.arrivo;
        const queryA = t.arrivo || t.partenza;

        const [resP, resA] = await Promise.all([
          fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(queryP.split('(')[0].trim())}&count=1&language=it&format=json`).then(r => r.json()),
          fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(queryA.split('(')[0].trim())}&count=1&language=it&format=json`).then(r => r.json())
        ]);

        if (!resP.results || !resA.results) {
          note.innerHTML = `<span class="text-amber-400">Località non identificate nel database meteo.</span>`;
          return;
        }

        const coordStart = { lat: resP.results[0].latitude, lon: resP.results[0].longitude, name: resP.results[0].name };
        const coordEnd = { lat: resA.results[0].latitude, lon: resA.results[0].longitude, name: resA.results[0].name };

        let kmTot = parseFloat(t.kmTot);
        if (!kmTot || isNaN(kmTot)) {
          const dLat = (coordEnd.lat - coordStart.lat) * Math.PI / 180;
          const dLon = (coordEnd.lon - coordStart.lon) * Math.PI / 180;
          const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(coordStart.lat * Math.PI / 180) * Math.cos(coordEnd.lat * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
          kmTot = Math.round(6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)) * 1.25);
          t.kmTot = kmTot;
          t.oreGuida = `${Math.floor(kmTot/100)}h ${Math.round((kmTot%100)/100*60)}m`;
          salvaSuMemoria();
        }

        const numSegmenti = Math.max(2, Math.ceil(kmTot / 100));
        const [hPart, mPart] = (t.oraPartenza || "08:30").split(':').map(Number);

        let isStorico = false;
        let dViaggio = null;
        if (t.data) {
          const p = t.data.split('/');
          if (p.length === 3) dViaggio = new Date(p[2], p[1] - 1, p[0]);
          if (dViaggio && !isNaN(dViaggio.getTime())) {
            const diffG = Math.ceil((dViaggio - new Date()) / (1000 * 60 * 60 * 24));
            if (diffG > 14) isStorico = true;
          }
        }

        const segmenti = [];
        for (let i = 0; i < numSegmenti; i++) {
          const ratio = i / (numSegmenti - 1);
          const latInterp = coordStart.lat + (coordEnd.lat - coordStart.lat) * ratio;
          const lonInterp = coordStart.lon + (coordEnd.lon - coordStart.lon) * ratio;
          const curH = (hPart + i) % 24;
          const curM = String(mPart).padStart(2, '0');
          const kmProg = Math.round(i * 100);

          segmenti.push({
            step: i,
            orario: `${String(curH).padStart(2, '0')}:${curM}`,
            lat: latInterp,
            lon: lonInterp,
            kmProg: kmProg,
            nome: i === 0 ? coordStart.name : (i === numSegmenti - 1 ? coordEnd.name : `Km ${kmProg}`)
          });
        }

        const meteoPromesse = segmenti.map(async (s) => {
          if (isStorico) {
            const anno1 = dViaggio.getFullYear() - 1;
            const anno2 = dViaggio.getFullYear() - 2;
            const mm = String(dViaggio.getMonth() + 1).padStart(2, '0');
            const dd = String(dViaggio.getDate()).padStart(2, '0');
            const resH = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${s.lat}&longitude=${s.lon}&start_date=${anno2}-${mm}-${dd}&end_date=${anno1}-${mm}-${dd}&hourly=temperature_2m`);
            const dataH = await resH.json();
            let tempMedia = 20;
            if (dataH.hourly && dataH.hourly.temperature_2m) {
              const arr = dataH.hourly.temperature_2m;
              tempMedia = Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
            }
            return { temp: tempMedia, code: 1, pioggia: 0, isStorico: true };
          } else {
            const resW = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&hourly=temperature_2m,precipitation_probability,weathercode&timezone=auto`);
            const dataW = await resW.json();
            const hIndex = Math.min(12, dataW.hourly.time.length - 1);
            return {
              temp: Math.round(dataW.hourly.temperature_2m[hIndex]),
              code: dataW.hourly.weathercode[hIndex],
              pioggia: dataW.hourly.precipitation_probability ? dataW.hourly.precipitation_probability[hIndex] : 0,
              isStorico: false
            };
          }
        });

        const risultatiMeteo = await Promise.all(meteoPromesse);

        box.innerHTML = segmenti.map((s, i) => {
          const w = risultatiMeteo[i];
          const { icon, label } = getWmoIcon(w.code);

          return `
            <div class="flex-shrink-0 bg-gray-900 border ${w.isStorico ? 'border-amber-500/30' : 'border-gray-700'} rounded-xl p-2 text-center w-24 shadow-md">
              <span class="text-[10px] text-gray-300 font-mono font-semibold block">${s.orario}</span>
              <div class="my-1 text-base"><i class="fa-solid ${icon}"></i></div>
              <span class="text-[12px] text-white font-bold block">${w.temp}°C</span>
              ${w.pioggia > 10 ? `<span class="text-[9px] text-blue-300 block"><i class="fa-solid fa-droplet text-[8px]"></i> ${w.pioggia}%</span>` : ''}
              <span class="text-[9px] text-gray-400 truncate block mt-0.5">${s.nome}</span>
            </div>
          `;
        }).join('');

        if (isStorico) {
          note.innerHTML = `<span class="text-amber-400 font-semibold"><i class="fa-solid fa-calendar-xmark mr-1"></i> Ancora è presto per questo dato.</span> Calcolate medie storiche degli ultimi 2 anni a intervalli di 100 km.`;
        } else {
          note.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-circle-check mr-1"></i> Previsione meteorologica attiva e sincronizzata su andatura 100 km/h.</span>`;
        }

      } catch(err) {
        note.innerHTML = `<span class="text-rose-400">Errore calcolo meteo: ${err.message}</span>`;
      }
    }

    // GRAFICO ALTIMETRICO
    async function apriGraficoQuote() {
      const t = tappe[indexTappaAttiva];
      if (!t || (!t.partenza && !t.arrivo)) return;

      document.getElementById('modalGraficoQuote').classList.remove('hidden');

      try {
        const queryP = t.partenza || t.arrivo;
        const queryA = t.arrivo || t.partenza;
        const [resP, resA] = await Promise.all([
          fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(queryP.split('(')[0].trim())}&count=1&format=json`).then(r => r.json()),
          fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(queryA.split('(')[0].trim())}&count=1&format=json`).then(r => r.json())
        ]);

        const start = resP.results[0];
        const end = resA.results[0];

        const pts = [];
        for (let i = 0; i <= 10; i++) {
          const r = i / 10;
          pts.push({
            lat: start.latitude + (end.latitude - start.latitude) * r,
            lon: start.longitude + (end.longitude - start.longitude) * r,
            km: Math.round(((parseFloat(t.kmTot) || 200) / 10) * i)
          });
        }

        const elevRes = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${pts.map(p => p.lat.toFixed(4)).join(',')}&longitude=${pts.map(p => p.lon.toFixed(4)).join(',')}`);
        const elevData = await elevRes.json();
        const altitudini = elevData.elevation;

        const maxAlt = Math.max(...altitudini);
        t.altitudine = `${maxAlt} m`;
        document.getElementById('infoAltMax').textContent = `Quota Massima Registrata: ${maxAlt} m s.l.m.`;

        const ctx = document.getElementById('chartQuoteCanvas').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: pts.map(p => `${p.km} km`),
            datasets: [{
              label: 'Altitudine (metri)',
              data: altitudini,
              borderColor: '#f59e0b',
              backgroundColor: 'rgba(245, 158, 11, 0.2)',
              fill: true,
              tension: 0.35,
              pointRadius: 3,
              pointBackgroundColor: '#fbbf24'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 10 } } },
              y: { grid: { color: 'rgba(255,255,255,0.08)' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
            }
          }
        });
      } catch(e) {
        document.getElementById('infoAltMax').textContent = "Profilo altimetrico stimato.";
      }
    }

    function chiudiGraficoQuote() {
      document.getElementById('modalGraficoQuote').classList.add('hidden');
    }

    // MODAL TAPPA
    function apriModalNuovaTappa() {
      document.getElementById('m_editIndex').value = "-1";
      document.getElementById('m_data').value = "";
      document.getElementById('m_giorno').value = "";
      document.getElementById('m_ora').value = "08:30";
      document.getElementById('m_partenza').value = "";
      document.getElementById('containerIntermediDinamici').innerHTML = "";
      document.getElementById('m_arrivo').value = "";
      document.getElementById('m_km').value = "";
      document.getElementById('m_ore').value = "";
      document.getElementById('m_alt').value = "";
      document.getElementById('m_hotel').value = "";
      document.getElementById('m_piattaforma').value = "";
      document.getElementById('m_prezzo').value = "";
      document.getElementById('m_pagato').value = "Da pagare";
      document.getElementById('m_parcheggio').value = "";
      document.getElementById('m_myroute').value = "";
      document.getElementById('tappaModal').classList.remove('hidden');
    }

    function chiudiModalTappa() {
      document.getElementById('tappaModal').classList.add('hidden');
    }

    function modificaTappa(idx) {
      const t = tappe[idx];
      document.getElementById('m_editIndex').value = idx;
      document.getElementById('m_data').value = t.data || '';
      document.getElementById('m_giorno').value = t.giorno || calcolaGiornoDaData(t.data);
      document.getElementById('m_ora').value = t.oraPartenza || '08:30';
      document.getElementById('m_partenza').value = t.partenza || '';
      
      // Carica intermedi multipli dinamici
      const containerInt = document.getElementById('containerIntermediDinamici');
      containerInt.innerHTML = "";
      const arr = Array.isArray(t.intermedi) ? t.intermedi : (t.intermedio ? t.intermedio.split(',') : []);
      arr.forEach(val => aggiungiRigaIntermedio(val.trim()));

      document.getElementById('m_arrivo').value = t.arrivo || '';
      document.getElementById('m_km').value = t.kmTot || '';
      document.getElementById('m_ore').value = t.oreGuida || '';
      document.getElementById('m_alt').value = t.altitudine || '';
      document.getElementById('m_hotel').value = t.hotel || '';
      document.getElementById('m_piattaforma').value = t.piattaforma || '';
      document.getElementById('m_prezzo').value = t.prezzo || '';
      document.getElementById('m_pagato').value = t.pagato || 'Da pagare';
      document.getElementById('m_parcheggio').value = t.parcheggio || '';
      document.getElementById('m_myroute').value = t.myRouteUrl || '';
      document.getElementById('tappaModal').classList.remove('hidden');
    }

    function salvaTappaManuale() {
      const idx = parseInt(document.getElementById('m_editIndex').value, 10);
      const dataInserita = document.getElementById('m_data').value.trim();
      const partenza = document.getElementById('m_partenza').value.trim();
      const arrivo = document.getElementById('m_arrivo').value.trim();

      // Raccolta intermedi dai campi dinamici
      const inputsInt = document.querySelectorAll('.input-intermedio');
      const intermediList = Array.from(inputsInt).map(i => i.value.trim()).filter(v => v !== '');

      const dataFormattata = formattaInGiornoMeseAnno(dataInserita);
      const giornoCalcolato = calcolaGiornoDaData(dataFormattata);

      let kmVal = document.getElementById('m_km').value.trim();
      let oreVal = document.getElementById('m_ore').value.trim();

      if (kmVal && (!oreVal || oreVal === '')) {
        const k = parseFloat(kmVal);
        oreVal = `${Math.floor(k/100)}h ${Math.round((k%100)/100*60)}m`;
      }

      const tappaObj = {
        giorno: giornoCalcolato,
        data: dataFormattata,
        oraPartenza: document.getElementById('m_ora').value || "08:30",
        partenza: partenza,
        intermedi: intermediList,
        intermedio: intermediList.join(', '),
        arrivo: arrivo,
        kmTot: kmVal,
        oreGuida: oreVal || "03:00",
        altitudine: document.getElementById('m_alt').value.trim(),
        hotel: document.getElementById('m_hotel').value.trim(),
        piattaforma: document.getElementById('m_piattaforma').value.trim(),
        prezzo: document.getElementById('m_prezzo').value.trim(),
        pagato: document.getElementById('m_pagato').value,
        parcheggio: document.getElementById('m_parcheggio').value.trim(),
        myRouteUrl: document.getElementById('m_myroute').value.trim()
      };

      if (idx === -1) {
        tappe.push(tappaObj);
        indexTappaAttiva = tappe.length - 1;
      } else {
        tappe[idx] = tappaObj;
      }

      salvaSuMemoria();
      chiudiModalTappa();
      aggiornaVista();
    }

    function eliminaTappa(idx) {
      if (confirm("Vuoi eliminare questa tappa?")) {
        tappe.splice(idx, 1);
        salvaSuMemoria();
        vaiAllaHome();
      }
    }

    function scaricaGpxMultiWaypoint(idx) {
      const t = tappe[idx];
      const p = t.partenza || 'Partenza';
      const a = t.arrivo || 'Arrivo';
      const arr = Array.isArray(t.intermedi) ? t.intermedi : (t.intermedio ? t.intermedio.split(',') : []);
      const nome = `${p}_${a}`.replace(/\s+/g, '_');

      const waypointsGpx = arr.map(w => `<rtept lat="0.0" lon="0.0"><name>${w.trim()}</name></rtept>`).join('\n');

      const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="djRoutePlanner">
  <metadata><name>${nome}</name></metadata>
  <rte>
    <name>${nome}</name>
    <rtept lat="0.0" lon="0.0"><name>${p}</name></rtept>
    ${waypointsGpx}
    <rtept lat="0.0" lon="0.0"><name>${a}</name></rtept>
  </rte>
</gpx>`;
      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${nome}.gpx`;
      link.click();
    }

    // PARSER EXCEL UNIVERSALE
    function importaQualsiasiExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array', cellDates: true });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });

          if (rows.length === 0) {
            alert("Il file Excel è vuoto.");
            return;
          }

          function val(riga, chiavi) {
            const cols = Object.keys(riga);
            for (let c of cols) {
              const lower = c.toLowerCase().trim();
              for (let k of chiavi) {
                if (lower === k.toLowerCase() || lower.includes(k.toLowerCase())) {
                  const v = riga[c];
                  if (v !== undefined && v !== null && String(v).trim() !== '') {
                    return String(v).trim();
                  }
                }
              }
            }
            return "";
          }

          tappe = [];
          rows.forEach((r) => {
            const dataRaw = val(r, ['data', 'date']);
            const partenza = val(r, ['partenza', 'start', 'from', 'da']);
            const arrivo = val(r, ['arrivo', 'destinazione', 'arrival', 'to', 'a']);
            const intermedio = val(r, ['intermedio', 'passo', 'via']);
            const temp = val(r, ['temp. min/max', 'temp', 'temperatura']);
            const km = val(r, ['km tot', 'km']);
            const ore = val(r, ['ore guida', 'ore']);
            const alt = val(r, ['alt.', 'altitudine']);
            const hotel = val(r, ['pernottamento', 'hotel', 'alloggio']);
            const parcheggio = val(r, ['indicazioni parcheggio', 'parcheggio', 'parking']);
            const prezzo = val(r, ['costo camera', 'prezzo €', 'prezzo', 'costo']);
            const piattaforma = val(r, ['sito prenotazione', 'piattaforma', 'booking']);
            const myroute = val(r, ['track', 'myroute', 'link']);

            const testIgnora = (dataRaw + " " + partenza + " " + arrivo).toUpperCase();
            if (testIgnora.includes("TOTALE") || testIgnora.includes("MANUTENZIONE") || testIgnora.includes("ASSICURAZIONI") || testIgnora.includes("PREVENTIVO")) {
              return;
            }

            if (dataRaw || partenza || arrivo || temp) {
              const dataFormattata = formattaInGiornoMeseAnno(dataRaw);
              const giornoCalcolato = calcolaGiornoDaData(dataFormattata);
              const arrInt = intermedio ? intermedio.split(',').map(s => s.trim()).filter(Boolean) : [];

              tappe.push({
                giorno: giornoCalcolato,
                data: dataFormattata,
                oraPartenza: "08:30",
                partenza: partenza,
                intermedi: arrInt,
                intermedio: arrInt.join(', '),
                arrivo: arrivo,
                kmTot: km,
                oreGuida: ore || (km ? `${Math.floor(parseFloat(km)/100)}h` : "03:00"),
                altitudine: alt,
                hotel: hotel,
                piattaforma: piattaforma || (hotel ? "Booking" : ""),
                prezzo: prezzo ? (prezzo.includes('€') ? prezzo : prezzo + ' €') : "",
                pagato: "Da pagare",
                parcheggio: parcheggio,
                myRouteUrl: (myroute && myroute.startsWith('http')) ? myroute : ""
              });
            }
          });

          salvaSuMemoria();
          vaiAllaHome();
          alert(`Caricate ${tappe.length} tappe con successo!`);
        } catch(err) {
          alert("Errore nella lettura del file: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // GPS SMARTPHONE LIVE
    function attivaGps() {
      if (!navigator.geolocation) {
        alert("GPS non disponibile sul browser.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(4);
          const lon = pos.coords.longitude.toFixed(4);
          alert(`GPS Attivo!\nLatitudine: ${lat}\nLongitudine: ${lon}`);
          if (vistaAttuale === "dettaglio") {
            calcolaMeteoDinamicoConGps(indexTappaAttiva);
          }
        },
        () => alert("Permesso GPS negato o segnale assente.")
      );
    }
  </script>
