<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>djRoutePlanner - Roadbook & Live Weather</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="djRoute">
  <meta name="theme-color" content="#0d1117">
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS per lettura Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    body { background-color: #0d1117; color: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .card { background: #161b22; border: 1px solid #30363d; }
    .scroll-hide::-webkit-scrollbar { display: none; }
    .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-28">

  <!-- Header con Icona Super Ténéré 1200 e Pulsanti Circolari -->
  <header class="sticky top-0 z-30 bg-[#161b22]/95 backdrop-blur border-b border-gray-800 px-3.5 py-2.5 flex items-center justify-between">
    <div class="flex items-center space-x-2.5 overflow-hidden">
      <!-- Icona Maxi-Enduro / Super Ténéré XT1200Z Style -->
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500/20 to-blue-500/10 border border-amber-500/30 flex items-center justify-center p-1.5 shadow-sm flex-shrink-0">
        <svg viewBox="0 0 100 100" class="w-full h-full text-amber-400 fill-current" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 72a15 15 0 1 0 30 0 15 15 0 1 0-30 0zm15-11a11 11 0 1 1 0 22 11 11 0 0 1 0-22z" fill="#94a3b8"/>
          <path d="M58 72a15 15 0 1 0 30 0 15 15 0 1 0-30 0zm15-11a11 11 0 1 1 0 22 11 11 0 0 1 0-22z" fill="#94a3b8"/>
          <path d="M27 72l18-24 15 2 13 22H62L52 56l-9 8-16 8z" fill="#f59e0b"/>
          <path d="M43 47l6-18 10 3 6 15-8 5z" fill="#fbbf24"/>
          <path d="M48 24l5-12 7 2-3 10z" fill="#38bdf8"/>
          <path d="M59 34l12-3 3 5-11 5z" fill="#f59e0b"/>
          <path d="M44 26h12v3H44z" fill="#e2e8f0"/>
          <circle cx="27" cy="72" r="4" fill="#f8fafc"/>
          <circle cx="73" cy="72" r="4" fill="#f8fafc"/>
        </svg>
      </div>
      <div class="truncate">
        <h1 class="font-black text-sm tracking-wide text-white leading-tight">djRoutePlanner</h1>
        <p class="text-[10px] text-amber-400 font-medium">Roadbook & Live Weather</p>
      </div>
    </div>

    <!-- Tasti Circolari Fissi (Verde: Excel, Giallo: Tappa) -->
    <div class="flex items-center space-x-2 flex-shrink-0">
      <label title="Importa Excel" class="w-9 h-9 rounded-full bg-emerald-500 hover:bg-emerald-400 text-gray-950 flex items-center justify-center font-bold text-sm cursor-pointer shadow-md active:scale-95 transition-transform flex-shrink-0">
        <i class="fa-solid fa-file-excel"></i>
        <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" class="hidden" onchange="importaQualsiasiExcel(event)">
      </label>

      <button onclick="apriModalTappa()" title="Aggiungi Tappa" class="w-9 h-9 rounded-full bg-amber-400 hover:bg-amber-300 text-gray-950 flex items-center justify-center font-bold text-sm shadow-md active:scale-95 transition-transform flex-shrink-0">
        <i class="fa-solid fa-plus text-base"></i>
      </button>
    </div>
  </header>

  <!-- GPS Live Bar -->
  <section class="m-3 p-2.5 rounded-xl bg-gray-900 border border-gray-800 shadow">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        <span id="gpsStatus" class="text-xs text-gray-300 font-medium">GPS: Pronto</span>
      </div>
      <button onclick="attivaGps()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 text-xs px-2.5 py-1 rounded-md font-medium flex items-center gap-1">
        <i class="fa-solid fa-location-crosshairs text-amber-400"></i> Trova Posizione
      </button>
    </div>
    <div id="liveWeatherBox" class="mt-2 text-xs text-gray-300 border-t border-gray-800 pt-2 hidden"></div>
  </section>

  <!-- Contenitore Tappe -->
  <main class="px-3 space-y-3.5" id="tappeContainer">
    <div id="emptyState" class="text-center py-16 px-4">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gray-800 flex items-center justify-center border border-gray-700">
        <i class="fa-solid fa-map-location-dot text-2xl text-amber-400"></i>
      </div>
      <h2 class="text-base font-semibold text-white">Nessuna tappa in programma</h2>
      <p class="text-xs text-gray-400 mt-1 max-w-xs mx-auto">
        Tocca il tasto <strong class="text-emerald-400">Verde</strong> per importare un foglio Excel oppure il tasto <strong class="text-amber-400">Giallo (+)</strong> per aggiungere manualmente una tappa.
      </p>
    </div>
  </main>

  <!-- MODAL EXPORT PER NAVIGATORE (GARMIN, TOMTOM, GPX, KML) -->
  <div id="exportModal" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-4">
    <div class="card w-full max-w-sm rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-800 pb-2">
        <h3 class="font-bold text-sm text-white flex items-center gap-2">
          <i class="fa-solid fa-satellite-dish text-amber-400"></i> Esporta per Navigatore
        </h3>
        <button onclick="chiudiExportModal()" class="text-gray-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <p class="text-xs text-gray-300" id="exportDesc">Seleziona il formato del file:</p>

      <div class="grid grid-cols-1 gap-2 text-xs">
        <button onclick="eseguiDownloadFormato('gpx')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 p-2.5 rounded-xl flex items-center justify-between text-left">
          <div>
            <span class="font-bold text-white block">Formato GPX (.gpx)</span>
            <span class="text-[11px] text-gray-400">Garmin (Zūmo/Tread/BMW), OsmAnd, Rever</span>
          </div>
          <i class="fa-solid fa-download text-amber-400 text-sm"></i>
        </button>

        <button onclick="eseguiDownloadFormato('itn')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 p-2.5 rounded-xl flex items-center justify-between text-left">
          <div>
            <span class="font-bold text-white block">TomTom Itinerary (.itn)</span>
            <span class="text-[11px] text-gray-400">TomTom Rider 400/500/550, TomTom GO</span>
          </div>
          <i class="fa-solid fa-download text-cyan-400 text-sm"></i>
        </button>

        <button onclick="eseguiDownloadFormato('kml')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 p-2.5 rounded-xl flex items-center justify-between text-left">
          <div>
            <span class="font-bold text-white block">Google Earth KML (.kml)</span>
            <span class="text-[11px] text-gray-400">Google Earth, Maps.me</span>
          </div>
          <i class="fa-solid fa-download text-emerald-400 text-sm"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL NUOVA / MODIFICA TAPPA -->
  <div id="tappaModal" class="fixed inset-0 bg-black/85 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="card w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-4 sm:p-5 max-h-[90vh] overflow-y-auto space-y-3">
      <div class="flex justify-between items-center border-b border-gray-800 pb-2">
        <h3 class="font-bold text-sm sm:text-base flex items-center gap-2">
          <i class="fa-solid fa-route text-amber-400"></i> Scheda Tappa
        </h3>
        <button onclick="chiudiModalTappa()" class="text-gray-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <input type="hidden" id="editIndex" value="-1">

      <div class="grid grid-cols-3 gap-2 text-xs">
        <div>
          <label class="block text-gray-400 mb-1">Data (GG/MM/AAAA) *</label>
          <input type="text" id="m_data" placeholder="01/06/2026" oninput="aggiornaGiornoSettimana()" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white font-mono">
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Giorno (Auto)</label>
          <input type="text" id="m_giorno" placeholder="Calcolato..." readonly class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-amber-400 font-bold capitalize">
        </div>
        <div>
          <label class="block text-amber-400 font-semibold mb-1">Ora Partenza</label>
          <input type="time" id="m_ora" value="08:30" class="w-full bg-gray-800 border border-amber-500/40 rounded-lg p-2 text-white font-bold">
        </div>
      </div>

      <div class="space-y-2 text-xs">
        <div>
          <label class="block text-gray-300 font-medium mb-1">Luogo di Partenza</label>
          <input type="text" id="m_partenza" placeholder="es. Bologna" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Passi / Punti Intermedi (separati da virgola)</label>
          <input type="text" id="m_intermedio" placeholder="es. Passo Futa, Passo Raticosa" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
        <div>
          <label class="block text-gray-300 font-medium mb-1">Destinazione Finale (Arrivo)</label>
          <input type="text" id="m_arrivo" placeholder="es. Firenze" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 text-xs">
        <div>
          <label class="block text-gray-400 mb-1">Km Totali</label>
          <input type="text" id="m_km" placeholder="120" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Ore Guida</label>
          <input type="text" id="m_ore" placeholder="02:30" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Quota / Altitudine</label>
          <input type="text" id="m_alt" placeholder="903 m" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
      </div>

      <!-- SEZIONE ALLOGGIO -->
      <div class="border-t border-gray-800 pt-2.5 space-y-2 text-xs">
        <span class="text-[11px] font-bold text-amber-400 uppercase tracking-wider block">Dettagli Alloggio & Parcheggio</span>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-400 mb-1">Nome Alloggio / Hotel</label>
            <input type="text" id="m_hotel" placeholder="Nome Struttura" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">Piattaforma Prenotazione</label>
            <input type="text" id="m_piattaforma" placeholder="es. Booking, Airbnb, Diretto" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-400 mb-1">Prezzo Totale €</label>
            <input type="text" id="m_prezzo" placeholder="es. 75 €" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">Stato Pagamento</label>
            <select id="m_pagato" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
              <option value="Da pagare">Da pagare</option>
              <option value="Già pagato">Già pagato</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-emerald-400 font-semibold mb-1"><i class="fa-solid fa-square-parking mr-1"></i> Indicazioni Parcheggio Moto</label>
          <input type="text" id="m_parcheggio" placeholder="es. Cortile interno privato con cancello su asfalto" class="w-full bg-gray-800 border border-emerald-600/40 rounded-lg p-2 text-white">
        </div>
      </div>

      <!-- CARICAMENTO TRACCIA -->
      <div class="border-t border-gray-800 pt-2 space-y-2 text-xs">
        <label class="block text-amber-400 font-semibold mb-1">
          <i class="fa-solid fa-file-import mr-1"></i> File Traccia (GPX, ITN, KML)
        </label>
        <label class="bg-gray-800 hover:bg-gray-700 border border-gray-700 px-3 py-2 rounded-lg cursor-pointer text-gray-300 w-full block text-center truncate">
          <span id="labelFileTraccia">Scegli file...</span>
          <input type="file" id="navFileInput" accept=".gpx, .itn, .kml, .kmz" class="hidden" onchange="gestisciCaricamentoFileTraccia(event)">
        </label>

        <div>
          <label class="block text-orange-400 mb-1"><i class="fa-solid fa-route mr-1"></i> Oppure Link MyRoute-app</label>
          <input type="url" id="m_myroute" placeholder="https://www.myrouteapp.com/..." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white">
        </div>
      </div>

      <div class="pt-2 flex gap-2">
        <button onclick="chiudiModalTappa()" class="w-1/2 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-lg text-xs font-semibold text-gray-300">Annulla</button>
        <button onclick="salvaTappa()" class="w-1/2 py-2.5 bg-amber-400 hover:bg-amber-300 rounded-lg text-xs font-bold text-gray-950 shadow-sm">Salva Tappa</button>
      </div>
    </div>
  </div>

  <script>
    let tappe = [];
    let tappaCorrenteExport = null;

    // Converte qualsiasi stringa o Date in GG/MM/AAAA
    function formattaInGiornoMeseAnno(val) {
      if (!val) return "";
      if (val instanceof Date && !isNaN(val.getTime())) {
        const gg = String(val.getDate()).padStart(2, '0');
        const mm = String(val.getMonth() + 1).padStart(2, '0');
        const aaaa = val.getFullYear();
        return `${gg}/${mm}/${aaaa}`;
      }
      const str = String(val).trim();
      if (str.includes('/')) {
        const p = str.split('/');
        if (p.length === 3) return `${p[0].padStart(2, '0')}/${p[1].padStart(2, '0')}/${p[2]}`;
      }
      if (str.includes('-')) {
        const p = str.split('T')[0].split('-');
        if (p.length === 3) return `${p[2].padStart(2, '0')}/${p[1].padStart(2, '0')}/${p[0]}`;
      }
      return str;
    }

    // Calcola il giorno della settimana da stringa GG/MM/AAAA o ISO
    function calcolaGiornoDaData(strData) {
      if (!strData) return "";
      let gg, mm, aaaa;
      if (strData.includes('/')) {
        const p = strData.split('/');
        gg = parseInt(p[0], 10);
        mm = parseInt(p[1], 10) - 1;
        aaaa = parseInt(p[2], 10);
      } else if (strData.includes('-')) {
        const p = strData.split('-');
        aaaa = parseInt(p[0], 10);
        mm = parseInt(p[1], 10) - 1;
        gg = parseInt(p[2], 10);
      } else {
        return "";
      }
      const d = new Date(aaaa, mm, gg);
      if (isNaN(d.getTime())) return "";
      const nomi = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
      return nomi[d.getDay()];
    }

    function aggiornaGiornoSettimana() {
      const dataVal = document.getElementById('m_data').value.trim();
      document.getElementById('m_giorno').value = calcolaGiornoDaData(dataVal);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('djroute_v6_tappe');
      if (saved) {
        try {
          tappe = JSON.parse(saved);
          renderTappe();
        } catch(e) {
          tappe = [];
        }
      }
    });

    function salvaSuMemoria() {
      localStorage.setItem('djroute_v6_tappe', JSON.stringify(tappe));
    }

    function generaTimelineOre(oraPartenza, oreGuidaTot) {
      const ore = [];
      const [hPart, mPart] = (oraPartenza || "08:30").split(':').map(Number);
      
      let durataOre = 3;
      if (oreGuidaTot) {
        if (typeof oreGuidaTot === 'string' && oreGuidaTot.includes(':')) {
          const [hD, mD] = oreGuidaTot.split(':').map(Number);
          durataOre = Math.max(1, Math.round(hD + (mD / 60)));
        } else if (!isNaN(parseFloat(oreGuidaTot))) {
          durataOre = Math.max(1, Math.round(parseFloat(oreGuidaTot)));
        }
      }

      for (let i = 0; i <= durataOre; i++) {
        const curH = (hPart + i) % 24;
        const curM = String(mPart).padStart(2, '0');
        ore.push({
          step: i,
          orario: `${String(curH).padStart(2, '0')}:${curM}`,
          isPartenza: i === 0,
          isArrivo: i === durataOre
        });
      }
      return ore;
    }

    function getWmoIcon(wmoCode) {
      if (wmoCode === 0) return { icon: "fa-sun text-amber-400", label: "Sereno" };
      if (wmoCode >= 1 && wmoCode <= 3) return { icon: "fa-cloud-sun text-yellow-300", label: "Poco nuvoloso" };
      if (wmoCode >= 45 && wmoCode <= 48) return { icon: "fa-smog text-gray-400", label: "Nebbia" };
      if (wmoCode >= 51 && wmoCode <= 67) return { icon: "fa-cloud-rain text-blue-400", label: "Pioggia" };
      if (wmoCode >= 71 && wmoCode <= 77) return { icon: "fa-snowflake text-sky-200", label: "Neve" };
      if (wmoCode >= 80 && wmoCode <= 82) return { icon: "fa-cloud-showers-heavy text-blue-500", label: "Rovesci" };
      if (wmoCode >= 95) return { icon: "fa-cloud-bolt text-purple-400", label: "Temporale" };
      return { icon: "fa-cloud text-gray-400", label: "Coperto" };
    }

    function renderTappe() {
      const container = document.getElementById('tappeContainer');
      if (!tappe || tappe.length === 0) {
        container.innerHTML = `
          <div id="emptyState" class="text-center py-16 px-4">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gray-800 flex items-center justify-center border border-gray-700">
              <i class="fa-solid fa-map-location-dot text-2xl text-amber-400"></i>
            </div>
            <h2 class="text-base font-semibold text-white">Nessuna tappa in programma</h2>
            <p class="text-xs text-gray-400 mt-1 max-w-xs mx-auto">
              Tocca il tasto <strong class="text-emerald-400">Verde</strong> per importare un foglio Excel oppure il tasto <strong class="text-amber-400">Giallo (+)</strong> per aggiungere manualmente una tappa.
            </p>
          </div>
        `;
        return;
      }

      container.innerHTML = tappe.map((t, idx) => {
        const timeline = generaTimelineOre(t.oraPartenza, t.oreGuida);
        const gmapsUrl = generaGoogleMapsLink(t.partenza, t.intermedio, t.arrivo);
        const giornoNome = t.giorno || calcolaGiornoDaData(t.data);

        return `
        <div class="card rounded-2xl p-4 shadow-lg space-y-3.5 border border-gray-800">
          <div class="flex justify-between items-start border-b border-gray-800 pb-3">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 uppercase tracking-wide">
                  Tappa ${idx + 1} ${giornoNome ? '• ' + giornoNome : ''} ${t.data ? '• ' + t.data : ''}
                </span>
                <span class="text-[11px] bg-gray-800 px-2 py-0.5 rounded text-gray-300 font-mono">
                  <i class="fa-regular fa-clock text-amber-400 mr-1"></i>${t.oraPartenza || '08:30'}
                </span>
              </div>
              <h2 class="text-base font-bold text-white mt-1.5 leading-snug">
                ${t.partenza || '<span class="text-gray-500 italic">Partenza non impostata</span>'} 
                <i class="fa-solid fa-arrow-right text-xs text-amber-400 mx-1"></i> 
                ${t.arrivo || '<span class="text-gray-500 italic">Arrivo non impostato</span>'}
              </h2>
              ${t.intermedio ? `<p class="text-xs text-gray-400 mt-0.5"><i class="fa-solid fa-signs-post text-amber-400 mr-1"></i>Passi / Waypoint: ${t.intermedio}</p>` : ''}
              ${t.fileTracciaNome ? `<p class="text-[11px] text-emerald-400 mt-0.5"><i class="fa-solid fa-file-circle-check mr-1"></i>Traccia: ${t.fileTracciaNome}</p>` : ''}
            </div>

            <div class="text-right flex flex-col items-end">
              ${t.kmTot ? `<span class="text-sm font-bold text-amber-400">${t.kmTot} km</span>` : ''}
              ${t.oreGuida ? `<span class="text-[11px] text-gray-400">${t.oreGuida} h guida</span>` : ''}
              <div class="flex gap-1 mt-1">
                <button onclick="modificaTappa(${idx})" class="text-gray-400 hover:text-amber-400 p-1 text-xs" title="Modifica"><i class="fa-solid fa-pen"></i></button>
                <button onclick="rimuoviTappa(${idx})" class="text-gray-400 hover:text-red-400 p-1 text-xs" title="Elimina"><i class="fa-solid fa-trash-can"></i></button>
              </div>
            </div>
          </div>

          <!-- Quota & Fondo -->
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="bg-gray-900/60 p-2 rounded-xl border border-gray-800 flex items-center justify-between">
              <span class="text-gray-400"><i class="fa-solid fa-mountain text-gray-300 mr-1.5"></i>Quota/Temp:</span>
              <span class="font-medium text-gray-200">${t.altitudine || t.tempMinMax || 'ND'}</span>
            </div>
            <div class="bg-gray-900/60 p-2 rounded-xl border border-gray-800 flex items-center justify-between">
              <span class="text-gray-400"><i class="fa-solid fa-road text-gray-300 mr-1.5"></i>Fondo:</span>

                <i class="fa-brands fa-waze text-base text-cyan-400"></i>

              <a href="${t.myRouteUrl || 'https://www.myrouteapp.com'}" target="_blank"

                <i class="fa-solid fa-route text-base text-orange-400"></i>

              <button onclick="apriExportModal(${idx})"

                <i class="fa-solid fa-satellite-dish text-base text-emerald-400"></i>

    function generaGoogleMapsLink(partenza, intermedio, arrivo) {
      if (!partenza && !arrivo) return "https://www.google.com/maps";
      let url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(partenza || '')}&destination=${encodeURIComponent(arrivo || '')}&travelmode=driving`;
      if (intermedio && intermedio.trim() !== '') {
        url += `&waypoints=${encodeURIComponent(intermedio.trim())}`;
      }
      return url;
    }

      const tappaObj = {
        giorno: giornoCalcolato,

    function importaQualsiasiExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array', cellDates: true });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });

          if (rows.length === 0) {
            alert("Il file Excel è vuoto.");
            return;
          }

          function val(riga, chiavi) {
            const cols = Object.keys(riga);
            for (let c of cols) {
              const lower = c.toLowerCase().trim();
              for (let k of chiavi) {
                if (lower === k.toLowerCase() || lower.includes(k.toLowerCase())) {
                  const v = riga[c];
                  if (v !== undefined && v !== null && String(v).trim() !== '') {
                    return String(v).trim();
                  }
                }
              }
            }
            return "";
          }

          tappe = [];
          rows.forEach((r) => {
            const dataRaw = val(r, ['data', 'date']);
            const partenza = val(r, ['partenza', 'start', 'from', 'da']);
            const arrivo = val(r, ['arrivo', 'destinazione', 'arrival', 'to', 'a']);
            const intermedio = val(r, ['intermedio', 'passo', 'via']);
            const temp = val(r, ['temp. min/max', 'temp', 'temperatura']);
            const km = val(r, ['km tot', 'km']);
            const ore = val(r, ['ore guida', 'ore']);
            const alt = val(r, ['alt.', 'altitudine']);
            const hotel = val(r, ['pernottamento', 'hotel', 'alloggio']);
            const parcheggio = val(r, ['indicazioni parcheggio', 'parcheggio', 'parking']);
            const prezzo = val(r, ['costo camera', 'prezzo €', 'prezzo', 'costo']);
            const piattaforma = val(r, ['sito prenotazione', 'piattaforma', 'booking']);

            const testIgnora = (dataRaw + " " + partenza + " " + arrivo).toUpperCase();
            if (testIgnora.includes("TOTALE") || testIgnora.includes("MANUTENZIONE") || testIgnora.includes("ASSICURAZIONI") || testIgnora.includes("PREVENTIVO")) {
              return;
            }

            if (dataRaw || partenza || arrivo || temp) {
              const dataFormattata = formattaInGiornoMeseAnno(dataRaw);
              const giornoCalcolato = calcolaGiornoDaData(dataFormattata);

              tappe.push({
                giorno: giornoCalcolato,
                data: dataFormattata,
                oraPartenza: "08:30",
                partenza: partenza,
                intermedio: intermedio,
                arrivo: arrivo,
                kmTot: km,
                oreGuida: ore || "03:00",
                altitudine: alt,
                tempMinMax: temp,
                hotel: hotel,
                piattaforma: piattaforma || (hotel ? "Booking" : ""),
                prezzo: prezzo ? (prezzo.includes('€') ? prezzo : prezzo + ' €') : "",
                pagato: "Da pagare",
                parcheggio: parcheggio,
                myRouteUrl: "",
                fileTracciaNome: ""
              });
            }
          });

          salvaSuMemoria();
          renderTappe();
          alert(`Caricate ${tappe.length} tappe con successo!`);
        } catch(err) {
          alert("Errore nella lettura del file: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function eseguiDownloadFormato(formato) {
      if (!tappaCorrenteExport) return;
      const p = tappaCorrenteExport.partenza || 'Partenza';
      const a = tappaCorrenteExport.arrivo || 'Arrivo';
      const w = tappaCorrenteExport.intermedio || '';
      const baseName = `${p}_${a}`.replace(/\s+/g, '_');

      let mime = 'application/octet-stream';
      let fileContent = '';

      if (formato === 'gpx') {
        mime = 'application/gpx+xml';
        fileContent = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1"><rte><name>${p} - ${a}</name><rtept lat="0.0" lon="0.0"><name>${p}</name></rtept>${w ? `<rtept lat="0.0" lon="0.0"><name>${w}</name></rtept>` : ''}<rtept lat="0.0" lon="0.0"><name>${a}</name></rtept></rte></gpx>`;
      } else if (formato === 'itn') {
        mime = 'text/plain';
        fileContent = `0|0|${p}|0|\n${w ? `0|0|${w}|1|\n` : ''}0|0|${a}|2|\n`;
      } else if (formato === 'kml') {
        mime = 'application/vnd.google-earth.kml+xml';
        fileContent = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${p} - ${a}</name><Placemark><name>${p}</name></Placemark><Placemark><name>${a}</name></Placemark></Document></kml>`;
      }

      const blob = new Blob([fileContent], { type: mime });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${baseName}.${formato}`;
      link.click();
      chiudiExportModal();
    }

    async function calcolaMeteoOrario(tappaIdx) {
      const t = tappe[tappaIdx];
      const box = document.getElementById(`weather-timeline-${tappaIdx}`);
      const note = document.getElementById(`weather-note-${tappaIdx}`);
      const targetCitta = t.arrivo || t.partenza;

      if (!targetCitta) {
        alert("Inserisci una località di partenza o arrivo nella tappa.");
        return;
      }

      note.innerHTML = `<span class="text-sky-300"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Rilevamento coordinate e meteo...</span>`;

      try {
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(targetCitta)}&count=1&language=it&format=json`);
        const geoData = await geoRes.json();
        if (!geoData.results || geoData.results.length === 0) {
          note.innerHTML = `<span class="text-amber-400">Località non identificata nel database meteo.</span>`;
          return;
        }

        const { latitude, longitude, name } = geoData.results[0];
        const timeline = generaTimelineOre(t.oraPartenza, t.oreGuida);

        let giorniDifferenza = null;
        if (t.data) {
          let dObj = null;
          if (t.data.includes('/')) {
            const p = t.data.split('/');
            dObj = new Date(p[2], p[1] - 1, p[0]);
          } else if (t.data.includes('-')) {
            dObj = new Date(t.data);
          }
          if (dObj && !isNaN(dObj.getTime())) {
            const oggi = new Date();
            giorniDifferenza = Math.ceil((dObj - oggi) / (1000 * 60 * 60 * 24));
          }
        }

        if (giorniDifferenza !== null && giorniDifferenza > 14) {
          note.innerHTML = `<span class="text-amber-400 font-semibold"><i class="fa-solid fa-calendar-xmark mr-1"></i> Ancora è presto per questo dato.</span> Calcolata media storica degli ultimi 2 anni per ${name} a questo periodo.`;

          let dObj = null;
          if (t.data.includes('/')) {
            const p = t.data.split('/');
            dObj = new Date(p[2], p[1] - 1, p[0]);
          } else {
            dObj = new Date(t.data);
          }

          const anno1 = dObj.getFullYear() - 1;
          const anno2 = dObj.getFullYear() - 2;
          const mm = String(dObj.getMonth() + 1).padStart(2, '0');
          const dd = String(dObj.getDate()).padStart(2, '0');

          const datePast1 = `${anno1}-${mm}-${dd}`;
          const datePast2 = `${anno2}-${mm}-${dd}`;

          const histRes = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${latitude}&longitude=${longitude}&start_date=${datePast2}&end_date=${datePast1}&hourly=temperature_2m`);
          const histData = await histRes.json();

          let tempMediaStimata = 22;
          if (histData.hourly && histData.hourly.temperature_2m) {
            const arr = histData.hourly.temperature_2m;
            tempMediaStimata = Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
          }

          box.innerHTML = timeline.map((step, i) => {
            const tGrad = tempMediaStimata + (i * 0.7);
            return `
              <div class="flex-shrink-0 bg-gray-900 border border-amber-500/30 rounded-lg p-2 text-center w-24">
                <span class="text-[10px] text-gray-400 block font-mono">${step.orario}</span>
                <div class="my-1 text-base text-amber-400"><i class="fa-solid fa-clock-rotate-left"></i></div>
                <span class="text-[11px] text-amber-300 block font-bold">${Math.round(tGrad)}°C</span>
                <span class="text-[8px] text-amber-400/80 uppercase block">Media 2 anni</span>
              </div>
            `;
          }).join('');
          return;
        }

        const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&hourly=temperature_2m,precipitation_probability,weathercode,windspeed_10m&timezone=auto`);
        const wData = await wRes.json();

        note.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-circle-check mr-1"></i> Previsione meteorologica oraria attiva per ${name}.</span>`;

        const hTimes = wData.hourly.time;
        box.innerHTML = timeline.map(step => {
          const oraMatch = `${String(new Date().toISOString().split('T')[0])}T${step.orario.split(':')[0]}:00`;
          let index = hTimes.findIndex(t => t.startsWith(oraMatch));
          if (index === -1) index = 12;

          const temp = Math.round(wData.hourly.temperature_2m[index]);
          const code = wData.hourly.weathercode[index];
          const pioggia = wData.hourly.precipitation_probability ? wData.hourly.precipitation_probability[index] : 0;
          const { icon, label } = getWmoIcon(code);

          return `
            <div class="flex-shrink-0 bg-gray-900 border border-gray-700 rounded-lg p-2 text-center w-24 shadow">
              <span class="text-[10px] text-gray-300 block font-mono font-semibold">${step.orario}</span>
              <div class="my-1.5 text-base"><i class="fa-solid ${icon}"></i></div>
              <span class="text-[12px] text-white block font-bold">${temp}°C</span>
              ${pioggia > 15 ? `<span class="text-[9px] text-blue-300 block"><i class="fa-solid fa-droplet text-[8px]"></i> ${pioggia}%</span>` : ''}
              <span class="text-[9px] text-gray-400 truncate block mt-0.5">${step.isPartenza ? 'Partenza' : step.isArrivo ? 'Arrivo' : label}</span>
            </div>
          `;
        }).join('');

      } catch (err) {
        note.innerHTML = `<span class="text-rose-400">Errore recupero meteo: ${err.message}</span>`;
      }
    }

    function attivaGps() {
      const status = document.getElementById('gpsStatus');
      const box = document.getElementById('liveWeatherBox');
      if (!navigator.geolocation) {
        status.textContent = "GPS non disponibile";
        return;
      }
      status.textContent = "Rilevamento...";
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude.toFixed(4);
        const lon = pos.coords.longitude.toFixed(4);
        status.innerHTML = `<span class="text-emerald-400 font-semibold">GPS: ${lat}, ${lon}</span>`;

        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
          const data = await res.json();
          box.classList.remove('hidden');
          box.innerHTML = `
            <div class="flex justify-between items-center text-xs">
              <span><i class="fa-solid fa-location-dot text-emerald-400 mr-1"></i> Meteo attuale: <strong>${data.current_weather.temperature}°C</strong></span>
              <span><i class="fa-solid fa-wind mr-1 text-gray-400"></i> ${data.current_weather.windspeed} km/h</span>
            </div>
          `;
        } catch(e) {}
      }, () => {
        status.textContent = "Permesso GPS negato";
      });
    }
