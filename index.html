<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>djRoute Master Roadbook</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a29;
      --card-alt: #0e1420;
      --cyan: #00e5ff;
      --green: #10b981;
      --orange: #f59e0b;
      --red: #f43f5e;
      --blue: #2563eb;
      --border: #233047;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: 12px;
      padding-bottom: 100px;
      -webkit-font-smoothing: antialiased;
    }

    /* BARRA SUPERIORE */
    header {
      background: linear-gradient(145deg, #162032, #0d131f);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .logo {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--cyan);
      letter-spacing: 1px;
    }
    .logo span { color: #fff; }
    
    .btn-sync {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff;
      border: none;
      padding: 9px 14px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 12px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    /* CARD DELLA TAPPA */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .card-head {
      background: #0f1624;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .card-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: var(--cyan);
    }
    .card-date {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 13px;
      font-weight: 700;
      background: #1e293b;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      color: #fff;
    }

    .card-body { padding: 14px; }

    /* TIMELINE PERCORSO */
    .route-box {
      border-left: 2px solid #334155;
      margin-left: 8px;
      padding-left: 16px;
      margin-bottom: 12px;
    }
    .route-point {
      position: relative;
      margin-bottom: 10px;
    }
    .route-point:last-child { margin-bottom: 0; }
    .route-point::before {
      content: '';
      position: absolute;
      left: -22px;
      top: 5px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #475569;
    }
    .route-point.dep::before { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .route-point.arr::before { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .route-point.via::before { background: var(--orange); }

    .point-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .point-city { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: 0.3px; }

    /* METEO ROTTA */
    .weather-box {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .weather-head {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .weather-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .weather-cell {
      flex: 0 0 auto;
      background: #141c2c;
      border: 1px solid #233147;
      border-radius: 8px;
      padding: 6px 10px;
      text-align: center;
      min-width: 78px;
    }
    .w-time { font-family: 'Chakra Petch', sans-serif; font-size: 11px; color: var(--orange); font-weight: 700; }
    .w-icon { font-size: 18px; margin: 2px 0; }
    .w-temp { font-size: 14px; font-weight: 800; color: #fff; }
    .w-rain { font-size: 10px; color: #60a5fa; }
    .w-name { font-size: 10px; color: var(--text-muted); max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* INFO LOGISTICA */
    .grid-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .grid-info div span { display: block; font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .grid-info div strong { color: #f1f5f9; font-size: 13px; }

    /* PULSANTI */
    .btn-myroute {
      display: block;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      color: #fff;
      text-align: center;
      border-radius: 8px;
      text-decoration: none;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      border: 1px solid #60a5fa;
    }
    .btn-myroute:active { transform: scale(0.98); }

    /* TASTO FLOTTANTE IN BASSO PER NUOVA TAPPA */
    .fab-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #0284c7, #00e5ff);
      color: #04101e;
      border: none;
      padding: 14px 20px;
      border-radius: 30px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4);
      cursor: pointer;
      z-index: 99;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .fab-btn:active { transform: scale(0.95); }

    /* MODALE CREAZIONE TAPPA */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      padding: 16px;
      overflow-y: auto;
    }
    .modal-box {
      background: #141c2b;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      max-width: 480px;
      margin: 20px auto;
    }
    .modal-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--cyan);
      margin-bottom: 14px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .btn-save {
      flex: 1;
      background: var(--green);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 800;
      font-size: 14px;
    }
    .btn-cancel {
      flex: 1;
      background: #334155;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="top-row">
      <div class="logo">🏍️ djRoute <span>2026</span></div>
      <button id="btnSyncCloud" class="btn-sync" onclick="sincronizzaCloud()">
        🔄 AGGIORNA
      </button>
    </div>
    <div class="status-row">
      <span id="syncStatus">Pronto</span>
      <span id="stageCounter">0 tappe</span>
    </div>
  </header>

  <!-- CONTENITORE TAPPE -->
  <main id="tappeContainer">
    <div style="text-align:center; padding:50px 20px; color:#94a3b8;">
      Tocca <strong>AGGIORNA</strong> in alto oppure <strong>➕ NUOVA TAPPA</strong> per iniziare.
    </div>
  </main>

  <!-- TASTO FLOTTANTE NUOVA TAPPA -->
  <button class="fab-btn" onclick="apriModaleNuovaTappa()">
    ➕ NUOVA TAPPA
  </button>

  <!-- MODALE PER CREARE TAPPE DAL TELEFONO -->
  <div id="modalTappa" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">🏍️ Inserisci Nuova Tappa</div>
      
      <div class="form-group">
        <label>Data Tappa (es. 15/05/2026)</label>
        <input type="text" id="inpData" placeholder="GG/MM/AAAA">
      </div>

      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Orario Partenza</label>
          <input type="time" id="inpOra" value="08:30">
        </div>
        <div class="form-group" style="flex:1;">
          <label>Costo Hotel (€)</label>
          <input type="number" id="inpSpesa" placeholder="0">
        </div>
      </div>

      <div class="form-group">
        <label>Città di Partenza</label>
        <input type="text" id="inpPartenza" placeholder="es. Tione di Trento">
      </div>

      <div class="form-group">
        <label>Passaggi / Valichi intermedi</label>
        <input type="text" id="inpPassaggio" placeholder="es. Passo Gavia, Passo Stelvio">
      </div>

      <div class="form-group">
        <label>Città di Arrivo</label>
        <input type="text" id="inpArrivo" placeholder="es. Bormio">
      </div>

      <div class="form-group">
        <label>Nome Hotel / Alloggio</label>
        <input type="text" id="inpAlloggio" placeholder="es. Hotel Cristallo">
      </div>

      <div class="form-group">
        <label>Link MyRoute-app / Percorso</label>
        <input type="url" id="inpMyRoute" placeholder="https://www.myrouteapp.com/...">
      </div>

      <div class="form-group">
        <label>Note Roadbook</label>
        <input type="text" id="inpNote" placeholder="es. Parcheggio interno moto compreso">
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="chiudiModaleNuovaTappa()">ANNULLA</button>
        <button class="btn-save" onclick="salvaNuovaTappa()">💾 SALVA TAPPA</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSg_iYdW33G7M2RDvckqApsOKZC614zho4-qTsk0ow_Bx3EmrN_kVusQIPyr8qeEC-5w/exec";
    const GEO_CACHE = {};

    window.addEventListener("DOMContentLoaded", () => {
      const cached = localStorage.getItem("djRoute_tappe_attive");
      if (cached) {
        try {
          renderRoadbook(JSON.parse(cached));
        } catch(e) { console.error(e); }
      }
    });

    async function sincronizzaCloud() {
      const btn = document.getElementById("btnSyncCloud");
      const status = document.getElementById("syncStatus");

      btn.disabled = true;
      btn.innerHTML = "⏳ CARICO...";
      status.innerText = "Download tappe...";

      try {
        const url = SCRIPT_URL + "?_nocache=" + new Date().getTime();
        const response = await fetch(url);
        if (!response.ok) throw new Error("Errore API");

        const tappe = await response.json();
        if (!Array.isArray(tappe) || tappe.length === 0) {
          alert("Nessuna tappa trovata nel foglio.");
          status.innerText = "Nessuna tappa";
          return;
        }

        localStorage.setItem("djRoute_tappe_attive", JSON.stringify(tappe));
        status.innerText = "Calcolo meteo e percorsi...";
        await renderRoadbook(tappe);
        
        const now = new Date();
        status.innerText = `Aggiornato: ${now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
      } catch (err) {
        console.error(err);
        alert("Errore durante la sincronizzazione con Google Sheets.");
        status.innerText = "Errore connessione";
      } finally {
        btn.disabled = false;
        btn.innerHTML = "🔄 AGGIORNA";
      }
    }

    /* MODALE CREAZIONE NUOVA TAPPA */
    function apriModaleNuovaTappa() {
      const cached = localStorage.getItem("djRoute_tappe_attive");
      if (cached) {
        try {
          const tappe = JSON.parse(cached);
          if (tappe.length > 0) {
            const ultima = tappe[tappe.length - 1];
            if (ultima.arrivo) document.getElementById("inpPartenza").value = ultima.arrivo;
          }
        } catch(e) {}
      }
      document.getElementById("modalTappa").style.display = "block";
    }

    function chiudiModaleNuovaTappa() {
      document.getElementById("modalTappa").style.display = "none";
    }

    async function salvaNuovaTappa() {
      const dataStr = document.getElementById("inpData").value.trim();
      const partenza = document.getElementById("inpPartenza").value.trim();
      const arrivo = document.getElementById("inpArrivo").value.trim();

      if (!partenza || !arrivo) {
        alert("Inserisci almeno Partenza e Arrivo!");
        return;
      }

      const nuovaTappa = {
        data: dataStr || "Data N/D",
        ora: document.getElementById("inpOra").value || "08:30",
        partenza: partenza,
        passaggio: document.getElementById("inpPassaggio").value.trim(),
        arrivo: arrivo,
        alloggio: document.getElementById("inpAlloggio").value.trim(),
        piattaforma: "",
        spesa: parseFloat(document.getElementById("inpSpesa").value) || 0,
        pagamento: "Da pagare",
        pagato: 0,
        daPagare: parseFloat(document.getElementById("inpSpesa").value) || 0,
        metodoPagamento: "",
        parcheggio: "",
        note: document.getElementById("inpNote").value.trim(),
        myRouteUrl: document.getElementById("inpMyRoute").value.trim()
      };

      // 1. Salva subito localmente per averla subito a video
      let tappe = [];
      const cached = localStorage.getItem("djRoute_tappe_attive");
      if (cached) {
        try { tappe = JSON.parse(cached); } catch(e){}
      }
      tappe.push(nuovaTappa);
      localStorage.setItem("djRoute_tappe_attive", JSON.stringify(tappe));
      renderRoadbook(tappe);
      chiudiModaleNuovaTappa();

      // 2. Invia la tappa a Google Sheets in background
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(nuovaTappa)
        });
        alert("✅ Tappa salvata sia sull'App che sul Foglio Google!");
      } catch (err) {
        console.warn("Invio cloud non riuscito, tappa salvata solo offline:", err);
      }
    }

    /* GEOCODIFICA E METEO ROTTA */
    async function geocode(location) {
      if (!location) return null;
      const cleanLoc = location.trim().toLowerCase();
      if (GEO_CACHE[cleanLoc]) return GEO_CACHE[cleanLoc];

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(location)}&limit=1`);
        const data = await res.json();
        if (data && data.length > 0) {
          const coords = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
          GEO_CACHE[cleanLoc] = coords;
          return coords;
        }
      } catch (e) {}
      return null;
    }

    function getWmoInfo(code) {
      if (code === 0) return { icon: "☀️", label: "Sereno" };
      if ([1, 2].includes(code)) return { icon: "🌤️", label: "Poco Nuvoloso" };
      if (code === 3) return { icon: "☁️", label: "Coperto" };
      if ([45, 48].includes(code)) return { icon: "🌫️", label: "Nebbia" };
      if ([51, 53, 55].includes(code)) return { icon: "🌦️", label: "Pioggerella" };
      if ([61, 63, 65].includes(code)) return { icon: "🌧️", label: "Pioggia" };
      if ([71, 73, 75].includes(code)) return { icon: "🌨️", label: "Neve" };
      if ([80, 81, 82].includes(code)) return { icon: "🌦️", label: "Rovescio" };
      if ([95, 96, 99].includes(code)) return { icon: "⛈️", label: "Temporale" };
      return { icon: "🌡️", label: "Variabile" };
    }

    async function getPointWeather(lat, lon, dateStr, hourInt) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,weather_code&timezone=auto&forecast_days=14`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.hourly) {
          const targetIndex = hourInt;
          const temp = Math.round(data.hourly.temperature_2m[targetIndex] || 20);
          const rain = data.hourly.precipitation_probability[targetIndex] || 0;
          const code = data.hourly.weather_code[targetIndex] || 0;
          const wmo = getWmoInfo(code);
          return { temp, rain, icon: wmo.icon };
        }
      } catch (e) {}
      return { temp: "--", rain: 0, icon: "🌤️" };
    }

    async function renderRoadbook(tappe) {
      const container = document.getElementById("tappeContainer");
      const counter = document.getElementById("stageCounter");
      container.innerHTML = "";
      counter.innerText = `${tappe.length} tappe caricate`;

      for (let i = 0; i < tappe.length; i++) {
        const t = tappe[i];
        const card = document.createElement("article");
        card.className = "card";

        let btnRouteHtml = "";
        if (t.myRouteUrl && t.myRouteUrl.trim().startsWith("http")) {
          btnRouteHtml = `<a href="${t.myRouteUrl.trim()}" target="_blank" class="btn-myroute">🚀 APRI IN MYROUTE-APP</a>`;
        } else {
          const gmaps = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(t.partenza)}&destination=${encodeURIComponent(t.arrivo)}${t.passaggio ? '&waypoints=' + encodeURIComponent(t.passaggio) : ''}`;
          btnRouteHtml = `<a href="${gmaps}" target="_blank" class="btn-myroute">🗺️ APRI IN MAPPA</a>`;
        }

        const baseOra = t.ora ? parseInt(t.ora.split(":")[0]) || 8 : 8;
        const baseMin = t.ora ? parseInt(t.ora.split(":")[1]) || 30 : 30;

        card.innerHTML = `
          <div class="card-head">
            <span class="card-title">TAPPA #${i + 1}</span>
            <span class="card-date">${t.data || 'DATA N/D'}</span>
          </div>

          <div class="card-body">
            <div class="route-box">
              <div class="route-point dep">
                <div class="point-label">Partenza (Ore ${t.ora || '08:30'})</div>
                <div class="point-city">${t.partenza || 'N/D'}</div>
              </div>
              ${t.passaggio ? `
              <div class="route-point via">
                <div class="point-label">Passaggi / Valichi</div>
                <div class="point-city" style="font-size:14px; color:#cbd5e1;">${t.passaggio}</div>
              </div>` : ''}
              <div class="route-point arr">
                <div class="point-label">Arrivo / Pernottamento</div>
                <div class="point-city">${t.arrivo || 'N/D'}</div>
              </div>
            </div>

            <!-- METEO STEP 45 MIN -->
            <div class="weather-box">
              <div class="weather-head">
                <span>METEO ROTTA (STEP 45 MIN)</span>
                <span style="color:#94a3b8;">Open-Meteo HD</span>
              </div>
              <div class="weather-scroll" id="weather-timeline-${i}">
                <div class="weather-cell"><div class="w-time">--:--</div><div class="w-icon">⏳</div><div class="w-temp">Calcolo...</div></div>
              </div>
            </div>

            <!-- LOGISTICA -->
            <div class="grid-info">
              <div><span>Alloggio</span><strong>${t.alloggio || 'Libero / Tenda'}</strong></div>
              <div><span>Parcheggio</span><strong>${t.parcheggio || 'Non spec.'}</strong></div>
              <div><span>Spesa Prevista</span><strong>${t.spesa ? t.spesa + ' €' : '-'}</strong></div>
              <div><span>Residuo</span><strong style="color:${t.daPagare > 0 ? '#f43f5e' : '#10b981'}">${t.daPagare > 0 ? t.daPagare + ' €' : 'Saldato'}</strong></div>
            </div>

            ${t.note ? `<div style="font-size:12px; color:#fde68a; margin-bottom:12px; background:#1c2536; padding:8px 10px; border-radius:6px;">📌 ${t.note}</div>` : ''}

            ${btnRouteHtml}
          </div>
        `;

        container.appendChild(card);

        // Meteo asincrono lungo la rotta
        (async (idx, tappa, bH, bM) => {
          const wCont = document.getElementById(`weather-timeline-${idx}`);
          if (!wCont) return;

          const steps = [];
          if (tappa.partenza) steps.push({ loc: tappa.partenza, deltaMin: 0 });
          if (tappa.passaggio) {
            tappa.passaggio.split(",").forEach((p, pIdx) => {
              steps.push({ loc: p.trim(), deltaMin: (pIdx + 1) * 45 });
            });
          }
          if (tappa.arrivo) {
            const lastMin = steps.length > 1 ? steps[steps.length - 1].deltaMin + 45 : 90;
            steps.push({ loc: tappa.arrivo, deltaMin: lastMin });
          }

          let stepsHtml = "";
          for (const s of steps) {
            const totMin = bH * 60 + bM + s.deltaMin;
            const h = Math.floor(totMin / 60) % 24;
            const m = totMin % 60;
            const timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

            const coords = await geocode(s.loc);
            let w = { icon: "🌤️", temp: "--", rain: 0 };
            if (coords) w = await getPointWeather(coords.lat, coords.lon, tappa.data, h);

            stepsHtml += `
              <div class="weather-cell">
                <div class="w-time">${timeStr}</div>
                <div class="w-icon">${w.icon}</div>
                <div class="w-temp">${w.temp}°C</div>
                <div class="w-rain">💧${w.rain}%</div>
                <div class="w-name">${s.loc}</div>
              </div>
            `;
          }
          wCont.innerHTML = stepsHtml || `<div style="font-size:11px; color:#64748b;">Meteo non disponibile</div>`;
        })(i, t, baseOra, baseMin);
      }
    }
  </script>
</body>
</html>
